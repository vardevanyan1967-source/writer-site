ԵԿ ՄՏԱ"},"group":{"hy":"353"},"text":{"hy":"Ես երեկ մտա գերեզմանատուն,\nԴատարկվեց աչքիս անգամ մեղրածոր\nԱրևագալի կանչը շիկացած.\nՔամու սարսուռը՝\nԻր զգայազուրկ մոլեգին կրքով\nՇուրթերս է ծամում,\nՁեռքերս ցասկոտ առաջ են սահում,\nՄինչդեռ քայլերս ինձ տանում են ետ,\nՈւ ես ճչացի պարտվողի նման.\n-Մարդի՛կ, կերտեցե՛ք բարության տաճար,\n-Մարդի՛կ, գոցեցե՛ք չարությունը ձեր...\n\nԻսկ այնտեղ, այնտեղ հեկեկոցի մեջ,\nԴեռ չհամբուրված մի թուխ աղջկա\nՀագցնում էին շապիկը հողի..."}},{"title":{"hy":"ԱՅՍ ԳԻՇԵՐ"},"group":{"hy":"353"},"text":{"hy":"Այս գիշեր իմ սիրտը ցավում է,\nՎառեցե՛ք լույսերը իմ տան.\nԲա՛ց արեք օդանցքները լայն,\nԱյս գիշեր իմ սիրտը լացում է։\n\nԱրցունքիդ լույսը վիրավոր\nԸնկել է սեղանիս խռոված.\nԵ՛տ շրջեք փեղկերը բոլոր,\nԵ՛տ բերեք օրերն իմ կորած...\n\nԱյս գիշեր իմ սիրտը վառվում է\nՔո թողած ցավի մեջ, իմ սեր,\nԱռանց քեզ իմ լույսը հանգչում է,\nԹախիծս առնում է թևեր..."}},{"title":{"hy":"ՁՅՈՒՆԵՐԸ"},"group":{"hy":"353"},"text":{"hy":"Ձյուները մեռնում են շշուկով,\nՇշուկով զարթնում են լեռները.\nԿարոտս թաղում եմ շշուկով,\nՇշուկով լալիս են ցավերս։\n\nՁորերը խոսում են շշուկով,\nՇշուկով բացվում է խռովքս.\nԱչքերդ մխում են շշուկով,\nՇշուկով ծնվում են երգերս։"}},{"title":{"hy":"ԱՆՁՐԵՎԻՑ ԱՌԱՋ"},"group":{"hy":"353"},"text":{"hy":"Անձրևից առաջ գունատ է լինում մեղրածաղիկը,\nԵվ լորերն արտի թմրած են լինում.\n\nԲայց ինչ-որ մի տեղ, անձրևից առաջ,\nԷլեկտրոնիկ հաշվարկով անձայն\nՀաշվում են, պարզում\nՀողին ներծծված իմ ու քո հոգու\nՃառագայթային հիվանդությունը...\n\nՀեզ ու պարզ անձրև, բարության նման\nԻջի՛ր խենթ հողին... մաքրի՛ր ու լվա՛\nԱյս ամենակուլ ճառագայթային\nհիվանդությունը...\n\nԱնձրևից հետո, անձրևից հետո,\nԿարմիր է լինում մեղրածաղիկը,\nԵվ լորերն արտի սաղմոս են երգում..."}},{"title":{"hy":"ԵԹԵ ՕՐԵՐԸ ՇՏԱՊՈՒՄ ԵՆ"},"group":{"hy":"353"},"text":{"hy":"Եթե օրերը շտապում են իրենց մեջ պահելու\nՉար ոգիների պատմությունները,\n-Ես կշշնջամ՝ օրերը սև են.\n\nԵթե լուսնոտի տաք շշուկները\nԹափվեին լույսի եղջյուրների մեջ,\n-Կասեմ՝ շշուկը կրակի ճիչն է.\n\nԵթե բաց դաշտում\nՄարտի մաքառման փողեր են հնչում՝\nՔեզ տրորելու, այրելու կրքով,\n-Ես կասեմ՝ մարտը կյանքի սարսուռն է։\n\nԵթե օրերը ուզում են ջնջել\nԱնմար դեմքերի պատմությունները,\n-Ես կշշնջամ՝ օրերը սուտ են..."}},{"title":{"hy":"ԵՍ ՉՀԱՍԿԱՑԱ"},"group":{"hy":"353"},"text":{"hy":"Ես չհասկացա,\nՈր ճառագայթը ճամփին է բացվում,\nՔարածխի մեջ, անգամ չոր սրտում,\nԵվ աստղից իջնող մախմուր ծաղիկը\nՍպիների մեջ ծաղկում է հաճախ։\n\nԲախտս չբերեց, ես չհասկացա,\nԵվ իմ ցողունը ես կոխոտեցի,\nՈւ չզարմացա...\nՈր բարկ արևից գերանն է փտում,\nԾլում է սունկը խեժի մեջ կանաչ,\nԵվ ծերանում է բառը բերանում...\n\nԵս չհասկացա,\nՈր հոգսը մեկ-մեկ արցունք է բերում,\nՀույսը հոգնում է հանքափորի պես,\nԾլում է սերը աչքի մեջ կանաչ,\nԵվ քնքշանում է լույսը փեթակում..."}},{"title":{"hy":"ՄՐՍԱԾ ԱՅԳՈՒՍ"},"group":{"hy":"353"},"text":{"hy":"Մրսած այգուս շուքի տակ, ձյունը թափվում էր,\nթափվում,\nԲալու ծաղիկ էր ասես, ծածկում հետքերն իմ անցած.\nԵվ ցած թափվող փաթիլի ձայների մեջ համրացած՝\nՍև ագռավներն են երգում տաք բուքի մեջ գրկված։\n\nԿրակի պես շիկացած, երեք անմեղ աստվածներ,\nԻմ հետքերի ծխի մեջ փաթիլի լույս են տանում.\nՁյունի մրսած բեռի տակ՝ երեք անհաշտ բալիկներ,\nԹոթովում են գարուններ՝ ձեռքում բռնած արևներ..."}},{"title":{"hy":"ԵՐԲ ՈՐ"},"group":{"hy":"353"},"text":{"hy":"Երբ որ արևի նվագն է լռում լեռների շուրթին,\nՀեռու կանչերի կարեկցանքի հետ,\nՋրի խշշոցն է ականջներիս մեջ խլանում\nանհաշտ,\nԵվ մեղուների մորմոքը վհատ,\nԵվ խշխշոցը պաղ խաշամների։\n\nԶովերի միջով ես քեզ եմ գալիս,\nԱզատ, անշղթա նախամարդու պես,\nՈւ էլ չեմ լսում\nՈ՛չ մեղուների մորմոքը վհատ,\nՈ՛չ էլ խշշոցը չոր խաշամների։\n\nԵվ խենթ հուշերն իմ թաքուն երազով\nԽանդ են հորինում,\nԻմ կարոտն անխոս, որ քեզ չի գրկում,\nԻնձ թվում է, թե\nԻմ աչքերի մեջ ցավեր կան պառկած,\nԵվ շրթունքներս պաղ են սառցի պես...\nԵրբ որ արևի նվագն է լռում լեռների շուրթին,\nԻնձ թվում է, թե\nԴեղին պատրանքին ու թախիծին սև,\nՎաղուղ, վաղուց եմ փեսացու դարձել։"}},{"title":{"hy":"ԻՆՁ ԷԼ"},"group":{"hy":"353"},"text":{"hy":"Ինձ էլ բութ կացինով տաշեցին,\nՇոյեցին ինձ թավշե մատներով.\nԻմ միջից խարույկներ հանեցին,\nԱյրեցին կարոտն իմ գիշերով։\n\nԻնձ ներսից աքցանով դաղեցին,\nԵվ դրսից աճեցին կոշտուկներ.\nԻմ միջից արցունքներ զտեցին,\nԹաղեցին թախիծն իմ գիշերով։\n\nՄոտիկից, մոտիկից լուսաշիթ\nՓաթիլներ են հալվում արցունքի.\nԺայռերը փլվում են դողալով,\nՈր ոչ ոք իր գութը չծախի..."}},{"title":{"hy":"ԱՆՁՐԵՎՆ ԷԼԻ ՄԱՂՎԵՑ"},"group":{"hy":"353"},"text":{"hy":"Անձրևն էլի մաղվեց,\nԻմ հուշերի աստղիկները չբացվեցին.\nԱրագիլը կանչեց,\nԾեր հանդերի կակաչները չծաղկեցին...\n\nԹուխպը թառեց սարին,\nՍահմռկելով բերդ ու քարափ խառնվեցին.\nՈտքս կպավ լույսին,\nԾառերն աղմկեցին..."}},{"title":{"hy":"ԹԱՓԱՐՎԱՆԻ ԺԱՅՌԻՆ"},"group":{"hy":"353"},"text":{"hy":"Թափարվանի ժայռին մասրենին է ծխում,\nՀրաբուխ է կարծես ունքերի տակ ժայռի.\nԵվ ցերեկն է շարժվում հղացումով կարմիր,\nՈրտեղ օդը վճիտ ծաղիկներ է խմում։\n\nԵս քերծերի միջով իջնում էի ձորը,\nՈւ խլացած ձորում, լուսնոտի պես գունատ,\nՄի սիրտ տեսա շաղոտ շշուկներով լացող...\nՈւ մանկության ժայռիս թեժ մասրենու ունքից,\nՀեծեծանքով կարծես, կարմիր արցունք\nկաթեց։"}},{"title":{"hy":"ԹԵ ՁԵՐ ԱՉՔԵՐՈՎ"},"group":{"hy":"353"},"text":{"hy":"Թե ձեր աչքերով գարունն իմ մուրամ,\nԴուք մի՛ ծիծաղեք իմ բախտի վրա.\nԹե ձեր երազով ես ճախրեմ հանկարծ,\nԴուք փլված հոգուս պատեր մի՛ շարեք,\nԹուլության համար երեսով չտաք,\nԵվ չկշտամբեք հեզության համար...\nԵս նա եմ եղել, ով կյանքում երբեք\nԺամանակից շուտ թմբուկ չի խփել,\n\nՍակայն բախտը ինձ թաքուն հուշել է\nԱռաջ չվազել և ետ չմնալ.\n\nԱյդպես է հուշել բախտն ինձ թաքուն,\nԲայց հակառակն եմ անում միշտ կյանքում։"}},{"title":{"hy":"ՌՈԲԵՐՏԻՆ"},"group":{"hy":"353"},"text":{"hy":"Դու չկաս, գոցվում են մատներս,\nՀոգնել է իմ աչքը, չի ծաղկում,\nԴու չկաս, թվում է՝ խաբված եմ,\nԵվ սուտ եմ ոսկեցոլ մոմի պես...\nԵրազիս թռչունը չի թռչում,\nՉի գնում արևներ բերելու,\nԴու չկաս, աշուն է գարունը,\nՄրսել է իմ կյանքի մաճկալը,\nԹրջում է բալենիս ու լույսը...\n......................................................\n......................................................\nԴու չկաս, անեծք է նոր սերը։"}},{"title":{"hy":"ԵՂԵԼ Է"},"group":{"hy":"353"},"text":{"hy":"Եղել է, որ ես ահից լռել եմ,\nԹեկուզ սրտիս մեջ ամպրոպ է եղել.\nԵղել է նաև՝ ես ծիծաղել եմ,\nԵրբ ինձ խաբել են։\n\nԵղել է՝ լույսը ես շալակել եմ,\nԹեկուզ աչքիս մեջ մութն է ծերացել.\nԵղել է նաև՝ թախծից մեռել եմ,\nԱչքդ տեսել է և ուրախացել։\n\nԱյսպես է եղել իմ անսուտ կյանքը\nԱմեն մի ծաղկի լռած երգի մեջ.\nՄի բուռ ավազ է եղել իմ կյանքը\nԱյս մեծ աշխարհի կապույտ թասի մեջ։"}}]},{"id":"book-3","cover":"img/book-3.jpg","year":"1986","title":{"hy":"ՀԵՌԱՑՈՂ ԼԵՌՆԵՐ"},"desc":{"hy":"Հեղինակի երրորդ ժողովածուն, հրատարակված 1986 թվականին։"},"chapters":[{"title":{"hy":"ԽՈՐԴԵՆԻ"},"group":{"hy":"ԿՈՀԱԿՆԵՐ"},"text":{"hy":"                        ԿՈՀԱԿՆԵՐ\n\nԽՈՐԴԵՆԻ\nԲույրդ բաց, խորդենի՛,\nԹող մեղուն խենթանա,\nՋուրը լա ժայռի տակ։\n\nԾոցդ բաց, խորդենի՛,\nԹող կապույտը հարբի,\nՑուրտը լա պատի տակ։\n\nՇունչդ բաց, խորդենի՛,\nԹող ցասումը պարպվի,\nԿավը լա թոնի տակ։\n\nԹևդ բաց, խորդենի՛,\nԴու ջութակն ես դաշտի.\nԱռաքիր մեղեդի,\nԹող կարոտը հալվի,\nՍերը լա ծառի տակ։"}},{"title":{"hy":"ԻՄ ԳՈՀՈՒԹՅՈՒՆԻՑ"},"group":{"hy":"ԿՈՀԱԿՆԵՐ"},"text":{"hy":"Իմ գոհությունից\nԵրկինքը ժպտաց,\nԿասկածանքներս\nՔամեցի գետում։\n\nԻմ գոյությունից\nԲալենին ծաղկեց,\nՉարություններս\nԷրնեցի հանդում։\n\nԻմ բարությունից\nԼույսը ծարավեց,\nԹշնամիներս\nՄնացին ծարավ։"}},{"title":{"hy":"ԳՈՒՅՆԸ"},"group":{"hy":"ԿՈՀԱԿՆԵՐ"},"text":{"hy":"Գույնը մերկ կին է.\nՀալվում է անուշ,\nՄառախուղի մեջ\nԴառնում է խմիչք։\n\nԳույնը պտուղ է.\nՓափուկ օդի մեջ\nԽլում է դեմքս,\nԴառնում է ծաղիկ։\n\nԳույնը մասուր է.\nՀեթանոս դաշտում\nՆրա տաք բույրը\nՄեղուն է տանում։"}},{"title":{"hy":"ՊԱՐԳԵՎԵՔ ԻՆՁ ԾԻԾԱՂ"},"group":{"hy":"ԿՈՀԱԿՆԵՐ"},"text":{"hy":"Պարգևեք ինձ ծիծաղ.\nԿունենամ ես աչքեր,\nՇատրվան ոսկեցոլ,\nԿունենամ ես երազ,\nՄեղեդի ծարաված։\n\nՊարգևեք ինձ ծիծաղ.\nԱկացիան լալիս է՝\nՊարուրված մրմունջով,\nԱնձրևի թախիծով\nԿարոտս խաչվում է։\n\nՊարգևեք ինձ ծիծաղ,\nՄրգահոտ առավոտ,\nԻմ ներսում կրակ է,\nՄեղեդի ծարաված..."}},{"title":{"hy":"ԵՍ ԻՆՁ ԵՄ ՆՄԱՆ"},"group":{"hy":"ԿՈՀԱԿՆԵՐ"},"text":{"hy":"Իմ դժվար պահին ինձ եմ ես նման,\nԵվ ինձ են նման ջրերը լացող.\nՄեկը իրեն է շալակել տանում,\nԱսում են՝ ես եմ այդ խելառ տղան։\n\nԻմ քինոտ պահին ինձ եմ ես նման,\nԵվ ինձ են նման ձյուները մրսող.\nՄեկը իրեն է մտրակել դաժան,\nԱսում են՝ ինձ է ձայնում այդ տղան։\n\nԻմ տկար պահին ինձ եմ ես նման,\nԵվ ինձ են նման թերթերը թափվող.\nՄեկը իրեն է կողոպտել ծածուկ,\nԱսում են՝ ես եմ կողոպտված տղան։\n\nԻմ ծաղկած պահին ինձ եմ ես նման,\nԵվ ինձ են նման հասկերը թռչող,\nՄեկը իրեն է պսակել թաքուն,\nԱսում են՝ ես եմ պսակված տղան։"}},{"title":{"hy":"ԵՐԿԻՐ ՀԱՅԱՍՏԱՆ"},"group":{"hy":"ԿՈՀԱԿՆԵՐ"},"text":{"hy":"...Դու աշխարհ եկար\nԻմ սեգ պապերի արդար պահանջով՝\nԿրելով քո մեջ լույսի պատարագ\nԵվ աստղի գարմանք։\nԴու աշխարհ եկար,\nՈր ես ունենամ\nԱրծվի սխրանք ու մանգաղների\nՇողքը արծաթե,\nՈր ես ունենամ\nԱրմատ ու ողկույզ,\nՍաղարթի սոսափ՝\nՆաիրյան դաշտից մինչև արեգակ։\n\nԴու աշխարհ եկար\nՈսկե երկնքով,\nՈւ ինձ մխացրիր,\nԴո՛ւ, միակ իմ վանք։\n\nԵս զուր չեմ խմել ջրերը քո ջինջ,\nԱրտի ոսկու մեջ բերկրանք եմ խառնել,\nԵվ սրտանց ատել շողոքորթներին,\nՈրոնք իրենց սուտ ձև ու խոհերով\nՀավատում են միշտ,\nԹե քեզ են սիրում...\nԵս չեմ հավատում,\nԱտում եմ նրանց,\nՈվքեր ամեն օր,\n\nՇահ-հաջողության համար իրենց զուտ,\nՔո անունով են ասպարեզ մտել,\nԵվ պարծեցել են նրանք քեզանով,\nԵրկիր ՀԱՅԱՍՏԱՆ։\n\nՈ՛չ,\nԿեղծավորը չեմ եղել ես քո,\nԵս քո որդին եմ,\nԵվ գործն իմ ազնիվ\nԶինվորականի երդման է նման.\nԴրա համար էլ կրկնում եմ ես՝\nՉկա ուրիշ բախտ,\nՔան լինել քո մեջ,\nԵվ քեզ նմանվել,\nԵվ լինել շռայլ,\nԻնչպես բերքախոս դաշտն Արարատյան,\nԵվ հպարտ,\nԻնչպես լեռն Արագած,\nԵվ միշտ անբաժան,\nԻնչպես...աստղերը,\nԵվ քոնը լինել առանց ավելցուկ...\nԵվ քոնը լինել արմատով, ձայնով\nՈւ...Մասիսներով։"}},{"title":{"hy":"ԱՌԱՎՈՏ ԿԱՆՈՒԽ"},"group":{"hy":"ԿՈՀԱԿՆԵՐ"},"text":{"hy":"Առավոտ կանուխ ինձ կասկածեցի,\nԲայց հազար հոգի զարմացան անխոս.\nԻմ մի իմաստուն լույսի սադրանքից\nՔամում է մարջան, որ ինձ նշմարեմ։\n\nՄի լալկան ցերեկ ես ինձ խաբեցի,\nԲայց հազար հոգի հիացան խինդով,\nԻսկ մի երգասաց՝ ջութակի ձայնով\nԵրգ է հոլովում, որ ինձ ծանակեմ։\n\nՈւ մի ցուրտ գիշեր ինձ խարդախեցի,\nԲայց հազար հոգի տխրեցին ցավով.\nԻսկ մի ծեր պանդուխտ, խանձող աչքերով,\nԿայծակ է պայտում, որ ինձ ճշմարտեմ։"}},{"title":{"hy":"ԼՈՒՅՍՆ ԱՐԹՆԱՑԱՎ"},"group":{"hy":"ԿՈՀԱԿՆԵՐ"},"text":{"hy":"Լույսն արթնացավ...\nՈւ կապույտը\nՍիրտ գողացավ...\n\nՈւ...կարմիրը\nՍերմնացան էր,\nԿրծքին սեղմեց\nՀազար ծաղիկ, հազար դաշտ,\nԴարձավ կրակ, դարձավ խունկ,\nՀողը խնդաց,\nՀողը նորից մայրացավ,\nՏեսավ հանդում\nՀազար կռունկ, հազար լույս...\nԼույսը հոսեց,\nՈւ թովչանքը\nՈգելից էր խմիչքի պես,\nՈւ զարթոնքը\nԿաթնագույն էր ու լանջաբաց...\nԳնաց օրվա հունձքը տանի։"}},{"title":{"hy":"ԹԵ ԻՆՁ ԿՈՂՈՊՏԵՄ"},"group":{"hy":"ԿՈՀԱԿՆԵՐ"},"text":{"hy":"Թե ինձ կողոպտեմ,\nԴուք մի՛ զարմացեք...\nԵս ինձ եմ հերքում...\nԹե կռունկ որսամ,\nՊատանդեք հոգիս,\nԹե հողն իմ լքեմ,\nԻմ բաց թիկունքին\nԳնդակներ խրեք։\nՈւ թե սեր մուրամ,\nԹողեք շուրթերս\nՄոտեցնեմ տաքշող\nԴաշտերին հայոց,\nՈր իմ հավատը\nԴրսում չմնա..."}},{"title":{"hy":"ՈՒԶՈՒՄ ԵՄ"},"group":{"hy":"ԿՈՀԱԿՆԵՐ"},"text":{"hy":"Ուզում եմ ապրել օրերի վարձով\nԵվ առաջ ընկնել իմ մաքրությունից,\nԹրծել իմ կամքը հավատքի ուժով,\nԻմ թուլությունը թոթափել ինձնից։\n\nՈւզում եմ ձաղկել ցավը երկակի,\nԱմբարել ճիչը սուգ ու սարսափի,\nԵվ միջուկային ավերող զենքի\nՎտառը քամել պողպատաձեռով...\n\nՉապրել մեծ կյանքում որպես ավելցուկ,\nՊատիժ չկրել ծույլ խելքի ձեռից,\nԿարմիրը նորից արարել երկինք\nԵվ չկողպեքել կարոտը ներսից։"}},{"title":{"hy":"ԻՄ ԱՅՍ ԿՅԱՆՔԻ"},"group":{"hy":"ԿՈՀԱԿՆԵՐ"},"text":{"hy":"Իմ այս կյանքի բարակ ճամփին\nՆերհակ ուժերն են ծառանում.\nՄերթ սարքովի, մերթ էլ նեցուկ\nՑավեր ծեփում իմ տաք կավից։\n\nԽլում են հույս, թաղում երազ,\nԵվ կարկատում բառեր սառցե,\nՈր ես իսպառ խելքս խմեմ,\nՊատանքեմ ինձ ու պատժվեմ...\n\nԻմ այս կյանքի բոբիկ ճամփին\nՉփորձեցի ինքս ինձ գրկել,\nԱ՜խ, երանի թևերն իմ խեղճ\nՄի զույգ հենակ ունենային..."}},{"title":{"hy":"ԵՐԿԱԿԻ ՁԱՅՆ"},"group":{"hy":"ԿՈՀԱԿՆԵՐ"},"text":{"hy":"1\n\nՋուրը տարավ\nԻմ սերմնացուն...\nԻմ մենավոր ծառն աղմկեց։\n\n2\n\nՎերջին պատառն իմ տվեցի\nՄի ճամփորդի,\nՈւ նա ժպտաց աղբյուրի պես։\n\n3\n\nԱմռան տապին\nՄի ծեր անցորդ\nՊաղ ջուր խնդրեց,\nԵս թան բերի դաշտի բույրով,\nՆա զարմանքից շուրթը կծեց,\nՈւ...հեռացավ կարոտի պես։\n\n4\n\nՄիջօրեին\nՑավն ինձ սեղմեց,\nՈւ ինձ թվաց՝\nԻնձ հագցրին զսպաշապիկ.\n\nՈւ ես անխոս հալվում էի...\nԵրբ ներս մտավ\nՃամփորդը ծեր,\nՃանաչեցի...\nՆա վանկարկեց բառեր ոսկե\nՈւ թեյ տվեց ուրցի բույրով...\nԱյդ միջոցին դուռը բացվեց,\nՈւ ներս մտավ կաղը գինով՝\nԴեմքին՝ ժպիտ, սրտին՝ խռովք,\nԱչքին՝ գոհար, մտքին՝ մոլուցք,\nՇուրթերի մեջ՝ երկակի ձայն.\nՄեկ՝ քաղցրություն,\nՄեկ՝ դառնություն,\nՈւ երկակի աղերսանքով\nՆա պահանջեց թղթադրամ...\nՈւ երբ գնաց,\nԴժբախտ աչքով\nՆա ինձ չափեց,\nԵվ հոխորտաց բառեր սառցե...\n\n5\n\nԲայց չիմացավ,\nՈր այդ պահին\nՀողից թաքուն\nՄի հույս մեռավ։"}},{"title":{"hy":"ԹՌՉՈՒՆՆԵՐԻ"},"group":{"hy":"ԿՈՀԱԿՆԵՐ"},"text":{"hy":"Թռչունների կայտառ պատարագի առաջ\nԵս գնում եմ համառ՝\nՍերմնացանի նման.\nՈւ ես գիտեմ՝ մի օր\nԿամքս պիտի զինի\nՍերմնացանը միայն,\nՈւ գնում եմ, գնում,\nՍերմնացանի նման։\n\nԵվ իմ բախտի կարմիր պաշարները ուսած՝\nԵս գնում եմ թաքուն՝\nՆվաստների նման,\nԹեև գիտեմ՝ մի օր\nՄուխս պիտի մարեն\nՆվաստները միայն.\nԲայց գնում եմ թաքուն՝\nՆվաստների նման։\n\nԻմ հույսերի կապույտ ճառագայթը գրկած՝\nԵս գնում եմ զորեղ՝\nՀոգնածների նման,\nՈւ լավ գիտեմ՝ մի օր\nՑավս պիտի տանեն\nՀոգնածները միայն.\nՈւ գնում եմ, գնում,\nՀոգնածների նման։"}},{"title":{"hy":"ՑԱՎԻ ՊԱՏԱՐԱԳ"},"group":{"hy":"ԿՈՀԱԿՆԵՐ"},"text":{"hy":"           Շավարշ Մուղնեցյանին\n\nՈ՞ւր են քեզ տանում...\nԳետակը մնաց\nՁորի կոկորդում,\nԽոտը չորացավ\nՑամաք երկնքում։\n\nՈ՞ւր են քեզ տանում...\nՑավս մեծացավ\nԲարդու կողերին,\nԷլի մայրացավ\nՑավի պատարագ...\n\nՈ՞ւր են քեզ տանում...\nԱրևը խունկ է\nՓռում դաշտերին,\nԵս որբանում եմ,\nԵվ իմ արցունքը\nՈ՞վ է վերծանում..."}},{"title":{"hy":"ՏԽՐՈՒԹՅՈՒՆ"},"group":{"hy":"354"},"text":{"hy":"Ես տեսա արցունք,\nՄերկ՝ ինչպես մանուկ,\nԼերկ՝ ինչպես կայծակ,\nՈւ ներսը՝ զիգզագ,\n\nՈւ ներսը՝ կարոտ,\nԱրտացոլվել էր\nԵրգող կարապի\nՊանդուխտ աչքերում։\n\nԵս տեսա արցունք...\nՏաք՝ ինչպես արբունք,\nՈւ ներսը՝ երկունք։"}},{"title":{"hy":"ԱԳԱՀՈՒԹՅՈՒՆ"},"group":{"hy":"354"},"text":{"hy":"Ագահությունը՝ ներսիս կռիվն է,\nՉեմ կարող նրան ես դատապարտել։\n\nԱգահությունը՝ բռնակալն է իմ,\nԾովեր կխմի ու կծարավի։\n\nԱգահությունը՝ խրտնած նժույգ է,\nԿտանի ոգիս ու կկաշկանդի...\n\nԱգահությունը՝ պատիժ է վերին,\nՈր խարանելով պիտի սասանեմ։"}},{"title":{"hy":"ԽՇՇԱ"},"group":{"hy":"354"},"text":{"hy":"Խշշա՜, խշշա՜, իմ բարդի,\nԱյնտեղ ձյունի նման պաղ,\nԿարապի երգն է խաչվում։\n\nԽշշա՜ տխուր, իմ բարդի,\nԱյնտեղ շուրթի նման թաց,\nԵղեգից մութ է կաթում։\n\nԽշշա՜, թափ առ, խենթ բարդի,\nԱյնտեղ ձորում այս գիշեր\nԼուսերգում է մի ծաղիկ..."}},{"title":{"hy":"ԺԱՄԱՆԱԿ"},"group":{"hy":"354"},"text":{"hy":"            Գեղամ Սարյանին\n\nՄայրամուտի ժամանակ\nՀավքերը կույր են ծնվում,\nՔարերը ցուրտ են շնչում,\nԱրեգը ո՞ւր է ծլկում\nՄայրամուտի ժամանակ։\n\nՀարսնատեսի ժամանակ\nՀավքերը հավք են դառնում,\nՔարերը խունկ են բուրում,\nԱրևն աստղեր է էրնում\nՀարսնատեսի ժամանակ։\n\nՏառապանքի ժամանակ\nԵրկինքը ցավ է ծնում,\nՋրերը ցավ են տանում,\nԼույսերը ո՞ւր են ծորում\nՏառապանքի ժամանակ։"}},{"title":{"hy":"ՈՒՇԱՑԱԾ ԿՅԱՆՔՍ"},"group":{"hy":"354"},"text":{"hy":"Ուշացած կյանքս\nԲոբիկ մանուկ է,\nԱխպերացել եմ\nՄանուկին բոբիկ,\nՈւ ծարավել է\nՀամբերությունս։\nԱնգիտությունս\nԶգաստացել է,\nԽաղում է հաճախ\nԻմ ջղերի հետ,\nԻնձանից նա միշտ\nԱռաջ է ընկնում\nԵվ ծանակվում է\nԻնձանից առաջ։\n\nՈւշացած կյանքս\nՀոգնած զինվոր է.\nՃակատը կարմիր,\nՀավատը գոհար,\nԱչքերը կապույտ,\nԿամքը պղնձե...\nԱյնպես է ուզում\nԻմ պապի նման\nԼինել և՛ հաղթող,\nԵ՛վ անօգնական։"}},{"title":{"hy":"ԵՍ ՀՈԳՆԵԼ ԵՄ"},"group":{"hy":"354"},"text":{"hy":"Ես հոգնել եմ\nԱմպի նման\nՈւ ծարավել\nԱրտի պես,\nԹռչունի պես\nԾվարել եմ,\nՔարայրի պես\nՈրբացել...\nԲայց ուզում եմ\nՄանուկ լինել,\nԶորեղ լինել\nԵվ... արքա։\n\nԲայց թե ուշ է,\nԱրդեն ուշ է,\nՑուրտն իջնում է\nԹիկունքիս,\nՈւ բաց դաշտում\nԴաղձը թոշնեց,\nԱրև տենչող\nՀարսի պես...\nՈւ մի տաք ձայն\nԱղաչում է,\nԱղաչում է\nՄորս պես,\nՈր ետ դառնամ\nՀիշողության\n\nԴաշտերից...\nԲայց գնում եմ\nԲաժան-բաժան\nԴաշտերով՝\nԻմ հայրիկին\nՀանդիպելու,\nԱրտասվելու,\nԾաղկելու..."}},{"title":{"hy":"ԳԱՐՆԱՆԱՄՈՒՏ"},"group":{"hy":"354"},"text":{"hy":"Ձնհալը ճերմակ շարական է կարդում,\nՀողը գանձ է դառնում մարգարիտի նման,\nՈւ մի ոլոր կածան հեսանվում է թաքուն՝\nԾորուն զատիկների կարմրամեջք պարսում։\n\nՇալակում է օրը մրմուռը պաղ ձյունի,\nՎեր է թռչում տեղից խռով սարը հանկարծ,\nԻմ ամպին է հասնում նրա ձայնը թախծի,\nՈր կապույտը գժվի ու խենթանա առուն։\n\nՈր մի ծոցվոր աղջիկ ժպտա արձակ դաշտին,\nՈր թռչուններ ծնվեն փետուրներով ոսկե,\nՑորենի պես ծփա արտասուքը լույսի,\nՈր խենթանա ուռին ու քաղցրանա հոգիս..."}},{"title":{"hy":"ԻՆՁ ՉՍԻՐԵՑԻՆ"},"group":{"hy":"354"},"text":{"hy":"Ինձ չսիրեցին...\nՈր շուտ արթնացա իմ առավոտից\nՈւ ոտաբոբիկ գնացի կյանքի\nՎարձքի ետևից...\nՁայնս դարձրի խմբերգի ղողանջ\nՈւ գտա դափնու ճյուղը մոգական։\n\nԻնձ չսիրեցին...\nՈր ես չապրեցի շողոմող մութով,\nՄտքերով թունոտ,\nՉկոխոտեցի խիղճս հարատև\nՈւ շուտ իմացա համը պղպեղի\nԵվ դարձը լույսի։\n\nԻնձ չսիրեցին...\nՈր իմ սկիզբը գողացա դաշտից,\nՈւնեցա պատրանք,\nՀույսի ձայնալար,\nՈւ ծուխը կապույտ ինձ տարավ երկինք,\nՈր ինձնից քաղի\nՀամբարձման ծաղիկ։\n\nԻնձ չսիրեցին\nԺամանակից շուտ արթնացողները,\nԿրակ փռեցին իմ ոտքերի տակ,\nՈր ես չտեսնեմ ջրերը ճերմակ,\nՈր երբ կարկաչեմ – չլինեմ զորեղ,\nՈր երբ լուսանամ – չդառնամ ես դաշտ\nԵվ չլինեմ մեծ իմ ժամանակից։"}},{"title":{"hy":"ՀԵՌԱՑՈՂ ԼԵՌՆԵՐ"},"group":{"hy":"354"},"text":{"hy":"Ինձ մի՛ ծերացրու,\nՏար ինձ հեռացող\nԼեռներն իմ անքող,\nՇուրթեր մկրտող\nՀայրեններ խմեմ,\nՀարբեմ, համբարձվեմ\nՈւ կուշտ հեկեկամ\nՏաք նվագի տակ։\n\nԻնձ մի՛ նեղացրու,\nՏար ինձ, թող թռչնանց\nԿարմիրը շողա,\nԴառնամ զույգ երազ,\nԵվ օրը նորից\nՔաղցրանա պարող\nԱղջիկների հետ,\nԵվ աչքս Մասյաց\nԿարոտը քամի\nԵվ հանգստանա,\nԵվ հանգստանա...\n\nԻնձ մի՛ ծերացրու,\nՏար ինձ հեռացող\nԼեռներն իմ Նոյի.\nՀուշեր մորմոքող\nՀայրեններ ոգեմ,\nՈւ կուշտ արտասվեմ\nՀին նվագի տակ,\nՈւ նոր ծերանամ,\nՈւ նոր ծերանամ..."}},{"title":{"hy":"ԶԱՎԱԿՆԵՐՍ"},"group":{"hy":"354"},"text":{"hy":"Դուք ապրում եք իմ մանկության օրորոցում,\nԵրգեր շարում երանության ակոսի մեջ,\nՈւ տաք մխում՝ որպես պատրանք ու որպես\nխունկ,\nԿրակ անում հուշը ցավի։\n\nԴուք, մոռացած ձեր պատմության արտը\nկանաչ,\nԾնկածաղկի բուրմունքի հետ շալակում եք\nԿայծակների շեղբը վայրագ ու գեղգեղում\nԹռչունների գաղթից առաջ։\n\nԴուք, զավակներ խաչելության ու հավատի,\nԾլե՛ք երգով՝ հայավարի ու համարձակ,\nԴուք ապրում եք իմ մանկության օրորոցում՝\nՁեռքում պահած սիրո ծաղիկն առավոտի։"}},{"title":{"hy":"ԳԻՇԵՐՎԱ ՄԵՋ"},"group":{"hy":"354"},"text":{"hy":"Գիշերվա մեջ\nԴուռս բացվեց,\nԳետի նման ես մերկացա։\nԳինի լցրու՝\nՁայնս խմեմ,\nԳետի նման ես ծերացա։\n\nԳետի նման\nՈ՞վ է սանձում\nԻմ պատրանքը,\nԶորությունս\nՈ՞ւր է հոսում,\nՈ՞վ է տանջում\nԻմ անդորրը\nԵվ ծիծաղում\nՊաղ գետի պես։\n\nՊաղ գետի պես\nՊաղ մամուռ է,\nՊաղ երկյուղ է\nԿաթում քարե իմ բարձունքին։\n\nԿեսգիշերին\nՈ՞վ է խաչում\nԻմ աստղերին...\nՈ՞վ է կիսում\nԻմ հավատը\nԿեսգիշերին։\nԳինի լցրու՝\nԵս ինձ խաբեմ,\nԳետի նման ես ծերացա։"}},{"title":{"hy":"ՆՈՐԻՑ ԻՄ ԿՐԾՔՈՒՄ"},"group":{"hy":"354"},"text":{"hy":"Նորից իմ կրծքում անդորր է ծխում,\nԵվ խեժի լույսը բուրում է հաշիշ,\nԲայց թե ինձ համար հողմերն ավելի\nՆուրբ են, սիրելի,\nՔան թե անդորրը հաշիշով արբած։\nԿայծակի զարկը ինձ համար կամք է,\nՔան թե անդորրը խլացած օրվա,\nԱնձրևի լացը ինձ համար վանք է,\nՔան թե անդորրը կապույտով օծված։\nԴուք ինձ մի՛ ծաղրեք...\nՀողմի, կայծակի, թոնի ժամանակ\nՆվացող ցավս\nՀալվում է մեկեն,\nՈւ գնում, գնում\nԸնձյուղվում երկինք...\n\nԴրանից է, որ\nՀողմը... ինձ համար\nՆուրբ է, սիրելի,\nՔան թե անդորրը հաշիշով արբած։"}},{"title":{"hy":"ՇԻՏԱԿՈՒԹՅՈՒՆՍ"},"group":{"hy":"354"},"text":{"hy":"Շիտակությունս՝ պապիս արյունն է,\nՆա չունի դադար տառապանքի պես,\nԵրկար տանջվում է պղծության ցրտում,\nՈր մաքուր խիղճը չկացնահարվի։\n\nԹե տառապանքը կաշվե գոտի է,\nՄիշտ էլ կլինի մեր քաջության մեջ,\nՄեր ընթացքի մեջ նա միշտ շարժուն է\nԵվ չունի դադար մեր վերելքի մեջ։\n\nԹե կասկածանքը շոր է հնացած,\nԱշխարհ է գալիս բոցի պես ագահ,\nԱնխուսափելի, ինչպես եղունգը –\nԻնչքան էլ կտրես, աճում է նորից։\n\nԱնթարթ կրծում է իմ խղճմտանքը,\nԻմ անցուդարձը հալածում անթարթ,\nՔրտնած ձիու պես վազեցնում է ինձ,\nԻսկ վազող հոգին միշտ սին է ու խեղճ։\n\nՇիտակությունս ունի լայն ճակատ\nԵվ մտքի նման ահեղ բռնկում,\nԹաքուն ցրում է թուխպը կեղծիքի\nԵվ ջոկում սուտը առասպելական..."}},{"title":{"hy":"ԵՐԲ ԻՆՁ ՆԵՐՈՒՄ ԵՆ"},"group":{"hy":"354"},"text":{"hy":"Երբ ինձ ներում են,\nԵս բարություն եմ վերցնում հողից,\nԵվ անմեղանում անմեղի նման։\n\nԵրբ ինձ պատժում են,\nԵս ծռություն եմ գողանում ծռից,\nԵվ աղքատանում աղքատի նման։\n\nԵրբ ինձ ատում են,\nԵս սառնություն եմ գողանում սառցից,\nԵվ կուզիկանում կուզիկի նման։\n\nՈւ երբ սիրում են,\nԵս խենթություն եմ գողանում խենթից,\nԵվ ջահելանում ջահելի նման։"}},{"title":{"hy":"ԶԱՐԹԻՐ, ԼԱՈ"},"group":{"hy":"354"},"text":{"hy":"Մուշեղ Գալշոյանին\n\nԽոսի՛ր, -\n    ես ինձ պատժեմ,\n    որ չծնվեն կույր թռչուններ\n    և չբախվեն մութ պատերին։\n\nԽոսի՛ր, -\n    ես ինձ դատեմ,\n    որ չծաղկեն սև ծաղիկներ\n    և չբուրեն ծարավ դաշտին։\n\n\nԽոսի՛ր, -\n    հիշեմ՝\n    ինչո՞ւ ձեռքդ գնաց զենքի,\n    և զատեցիր ճառագայթը՝\n    դեռ նոր հյուսվող\n    առասպելի...\n\nԽոսի՛ր, -\n    հատեմ դավի լեզուն.\n    սև կարկուտը մեջս կծղեց,\n    ծաղկուն ծառի\n    համը տարավ\n    ու ավիրեց Բովտունը մեր։\n\n\nԽոսի՛ր, -\n    մի՛ կեռացիր,\n    դու՝ խնկի ծառ,\n    դու՝ Սասնա ծուռ,\n    դու՝ Ֆիդայի...\n\nԽոսի՛ր, -\n    ես լալկել եմ\n    սև սարի պես,\n   ես լալկել եմ...\n   Զարթի՛ր, ԼԱ՛Ո, –\n   ես ինձ պատժեմ։"}},{"title":{"hy":"ԼՈՒՅՍԸ ԳԱԼԻՍ Է"},"group":{"hy":"354"},"text":{"hy":"Լույսը գալիս է հայցվորի նման,\nԶայրույթի նման,\nԵվ դառնում մասուր՝\nՄորս կորացած թիկունքի վրա։\n\nՄութը գալիս է ասկյարի նման\nՈւ հոսում խավար,\nՈրտեղ զատվում է\nՍաղարթը բախտի,\nՈրտեղ լորերը ժառանգներ չունեն,\nԵփրատի կարոտ թևավորներս\nԵրամներ չունեն...\n\nԼույսը բուրում է\nԹոնրաշրթի պես՝\nԱկանջում ձայնը\nՔնած քաջերի,\nՈւ բխում-բխում\nՀրաբուխի պես։\n\nԼույսը գալիս է բաց գետի նման,\nԳալիս է երկիր՝\nԱրտասուքներիս մաքրության բոցով,\nՏալիս է ողկույզ,\nԴեղձենու բույրով հինում է հավատ,\nՕծում է պատրանք,\nՎանում է և՛ քեն, և՛ ոխ, և՛ կսկիծ,\nԶարդարում տաճար,\nՈր շամանդաղին՝ ահեղ շառաչով\nՀող դառնա մի բուռ։"}},{"title":{"hy":"ՀԱՄԲԵՐՈՒԹՅՈՒՆՍ"},"group":{"hy":"354"},"text":{"hy":"Համբերությունս\nՈւնի խանդի եռք,\nՈրից թե հանկարծ կրակ արարես՝\nԿայրի ինձ ու քեզ։\n\nՀամբերությունս՝\nԻնձ մեկ-մեկ նույնիսկ\nԱյնպես է դաղում,\nՈր ես չեմ գտնում\nԻմ սրտի տեղը\nԵվ այն զանգակը,\nՈր պիտի զնգա...\n\nԵրբ համբերում եմ,\nՀամբերությունս\nԱյնքան է նման\nԱստղանավորդի,\nՈր քիչ է մնում\nԵս միշտ համբերեմ...\n\nՀամբերությունս\nՀացթուխի պես է.\nԱյրում է դաստակ,\nՇուրթեր ու մտքեր,\nՈւ ռետինի պես\nԳիտի կարճանալ\nՈւ ձգվել, ձգվել,\n\nԵվ ինձ համբարձել,\nԵվ ինձ կործանել...\nԲայց երբ իմ աչքում\nՈրդուս եմ տեսնում,\nՀավքեր ու լեռներ,\nԵս այդ վայրկյանին\nՄեղմանում եմ լուռ\nԵվ նմանվում եմ\nՀամբերատարի..."}},{"title":{"hy":"ԵԹԵ ՄՐՍՈՒՄ ԵՆ"},"group":{"hy":"354"},"text":{"hy":"Եթե մրսում են ձեր տաք շուրթերը,\nՈրբի լույսի պես\nՁեր ձյունոտ ճամփին կդառնամ խարույկ,\nԵվ ձեր շուրթերը կխմեն կապույտ։\n\nԹե խարխափում են ձեր տաք մտքերը\nԹշվառների պես,\nԱնզորության մեջ կդառնամ ես մոգ,\nԵվ ձեր մտքերը կթևեն երկինք։\n\nՈւ թե հոգնում են երազները ձեր՝\nՑած վազող բախտի երամների պես,\nՁեր հոգնության մեջ կդառնամ ես վերք,\nՈւ ձեր ձեռքերը կգրկեն երկինք։"}},{"title":{"hy":"ՕՐԵՐ"},"group":{"hy":"354"},"text":{"hy":"Կորացած իմ օրեր,\nԴուք նորից ինձ գտաք...\nԵվ ծարավը ձեր հին\nԾորում է դաշտերին\nՈրպես մի խարկած խիղճ,\nՈրպես մի մրսած ճիչ,\nՈրպես մի մաքուր լաց...\n\nԴուք նորից ինձ գտաք,\nԵվ ձեր ջինջ շափաղից\nՀացի բույր է գալիս,\nԳնամ ես լույս մուրամ.\nԻմ ներսում գարուն է,\nՕրորոց մանկության..."}},{"title":{"hy":"Ո՞Վ Է ԾԱՂՐՈՒՄ ՄԱՀԸ"},"group":{"hy":"354"},"text":{"hy":"Արեգակը\nՍնձի կաթ է\nՄաղում ծոցվոր դաշտերին,\nՈ՞վ է մրսում\nԻմ հուշերում\nԱյս աշնան,\nՈ՞վ է ծաղրում\nՄահվան պարը\nՈւ մնում է\nՄիշտ մանուկ։\nՈ՞վ է կիսում\nԲախտի սերմը,\nԵվ արտասվում\nԽեժի պես,\nԻմ պատրանքը\nՈ՞վ է պայտում\nՑուրտը տեսած ժայռի մեջ...\nԿյանքի գինը չիմանալով՝\nՈ՞վ է զատում\nԽնկամոմի\nՔաղցր բույրը\nԱյս աշնան։\n\nԱրեգակը\nՍնձի կաթ է\nՄանում\nՇարմաղ դաշտերին.\n\nԿարոտներին դիմանալով՝\nՈ՞վ է մրսում\nԻմ աչքերում\nԱյս աշնան։"}},{"title":{"hy":"ԳՆՈՒՄ ԵՆ ԶՈՒՍՊ"},"group":{"hy":"354"},"text":{"hy":"Հերթով-շարքով անց են կենում\nՄրջյունները քոչվոր.\nՆրանց բեռից սարն է զնգում\nԵվ ծաղիկվում բոսոր։\n\nՈւ գնում են շարան-շարան,\nԹելիկ-մելիկ ճամփեքի պես,\nՍարերի պես պարան-պարան,\nՄեջքը մեջքի,\nԳլուխ գլխի...\nԳնում են զուսպ,\nՈր կյանքն իրենց պատսպարեն,\nԵվ անեն այն,\nԻնչ ցանկանան...\nԵրջանիկ են քոչվորները...\nՀերթով-շարքով անց են կենում,\nՄեջքերին՝ շողք, աչքերին՝ շանթ...\nՄրջյունները այդ ժրաջան\nՈրքա՜ն կորով ունեն զտած,\nՈրքա՜ն արբունք,\nԱփսոս, որ մենք չենք նկատում։"}},{"title":{"hy":"ԵՎ ԱՅՆՊԵՍ Է ԼԻՆՈՒՄ"},"group":{"hy":"354"},"text":{"hy":"Եվ այնպես է լինում՝\nԴող ես բերում դու քեզ,\nՈւ մնում ես փխուր,\nՈւ մնում ես խռով,\nՈւ չես գտնում բառեր\nՍփոփող ու ջերմիկ,\nԱպստամբ ես դառնում\nԻնքդ քո դեմ արդեն։\n\nԵվ այնպես է լինում՝\nԿարեկցում ես դու քեզ,\nԵվ աշխարհը կարծես\nՇուռումուռ է գալիս,\nԿարեկցում ես դու քեզ\nԵվ այրում ես լեզուդ\nԿարեկցանքի բոցում,\nԱպստամբ ես դառնում\nԻնքդ քո դեմ նորից։\n\nԵվ բացվում է լույսը\nՄեղավորի նման,\nԼույսի գոհարներից\nԿաթկթում է մարջան,\nԿաթկթում է երկինք,\nԵվ գտնում ես բառեր...\nԵվ հպատակ դառնում..."}},{"title":{"hy":"ԱՇՆԱՆԱՄՈՒՏ"},"group":{"hy":"354"},"text":{"hy":"Սարից անդին կոճղ են այրում.\nԾուխ-կրակը դեպի երկինք է առաքում\nԲոցե բառեր,\nԲոցե մրմուռ,\nԲոցե բողոք...\n\nԻսկ մի թռչուն\nԵրկարում է\nԿապույտ թևը բոց-կրակին,\nՈւ տանում է վերջին հուրը\nՃախրանքի հետ։"}},{"title":{"hy":"ՄԻԱՄԻՏՆԵՐԸ"},"group":{"hy":"354"},"text":{"hy":"Շատ են հեթանոս միամիտները, -\nԱնձրևից առաջ խարույկ չեն վառում,\nՉեն քնում թաց տեղ,\nՈւ սեր չեն հայցում...\nՍիրում են միայն,\nԵրբ որ սիրում են,\nԵվ չեն կորանում մեղսանքների մեջ,\nՄտքերի նման ալիքվում են վեր,\nՏաք գույների մեջ սպասում հենքի,\nԻղձերի բովից մտնում են տաճար,\nԴառնում երգասաց,\nԴառնում հուշարար քաղցից երկվության։\nԲռնամոլներ են միամիտները, -\nՀայցվորի նման գիտեն երկրորդել,\nԱմոքողի պես գողանալ պատրանք\nԵվ տալ մեկօրյա թախծության շնորհ...\nԹմրության աղով ծեսեր են այրում,\nՈւ գլորում են օրը լուսավոր՝\nՄեղավորների նախահոր ձեռքով,\nՁաղկում են բառեր, մտքեր շղարշե\nԻմ ապրած կյանքի ուղիղ մեջտեղում..."}},{"title":{"hy":"ՏԱՏԻՍ ՎԱՆՔԸ"},"group":{"hy":"354"},"text":{"hy":"Մամռած մամուռ հագած վանքը\nԴեռ մխում է կապույտի մեջ.\nԳմբեթները քարե զանգ են,\nՔարե գիրք են ու քարե կամք։\n\nՀազար մատաղ տեսած վանքը\nԱմլանում է ժայռի փեշին.\nԵվ ծփանքը կապույտի մեջ\nԿապույտ բոց է ու կապույտ լաց։\n\nԹե դու անցնես վանքի ճամփով,\nԱչքդ հառիր մութ խորանին,\nՈր իմ տատի խիղճն է քարե\nԵվ աղոթքը իմ մեծ պապի..."}},{"title":{"hy":"ԻՆՉ ՈՐ ԼԻՆՈՒՄ Է"},"group":{"hy":"354"},"text":{"hy":"Ինչ որ լինում է,\nԹույլին է լինում՝\nԵ՛վ պարտք ու ծանակ,\nԵ՛վ մեծ խղճի սով,\nԽրտնած երազ,\nԿարոտ վարանոտ,\nՎեճ ու զառանցանք,\nԽանդի մաղձ ու թույն,\nԻնքնագթության\nՍուտ երջանկություն\nԵվ համր, համր\nՀիասթափություն...\n\nԵս հավատում եմ՝\nԻնչ որ լինում է,\nԹույլին է լինում՝\nԵ՛վ ուշացած սեր,\nԵ՛վ ձախորդություն,\nԵ՛վ մեղավորը\nՀիշողությունն է,\nՄենակությունն է,\nԱնգթությունն է\nԵվ խակությունը,\nԵվ ոչ թե փխուր\nՁախորդությունը..."}},{"title":{"hy":"ԾԱՌ ԻՄ"},"group":{"hy":"354"},"text":{"hy":"Ծա՛ռ իմ, տուր ինձ քո ճյուղերը,\nՈր ես գտնեմ\nՔո կապույտն ու դաշտերը իմ հայրենիքի...\n\nՄենք երկուսս էլ\nԵրկինք ունենք,\nՈրտեղ հաց կա խաղաղության\nՈւ ապագա.\nԵվ մենք երբեք չենք շշնջում,\nՈր երկինքը շատ է կապույտ,\nԵվ դաշտերը առավոտի\nՈւժ ու բերկրանք են բաժանում\nՍերմնացանին...\n\nԾա՛ռ իմ, թույլ տուր\nՔո ճյուղերով ես կանաչեմ,\nԵս պայծառ եմ,\nԻնչպես աչքերն հանքափորի.\nԻմ խոհերը ծփում են տաք\nԼուսաբացի կարմիր ծոցում,\nԹող ես տանեմ\nՔո սուրբ ձայնը արեգակին,\nՉէ որ, ծա՛ռ իմ,\nՄենք երկուսս էլ\nԱրմատ ու լույս ենք բաժանում..."}},{"title":{"hy":"ԻՐԻԿՆԱՄՈՒՏ"},"group":{"hy":"354"},"text":{"hy":"Իմ ճամփի վրա ծերացավ արփին,\nՈւ հանգիստ մեռավ ջուրը քարափում,\nԳլորվեց վերից ճերմակ աղավնին,\nՈւ սիրտս մնաց նրանց արանքում։\n\nԹամբած լեռներում խլացավ պախրան,\nԿանչը ինձ տարավ փչակը հույսի,\nՍպանվածի պես գուրգուրեց հոգիս,\nՈր արմատներիս ձայնը արթնանա...\n\nՆիրհող եզերքում կորացավ բարդին,\nՎարգող ձիերը տեսիլներ դարձան,\nԲայց սիրտս ծաղկանց աղերսեց այնպես,\nՈր դաշտը ամռան երկինք ունենա։"}},{"title":{"hy":"ՎԵՐՈՒՄ ԿԱՅԾԱԿԸ"},"group":{"hy":"354"},"text":{"hy":"Վերում կայծակը զիգզագներ գծեց,\nՑածում պապանձվեց մենավոր բոխին.\nՈւ մի խաս աղջիկ կանչեց, տագնապեց...\nՀրդեհի ահը\nՆրա շրթունքի կարմիրը այրեց...\nՁորաբերանին\nՄի մախմուր տղա,\nԼացի, ջութակի ձայներ երկնելով,\nԳնաց, ամբարեց բաշը կրակի...\nՁորաբերանին\nՇարմաղ աղջիկը\nԵրկար աչք վառեց...\nԾիծաղեց, արբեց,\nՈւ քնքշանքը հայոց անտառի\nՆորից կարկաչեց..."}},{"title":{"hy":"ԱՌՈՒՆ ՏԵՆՉՈՒՄ Է"},"group":{"hy":"354"},"text":{"hy":"Առուն տենչում է վտառներ ձկան\nԵվ ալիքվում է ծաղկանց թևի մեջ,\nԵղեգն ապրում է քարերի կողքին\nԵվ համրանում է ջրի կարոտից...\nՃակատիս վրա ծաղկում է առուն\nԵվ հեռանում է ուրցի բուրմունքով,\nԳետակ է ծլում թեժացած առուն՝\nԱնհոգությունս քարերին փռում,\nԵվ իմ քարախոս անհոգությունը\nՆնջում է հանգիստ անհոգների պես,\nԿարծես չի զգում,\nՈր լույսից պիտի ծառերը երգեն,\nՁիերն արածեն,\nԵվ պտուղները ոսկե-մարջանով\nԼույս պիտի խմեն,\nՈր հողը ծաղկի,\nԱչքը գոհանա,\nՏուն դարձած արտը\nՃամփորդների պես\nԱնուշ շշնջա.\n-Թե առուներն են հոտաղներն հողի...\n\nԱռուն գնում է շղարշով ոսկե,\nՈր քամին դառնա խնձորի թովչանք,\nԵղեգնը չապրի քարերի կողքին\nԵվ չպատանդվի ջրի կարոտից..."}},{"title":{"hy":"ԱՄԵՆ ԱԿՆԹԱՐԹ"},"group":{"hy":"354"},"text":{"hy":"Ամեն ակնթարթ հոսում է գարուն՝\nՋավախք աշխարհից մինչև արեգակ,\nԱմեն ակնթարթ մենք մեզ ենք գտնում,\nՄեր ոգու լույսն ենք արարում շիտակ։\n\nԱմեն ակնթարթ մենք մեզ ենք սիրում\nԵվ բախտ անվանում ամեն տխուր բան,\nԱմեն ակնթարթ մենք մեզ ենք հերքում,\nՄեր ներսի ձայնն ենք էրնում ցիրուցան։\n\nԱմեն ակնթարթ մենք մեզ ենք ճշտում\nԵվ մեզ կասկածում ամեն մի բանից,\nԱմեն ակնթարթ մենք մեզ ենք լքում,\nՄեր բարությունն ենք թալանում մեզնից։\n\nԱմեն ակնթարթ մենք մեզ ենք տիրում\nԵվ մեզ անվանում խիստ օրինավոր,\nԱմեն ակնթարթ մենք մեզ ենք պաշտում\nԵվ մեզ հռչակում միշտ՝ տաղանդավոր։\n\nԻմ կանաչ եզերք, ամեն ակնթարթ\nԴու լույսի նման ինձ հետ ես ապրում,\nԵվ ամեն ցերեկ, դաշտի պես հանդարտ,\nԾերացող հոգուս արև ես շաղում։\n\nԱմեն ակնթարթ Նավասարդ ես դու,\nՋավախք աշխարհից մինչև արեգակ,\nՇուշանի նման բացվում ես, զուգում՝\nՇրթիդ՝ կարմիր հաց, կրծքիդ՝ մանուշակ։"}},{"title":{"hy":"ԾԻԾԵՌՆԱԿՆԵՐՍ"},"group":{"hy":"354"},"text":{"hy":"...Հատել են ծառս.\nՏեսել են վերից\nԾիծեռնակներս\nՈւ խենթացել են\nՎրնջող ցավից,\nԵվ հեռացել են\nԵրգող անտառից\nԵվ իրենց կավե\nԲույներն են հյուսել\nԺայռերի վրա,\nՈւ մեջն ամբարել\nԱնարատ կսկիծ\nՈւ ցավ անարատ։\n\nԾիծեռնակնե՜րս, -\nՀոգևոր, մաքուր\nԲանաստեղծություն։"}},{"title":{"hy":"ՄԵՆՔ ՄԵԶ ՉԵՆՔ ՏԵՍԵԼ"},"group":{"hy":"354"},"text":{"hy":"Մենք մեզ չենք տեսել այս երկնքի տակ\nԵվ չենք մտածել մեր մասին երբեք,\nԻնչ-որ ուրիշի հոգսով ենք մաշվել\nԵվ չենք իմացել՝ երբ ենք ծերացել։\n\nՄեզ ե՞րբ են սիրել աչքերով կապույտ,\nԵ՞րբ են մեզ ծաղրել փուչ բանի համար,\nԵ՞րբ են ծարավել ջրերը մեր լուրթ\nԵվ ինչո՞ւ այսպես ապրել ենք երկար...\n\nԵվ մեզ չենք հուշել՝ ո՞վ ենք մենք եղել,\nՈր ծաղկած լույսն է հյուսել մեզ պսակ,\nՈ՞ր սարի հացն է դարձել մեզ նշխար,\nՈր մեզ չենք տեսել այս երկնքի տակ։\n\nՈւրիշի հոգնած հոգսով ենք մաղվել,\nՈր նրանք ապրեն թեթև ու անլաց,\nԴրանից է, որ մենք չենք իմացել՝\nԵ՞րբ են ծերացել աչքերը մեր թաց։"}},{"title":{"hy":"ԱՅՍՔԱՆ ԵՐԿԱՐ ՉՏԵՍՆԵԼՈՒՑ"},"group":{"hy":"354"},"text":{"hy":"Այսքան երկար չտեսնելուց...\nԼույսի մանուկ իմ լեռները՝\nՋրերն անգամ կծարավեն,\nԿփշրվեն տաճարները՝\nԱյսքան երկար չտեսնելուց\nԱչքի կարոտ իմ լեռները։\n\nՄի սուտ կյանքում...\nԱյսքան կարոտ կարկաչելուց՝\nԳետերն անգամ ետ կհոսեն,\nՁյուներն անգամ կծերանան՝\nԱյսքան երկար չտեսնելուց\nԿայծակ խմող իմ դաշտերին։\n\nԱյսքան երկար ինձ փնտրելուց...\nԴափնին մնաց պաղ երկնքում,\nՈւ երազիս սուրբ շեմի մոտ\nՄայրս ձայնեց.\n-Մա՜նչս, գիտեմ,\nՄեր աստվածը մեզ չհիշեց..."}},{"title":{"hy":"ՄՈՒԹԸ ԾԵՐԱՑԱՎ"},"group":{"hy":"354"},"text":{"hy":"Մութը ծերացավ... ես տուն չդարձա՝\nԱնձրևած ձեռքով ցավեր բարդեցի,\nԻմ գնացքները մենակ հեռացան՝\nԵվ ես չհասա կանչող սուլոցին։\n\nԵս տուն չդարձա կարոտի կանչով,\nԷլ ետ չբերին գնացքները ինձ,\nԻմ խաժ աչքերը ողբասաց դարձան՝\nԵվ ես չհասա կանչող ձեռքերին։\n\nՄութը լուսացավ... ես տուն չդարձա՝\nՈւ չհանդարտվեց իմ երկուշաբթին...\nԻմ գնացքները ալարկոտ անցան՝\nԵվ ես չհասա կանչող ձայներին։"}},{"title":{"hy":"ՎԵՐԱԿԵՐՏՈՒՄ"},"group":{"hy":"354"},"text":{"hy":"               Վահագնին\n\nԴո՛ւ Մուղնվա դաշտի տաք հաց,\nԴո՛ւ խղճի ձայն, որբի ախպեր,\nԴո՛ւ երփնագիր արծաթավուն,\nԴո՛ւ երկունքի կրակարան։\n\nԴո՛ւ վերծանող որմնանկար,\nՑավի կողքին ապրող հոտաղ,\nԴո՛ւ վաղորդյան շղարշ առու,\nԵվ դպրության նվագարան։\n\nՔեզ չիմացան... քեզ ծածկեցին\nՄութն ամբարող վարագույրով,\nԲայց դու ելար հունձքի բոցով,\nՈր խենթանա լույսը բեհեզ..."}},{"title":{"hy":"ԻՄ ԿՈՂՔԻՆ ԾՎԱՐԵՑ"},"group":{"hy":"354"},"text":{"hy":"Իմ կողքին ծվարեց\nՄի կապույտ թևավոր,\nԵվ ոչ ոք չիմացավ,\nՈր ապրել է մի օր,\nՈր երգել է մի օր\nՏաքացող քարերին,\nՀեռացող լեռները\nՆա զուգել է երգով,\nԵվ տարել երկնքին\nԴաշնություն ու կորով։\nԵվ հոգնել է մի օր\nԱշխարհից այս թաքուն,\nԵվ մի տաք միջօրե\nՔարացել է դաշտում։"}},{"title":{"hy":"ԵՐԲ ԱՌՋԵՎՈՒՄ ԵՍ"},"group":{"hy":"354"},"text":{"hy":"Երբ առջևում ես...\nՔեզ վեր են տանում\nԴափնու ցնծությամբ.\nԴու համ ես դառնում\nՀայոց բառի պես...\nԽնդրում եմ, որդի՛ս,\nԴու երես չառնես\nԵվ չմրոտես\nԼուսավոր քողը առաքինության։\n\nԵրբ մեջտեղում ես...\nՔեզ բախտն է տանում\nԴրախտի ճամփով,\nԵվ դու ծաղկում ես\nՆշենու նման,\nԽնդրում եմ, որդի՛ս,\nԴու քեզ չխաբես\nՈւ հանկարծ գնաս\nԳինու,\nՑոփության,\nՓառքի ետևից...\nԵրբ ետ ես ընկնում...\nՔեզ էլ չեն սիրում,\nՔեզ էլ չեն ներում\nՓուչ բանի համար, -\nԻմացի՛ր, որդի՛ս,\nՔեզ կողոպտում են։"}},{"title":{"hy":"ՄԻ ՁԱՅՆ ԾՆՎԵՑ"},"group":{"hy":"354"},"text":{"hy":"Մի ձայն ծնվեց ու խլացավ ձորում,\nՄի սև զամբիկ հերկեց սեզ ու կակաչ,\nԼեռը՝ կարմիր աղոթք,\nԱմպեց, խամրեց, մրսեց։\nՄի ձեռք կտրեց ձորի ջահել ուռին,\nՈւռին արցունք դարձավ՝\nՓայլեց, ձայնեց, լալկեց։\nՀետո մի կին հանկարծ ծարավ շուրթը բացեց...\nԺպտաց սեզ ու կակաչ,\nԼեռը դարձի եկավ՝\nԾաղկեց, վառվեց, խոսեց։"}},{"title":{"hy":"ԼՌՈՒԹՅՈՒՆԸ"},"group":{"hy":"354"},"text":{"hy":"Խուլ-համրի պես\nԵս լսում եմ լռությունը,\nԵվ ես լռել եմ սովորել։\nԵրբ ծաղրել են,\nԼռել եմ ես,\nԹեկուզ իմ մեջ բուքն է գժվել։\nԵրբ խաբել են,\nԼռել եմ ես,\nԹեկուզ իմ մեջ ցուրտն է մրսել,\nԻնձ սիրել ու չարչարել են,\nԼռել եմ ես,\nԵվ լռելուց ծերացել է սիրտն իմ ջահել։\n\nԱղոթքի պես\nԵս պահել եմ լռությունը\nԻմ շուրթերին...\nԱսում են, թե\nԼռության մեջ\nՇուրթը շրթի հետ է կռվում,\nԵվ հանճարեղ գյուտն է ծնվում\nԼռության մեջ,\nԱստղը աստղի հետ է վիճում,\nԿաքավներն են իրար գրկում,\nՄրջյուններն են իրար փնտրում...\nԼռության մեջ\nԻնձպեսներն են իրար կանչում,\nՈւ գնում են...\nԼռության մեջ մութը հունցեն..."}},{"title":{"hy":"ՆԱՄԱԿ"},"group":{"hy":"354"},"text":{"hy":"Երբ տուն կդառնամ,\nՉհուշես հանկարծ,\nՈր երկինք տարան\nԿամքս պղնձե,\nՈւ հիմա չունես\nԿապույտ արահետ,\nՉունես հիացքի մարմար շուշաններ,\nՉունես հայտագիր խենթ երջանկության...\n\nՉհիշես հանկարծ,\nՈր դու եղել ես մայր ու պատարագ,\nՈր դու եղել ես մայր ու տառապանք,\nՈր քարացել է արցունքդ ներսում,\nՈր զմռսվել է ցավի տաճարը\nՔո շրթունքներին...\n\nԹող լույսը ծաղկի,\nԽմբերգը թնդա,\nՇեփորի ջահը մոտենա սրտիս՝\nՍիրտս խենթանա,\nՈր ձայնիս դարձը\nԱղավնի որսա..."}},{"title":{"hy":"ԾԵՐՈՒԹՅՈՒՆ"},"group":{"hy":"354"},"text":{"hy":"Ճերմակ եմ ես,\nԷլ ոչ ոքի\nՊետք չեմ գալիս...\nՃերմակ եմ ես՝\nՈչ վառվում եմ,\nՈչ մոխրանում,\nՈչ էլ, ոչ էլ\nԿարենում եմ\nՀոգնածներին\nՀենակ լինել,\nԿռնակ լինել\nԽաբվածներին,\nՄրսածներին\nԿրակ լինել։\n\nԻնձ էլ սիրեք,\nԳոնե խնդամ,\nԻնձ հետ վիճեք,\nԳոնե հուզվեմ,\nՄենակ եմ ես,\nՇատ եմ մենակ,\nԲախտի պես եմ՝\nԿամ ու չկամ։"}},{"title":{"hy":"ԱՆՁՐԵՎՈՒՄ ԷՐ ՄՈՒԹԸ"},"group":{"hy":"355"},"text":{"hy":"Անձրևում էր մութը դրսում, -\nԵս չգտա պանդուխտներին,\nԳալարվում էր, ձգվում հեռու\nՄի պանդուխտ կանչ կեսգիշերին։\n\nՈւ ալիքվում փաթիլ-փաթիլ\nՄի թախծություն ժայռի փեշին,\nԵվ հեռանում կաթիլ-կաթիլ\nՄի փշոտ բախտ ցուրտ գիշերին։\n\nՈրբանում էր կամաց-կամաց\nՄի բարակ ձայն մութ գիշերին,\nԵվ աղերսով մի գալարուն\nԱրթնացնում էր հոգնածներին։\n\nՈւ... տանում էր փաթիլ-փաթիլ\nԻմ աչքերից կորուստ մի հին,\nԵվ հեկեկում կաթիլ-կաթիլ\nՄի ցավոտ ձայն խուլ գիշերին։"}},{"title":{"hy":"ՏՐԻՈԼԵՏՆԵՐ"},"group":{"hy":"355"},"text":{"hy":"             Որդան կարմիրն է ընձյուղվում,\n                 Էլ չի թվում հուշը աքցան...\n\n1\n\nՎերադարձի՛ր, ներիր անձայն,\nոչ ոք չկա իմ երազում,\nքո ցերեկն է ինձ ափ բերում,\nվերադարձի՛ր, ներիր անձայն։\n\nՈրդան կարմիրն է ընձյուղվում,\nէլ չի թվում հուշը աքցան,\nվերադարձի՛ր, ներիր անձայն,\nոչ ոք չկա իմ երազում։\n\n\n2\n\nՋուրը երգեց ձկների հետ,\nև մանկություն թողեց ափին,\nորպես ծնունդ լուսաբացի –\nջուրը երգեց ձկների հետ։\n\nԵս կանչեցի իմ ձեռքերին,\nափ հասնողին դափնի է պետք,\nջուրը երգեց ձկների հետ,\nև մանկություն թողեց ափին։\n\n3\n\nԵրգ են փռում երկու ծերուկ՝\nարվարձանի մայթերին պաղ,\nմեկն հարբած է, իսկ մեկը՝ կաղ,\nերգ են փռում երկու ծերուկ։\n\nԱսես լինեն անմեղ մանուկ,\nորոնց ոչ ոք էլ չի նեղում,\nերգ են փռում երկու ծերուկ\nարվարձանի մայթերին պաղ։\n\n4\n\nՃերմակում է մազս կամաց\nմի աղջկա տխուր մեղքով,\nծարավ գետի ճամփաներով\nճերմակում է մազս կամաց։\n\nՀոգնած ճամփան ծաղիկ ոտքով\nինձ տանում է գիրկը մրսած,\nճերմակում է մազս կամաց\nմի աղջկա տխուր մեղքով։\n\n\n5\n\nԳինի լցրու, ես ինձ հիշեմ,\nանցորդ եմ ես այս աշխարհում,\n\n\nշրթիս ձմեռն է հեկեկում,\nգինի լցրու, ես ինձ հիշեմ։\n\nԱփիս մեջ է լույսը մարում՝\nիմ հոգնության բեռը նորեն,\nգինի լցրու, ես ինձ հիշեմ,\nանցորդ եմ ես այս աշխարհում։\n\n\n6\n\nՀռհռում է աշունը թաց,\nկայծակներ է լափում քամին,\nնահատակված դեղին ժամին\nհռհռում է աշունը թաց։\n\nՄանկության հետ մի տարեց կին\nհավաքում է բառեր կանաչ,\nհռհռում է աշունը թաց,\nկայծակներ է լափում քամին։\n\n\n7\n\nՈւնեցածս ջուրը տարավ,\nբախտիս ծոցում մրսեց քամին,\nսևին տվեց լեռը կրկին,\nունեցածս ջուրը տարավ։\n\n\n\nՉունեցածս ինձ քույր դարձավ՝\nծփանք տալով իմ պատրանքին.\nունեցածս ջուրը տարավ,\nբախտիս ծոցում մրսեց քամին։"}},{"title":{"hy":"ԿԱՊԱՎՈՐ ՀԱՅՐՍ"},"group":{"hy":"355"},"text":{"hy":"Թե տուն դառնար\nՀայրը իմ,\nԿմանկանար\nԱռավոտը դաշտերում,\nՈւ պատի տակ երեք մանուկ\nԵրեք ակունք կունենար։\n\nԹե տուն դառնար\nՀայրը իմ,\nԻմ կարոտը\nԻմ ծարավը կխմեր,\nՈւ շեկ դաշտում երեք մանուկ\nՔառասուն դաշտ կունենար։\n\nԹե տուն դառնար\nՀայրը իմ,\nԻմ թիկունքը\nԵրկինք կտար որբերին,\nՈւ թախծի մեջ երեք մանուկ\nՀազար ծիծաղ կունենար..."}},{"title":{"hy":"1945 ԹԻՎ"},"group":{"hy":"355"},"text":{"hy":"Ոսոխին հաղթել...\nԳալիս է պապս,\nՁեռքերին՝ դափնի,\nՃակատին՝ ալմաստ,\nՇուրթերին՝ շուշան...\n\nԳալիս է պապս\nՀենակով փայտե...\nՈւ սիրտս է ողբում,\nԵրանի հայրս էլ\nՏուն գար հենակով,\nԵվ չորբանար\nՄայրս սևավոր։"}},{"title":{"hy":"ՀԵՌՈՒ ՀԵՌՎՈՒՄ"},"group":{"hy":"355"},"text":{"hy":"Հեռու-հեռվում...\nԵրազիս մեջ մի պառավ կին\nԱյցի եկավ...\nՉհիշեցի։\n-Որդի՛ս, - ասաց նա ողբալաց, -\nԵս էլ հազիվ քեզ հիշեցի։\n\nԵրբ զարթնեցի, մայրս չկար,\nՊատուհանից պաղ ոռնում էր\nՔամին այրի...\nՍարսռեցի։\nՁեռքս կպավ ցուրտ պատերին,\nՈւ քարերը արտասվեցին..."}},{"title":{"hy":"ԵՐԳ ՊԱՊԵՐԻ ԵՎ ՆՐԱՆՑ ՀՈՒՇԵՐԻ ՄԱՍԻՆ"},"group":{"hy":"355"},"text":{"hy":"Մեծ մանուկներ են մեր պապիկները,\nԱմեն օր այգում հուշ են վաճառում՝\nՀՈՒՇ եղելության,\nՀՈՒՇ վայրենության,\nՀՈՒՇ կոտորածի և սպանդ-ջարդի...\nՈւ հալվում ցավով,\nԵվ ծորում արցունք,\nՎիրավոր դաղձի ավիշի նման։\n\nՀեզ մանուկներ են մեր պապիկները,\nԱմեն օր այգում հուշ են գուրգուրում,\nԽառնում են մտքեր,\nԵվ տեղանուններ կրկնում անվերջ՝\nՌԱՔՔԱ ԵՎ ԴԵՐ-ԶՈՐ,\nԶԻԱՐԵԹ... ԲԱԲՈՒ,\nՈւ ծերանում են մեր պապիկները,\nԵվ չեն հանդարտվում օվկիանոսի պես,\nՕվկիանոսներ են մեր պապիկները,\nՆրանց արյան մեջ ապրում են հավետ\nՆահատակները...\n\nՀրաշքով փրկված պատառիկներ են,\nՊատմություններ են մեր պապիկները,\nԱմեն օր այգում ցասում են վառում,\nՆրանց աչքի դեմ կարծես կրկնվում\nՈւ չի ավարտվում նախճիր-եղեռնը...\nՈւ չի ավարտվում,\nԻնչպես որ ցայսօր Քամեդ էլ Լոզում,\nՀովտում Բեքաայի\nՈւ պատերի տակ Անսար ճամբարի։"}},{"title":{"hy":"ԱՂԵՏԸ ՍՈՂԱՑ"},"group":{"hy":"355"},"text":{"hy":"Աղետը սողաց ակոսների մեջ,\nՍողաց ու... ծփաց հերկը արյունով,\nՈւ տուն չդարձան մեր պապիկները,\nՈւ հին ակոսը խոփի հետ կիսվեց,\nՈւ հին ուռկանը ջրի մեջ մեռավ,\nՈւ հին Արաքսը ցավից թալկացավ,\nՈւ հին կրակը աղերսով հանգավ,\nԲացատը մթնեց եղեգան լացով,\nՈւ հողն արտասվեց տասներկու անգամ...\nԳնամ, որոնեմ պապիս ձեռքերը,\nԾիլ-ծիլ հետքերը,\nՊապի հոտ առնեմ,\nԽոփի հոտ առնեմ,\nԵտ բերեմ մամռած իմ կորուստները..."}},{"title":{"hy":"ԼԵՌՆԱԳԱԳԱԹՆԵՐ"},"group":{"hy":"355"},"text":{"hy":"Ձյունաթույր, անհաս լեռնագագաթներ,\nՈսկե շողերի գահեր հաղթական,\nՁեզ հետ կայծակն է բախվել բյուր անգամ,\nԲախվել է, պարտվել։\nԼեռնագագաթնե՛ր, որքա՜ն հպարտ եք։\nԱյնպես կուզեի՝ ձեր մաքուր ձյունից\nԾնվեին մի օր բյուր աղավնիներ,\nԵվ խաղաղություն թևած ճախրեին\nԾովերից ծովեր, լեռներից լեռներ։"}},{"title":{"hy":"ՀԱՅԿՈՒՀՈՒՆ"},"group":{"hy":"ՍԻՐՈ ԱՍՏՂԱՇԱՐ"},"text":{"hy":"                            ՍԻՐՈ ԱՍՏՂԱՇԱՐ\n\nՀԱՅԿՈՒՀՈՒՆ\nԵրբ ինձ նորից ես սիրում,\nԱրևը դարձ է գալիս,\nՇրթին՝ ծաղիկ խնձորի\nՈւ հիացքի անձրևներ...\n\nԵրբ ինձ կրկին ես սիրում,\nՊտուղներն են պտղանում,\nԱրևը լուռ քաղցրանում,\nԵվ ձյուներն են ավարտվում։\n\nԴու շողում ես, Հայկուհի՛,\nԾաղկում, զնգում ու վառվում,\nՔո երկնքով դաշտին\nԿապույտ թախիծ։\nԹող հեռանա\nՑավը ծծկեր,\nՈւ ջրի պես\nԹափվի քարին...\nԵս աշխարհ եմ եկել\nԾարավ,\nԻնձ հարբեցրու\nՍնձակաթով,\nՈւրցաբույրով\nԻնձ կշտացրու,\nՈր ամառվա\nՊտուղ դառնամ։"}},{"title":{"hy":"ԽԱՂԻԿ"},"group":{"hy":"ՍԻՐՈ ԱՍՏՂԱՇԱՐ"},"text":{"hy":"Երբ շամանդաղն է\nԻջնում շողակաթ –\nՄայրացող դաշտին՝\nՀամբուրես – կուլա։\n\nԹե շամանդաղին\nՄի գուսան կաքավ\nՊատանդվի վերում՝\nԼռես – կխոցվի։\n\nԻսկ եթե հանկարծ\nՄի մախմուր աղջիկ\nԹախիծով անցնի՝\nՊաչես – կծաղկի։"}},{"title":{"hy":"ԵՍ ԳՏԱ"},"group":{"hy":"ՍԻՐՈ ԱՍՏՂԱՇԱՐ"},"text":{"hy":"Ես գտա թաղիքը մեղքերիս,\nԹաքցրի ցավի մեջ բացատի,\nՈւ տեղը ծիածան շարեցի։\n\nԵս տեսա նժույգը արևի,\nԳողացա սանձերը բոցլեզու,\nՈւ կապույտ երազով ծփացի։\n\nԵս տարա քեզ դաշտով դրախտի,\nՈր դաշտում մեղրամիսն հրդեհվի,\nՈւ ճիչը լույս մանկան թափառի...\n\nԵս տեսա երամը հոգսերի,\nԱյրվեցի՝ կավի հետ մխալով,\nՈւ ծանր քարի պես տնքացի..."}},{"title":{"hy":"ԴՈՒ ԷԼ ԻՆՁՆԻՑ ՀԵՌԱՑԱՐ"},"group":{"hy":"ՍԻՐՈ ԱՍՏՂԱՇԱՐ"},"text":{"hy":"Լեռնաստանի ծաղիկ հարս,\nԴու էլ ինձնից հեռացար,\nԻնձ թողեցիր հանցավոր,\nԴու էլ ինձնից հեռացար։\nԱչքս մնաց բաց դաշտում՝\nԱռանց բարդի ու շուշան,\nԱռանց առվի կարկաչի՝\nԱչքս մնաց շեկ դաշտում։\nՀավատա իմ կարոտին,\nԽեղճանում եմ հավքի պես,\nԿո՞ւզես հիմա մոտենամ\nԵրջանկության գորգերին,\nՉունեցածով գոհանամ,\nՈւ տրորվեմ ակոսում։\n\nԿո՞ւզես հիմա մոտենամ\nՔո ձեռքերին համբարձող,\nԹե քեզ գրկեմ, չամաչես...\nՉհեռանաս հարսի պես։"}},{"title":{"hy":"ՔԱՌԱՁԱՅՆ ՍՓՈՓԱՆՔՆԵՐ"},"group":{"hy":"ՍԻՐՈ ԱՍՏՂԱՇԱՐ"},"text":{"hy":"               Տա՛ր ինձ երկիրն իմ պապերի,\n                   Իմ արյունը խոսեց նորից,\n                 Նորից հարբեց իմ անձի մեջ\n                Կարմիր գինին Նավասարդի։\n\n\nՀա՛յր իմ, ձայնդ տուն չեկավ,\nՄութը խմեց պաղ խեցին,\nՀա՛յր իմ, թիկունքս դիպավ\nՍառցի ճերմակ գոգնոցին։\n\nՔամիների բացատում\nԿուրանում է մի կակաչ.\nՀա՛յր իմ, խիղճս է որբանում,\nԾաղիկ ցանիր քունքերիս...\n\nՀա՛յր իմ, մեր տան կտուրի\nԾիծեռնակները կորան.\nՀա՛յր իմ, ասա իմ սրտին՝\nԿորցրածս հասկանամ։\n\nԿավի արցունքը տեսա\nՄորս աստղիկ աչքերում,\nՀա՛յր իմ, դուրս տար հոգսը մեծ –\nՄայրամուտն է մայրանում։\n\nՀա՛յր իմ, թափուր դաշտի մեջ,\n\nԿաքավներին զոհեցին,\nՀա՛յր իմ, խոտը արտասվեց –\nԴանակների սուր շեղբին։\n\nԿարապի տաք կտուցին\nՔո մորմոքի պեծը կա.\nՀա՛յր իմ, հոգնած դաշտերին –\nԱնցորդների լացը կա։\n\nՀա՛յր իմ, ես եմ ինձ լքում\nԹութակների սուլոցով.\nՀա՛յր իմ, խիղճս տար մեր տուն՝\nԹեկուզ փայտե ձիերով։\n\n\nՄայր Արաքսի մրմունջից\nՁկներն էլի ափ ելան,\nՀա՛յր իմ, փարվի՛ր իմ կրծքին,\nՑավերիդ հետ ծերանամ։\n\nՀա՛յր իմ, առուն խլացավ\nՀաղարջների մարգերում։\nՀա՛յր իմ, սերս ետ չեկավ, -\nԻնձ էլ պահիր քո ծոցում։\n\nԱրարատի լանջերին\nՁյունը լացեց հարսի պես.\nՀա՛յր իմ, կարոտը մեր հին\nՄեղքի նման իլիկվեց։\n\n\nՀա՛յր իմ, լույսը կարկատվեց,\nՄաքին մնաց բաց դաշտում,\nՀա՛յր իմ, այս ի՞նչ կատարվեց,\nՈ՞ւմ են տանջում վերևում։\n\nՋուրը ելավ ափերից,\nՁուկը երգեց լույսի մեջ,\nՀա՛յր իմ, թախծոտ մեր ճամփան\nԱրեգակի մեջ ծաղկեց։\n\nՀա՛յր իմ, հենվիր սալերին,\nՎանքի մատուռը փլվեց.\nՀա՛յր իմ, վանքի սրունքին\nՏատիս ձայնը բարակեց։\n\nԿարմիր-կանաչ դաշտի մեջ\nԵրեքնուկն է մանգաղվում,\nՀա՛յր իմ, ծածկիր դեմքը իմ,\nԱչքերիս հուրն է մարում։\n\nՀա՛յր իմ, սիրտս ամեն օր\nՔեզնից նավակ է խնդրում,\nՀա՛յր իմ, ծովում ալևոր\nՊապիս ձայնն է ինձ փնտրում։\n\nՀա՛յր իմ, կայծակը շողաց\nԱրագիլի թևերին.\nՀա՛յր իմ, սարսուռը խաղաց,\n\n\nԻնձ մոտեցրու քո խոսքին։\n\nՀա՛յր իմ, սարդերն անդադար\nՇուրջս ոստայն են մանում.\nՀա՛յր իմ, ուսդ ունկ արա՝\nՉմոլորվեմ անձավում։\n\nԲարդու կանաչ կոնքերին\nԿարապի երգը ծաղկեց.\nՀա՛յր իմ, նոր ցավ է գալիս,\nԵրկինքն էլի մռայլվեց։\n\nՀա՛յր իմ, դաշտում հասկերի\nԱմպը դավ է որոճում.\nՀա՛յր իմ, սիրտս է ցամաքում,\nԼույս երերա վերևում։\n\nՄղեղի մեջ ու քարի\nԴաղձի կաթն է խավարում.\nՀա՛յր իմ, պաղ է, տուն արի -\nԼույսը քնեց երկնքում։\n\nՀա՛յր իմ, երկնի այտերից\nՁյունը երազ է մանում.\nՀա՛յր իմ, խարկիր տաք լույսից\nՄի ոտ կարոտ իմ ճամփին։\n\nԿրակի չար պեծերում\nՄի թիթեռ է եփ գալիս.\n\n\nՀա՛յր իմ, սերս են կարկատում,\nՈր ցավ կաթի ակունքիս։\n\nՀա՛յր իմ, Գառնու շեն գավիթ\nԱրեգակն է ձևանում.\nՀա՛յր իմ, անհաղթ իմ ԴԱՎԻԹ –\nՔեզնից կորով եմ ուզում։"}},{"title":{"hy":"ՈՐ ՊԱՏԵՐԱԶՄԸ ՍԻՐՏ ՉԳՈՂԱՆԱ"},"group": ս մեկ տարով հուշ եղա, ու մի երազ հեկեկաց,\nՁյունը դրսում ծիլ առավ, առուն մրսեց ճայի\nպես,\nԻմ՝ հոտաղի աչքերից մի կում արցունք\nգլորվեց...\nԵս մեկ տարով ծերացա..."}},{"title":{"hy":"ՄՆԱՑԵԼ ԷՐ ՏԱՏՆ ԻՄ ՄԵՆԱԿ"},"group":{"hy":"ՍԻՐՈ ԱՍՏՂԱՇԱՐ"},"text":{"hy":"Մնացել էր տատն իմ մենակ,\nՆվաղում էր ու... վերջանում,\nԲայց մտքի մեջ նա շարունակ\nԻնչ-որ բան էր դեռ մրմնջում։\n\nՀեռանում էր տատն իմ փխուր՝\nԼաց-կարոտը պահած ծոցում,\nԱմեն քարի նայում տխուր,\nՁեռքով անում ու հեծեծում։\n\nՆա ձայնում էր քնած պապիս,\nԵվ արցունքն էր կաթում հակինթ՝\nԵրեքնուկի դաշտերի մեջ\nԴառնում կսկիծ ու հեկեկոց։\n\nԵվ տատիկս որբ ու մենակ,\nԿարոտները շալակն առած,\nՇտապում էր լեռը կանաչ,\nՈր հանդիպեր քնած պապիս։"}},{"title":{"hy":"ՄԵՆՔ ԱՊՐԵԼ ԵՆՔ ԹԱՔՈՒՆ"},"group":{"hy":"ՍԻՐՈ ԱՍՏՂԱՇԱՐ"},"text":{"hy":"Մենք ապրել ենք թաքուն...\nՈւ մեր կյանքում պահել\nԽուսափում ու վանում...\nԵրբ շանթի պես հիմա\nՀեռանում ես թափուր,\nԻնձ թվում է՝ չկամ\nԿորած ամպի նման,\nՈւ գնում եմ, գնում,\nՀամր կարոտ բերող\nԵրամների նման,\nՈւ կտցում եմ կարծես\nԵրգը արմատներիս,\nՈւ կտցում եմ համառ,\nՄինչև ես ինձ կտցեմ...\nՈւ վառվում եմ անծուխ,\nՈւ չեմ լսում ձայներ...\nՉապրող մարդու նման։"}},{"title":{"hy":"ԻՆՉՊԻՍԻ ԹԱԽԻԾ"},"group":{"hy":"ՍԻՐՈ ԱՍՏՂԱՇԱՐ"},"text":{"hy":"Ինչպիսի թախիծ ինձ մոլորեցնի,\nԻնչպիսի կսկիծ ինձ խավարեցնի,\nԻնչպիսի ցավ էլ որ ինձ բարուրի,\nՈտնաձայներս\nՀավիտենության լույսերի մեջ են,\nՍլացքի մեջ են\nԹևավորներս...\n\nԻնչպիսի կրակ որ ինձ մտրակի,\nԻնչպիսի կայծակ ինձ ավերակի՝\nԱրձագանքներս\nԶարթոնքի մեջ են,\nԵվ արմատներս\nՀարատևության\nՀրդեհի մեջ են...\n\nԵս պիտի գնամ\nՎաղվա նոր օրը դիմավորելու...\nՈր թռչունները\nԵրգ հունցեն խինդով,\nՈր բողբոջները\nՊայթեն անդադար,\nՋրերն իրարու\nՓոխ տան մաքրություն\nՈւ արտացոլվեն\nԿապույտ երազիս\nԼեռան գագաթին..."}},{"title":{"hy":"ՀԱՎԱՏԱՄՔ"},"group":{"hy":"ՍԻՐՈ ԱՍՏՂԱՇԱՐ"},"text":{"hy":"                Կարենին\n\nՈտքդ կպավ քարին, տղաս,\nԵվ ցավ բերեց քո ոտքերին...\nԱղերսում եմ, իմ հեգ տղա,\nՄի շտապիր ասել հանկարծ,\nՈր քո ծաղկուն Հայաստանը\nՔարքարոտ է...\n\nԳուցե կյանքում նորից, նորից\nԴու սայթաքես...\nԲախվես... այրվես,\nԱյդժամ անգամ չմտածես,\nՈր երկիրը քո Նաիրյան\nՔարափոտ է...\n\nԲայց եթե դու մայր Սևանից\nՄեկ մարգարիտ թեկուզ հանես,\nԽնդրում եմ ես –\nՀաշվիր, տղաս,\nՀայաստանը Մարգարիտ է։\n\nԽնդրում եմ քեզ, չտրտնջաս,\nԹե հողը մեր լոկ քարից է ու քարափից...\nՄեր երկիրը\nՄարգարիտից ու ոսկուց է,\nՄեկ էլ... քարից։"}},{"title":{"hy":"ԵՍ ՉԵՄ ԲԱՐԿԱՆՈՒՄ"},"group":{"hy":"ՍԻՐՈ ԱՍՏՂԱՇԱՐ"},"text":{"hy":"Ես չեմ բարկանում,\nԵրբ ինձ նեղում են,\nԵրբ ինձ ժխտում են,\nԵրբ ինձ դաղում են...\nԵս չեմ կուրանում -\nԵս սարսափում եմ,\nԵրբ ինձ խղճում են...\nՁայնս ծալվում է,\nԱչքս՝ թափառում,\nԼույսս հոգնում է,\nՇուրթս՝ կակազում,\nԻմ տեսած բոլոր\nՏառապանքները\nԲազմապատկվում են...\nԵս կորանում եմ,\nԵվ իմ ծաղիկը\nՑրտահարվում է..."}},{"title":{"hy":"ՄՈՐՍ"},"group":{"hy":"ՍԻՐՈ ԱՍՏՂԱՇԱՐ"},"text":{"hy":"Քո ձեռքերի լռության մեջ\nՈրքա՜ն ճիչ կա\nԵվ հացի բույր,\nՔո աչքերի հոգնության մեջ\nՀազար ժայռի բախված ցավ կա,\nԱրևի լաց, կորուստի շեր։\nՔո հավատի սեգության մեջ\nԼուսաճակատ Մասիսը կա,\nԱրաքսը կա արևահոս..."}},{"title":{"hy":"ԵԹԵ ՏԵՍՆԵՄ"},"group":{"hy":"ՍԻՐՈ ԱՍՏՂԱՇԱՐ"},"text":{"hy":"Եթե տեսնեմ՝\nԻնչ-որ մեկը\nՊղտորում է\nԿաթնաղբյուրը առավոտի...\nԻնչ-որ մեկը\nՇրջանցում է...\nՁեռքին պահած\nՈխի մամռոտ զարդանկար,\nԱչքում վառած\nԽաբվածների արտանկար,\nԴեմքին դաջված\nՀայցվորների հայտագրեր...\nՈւ թե լսեմ՝\nԻնչ-որ մեկը\nՇողոքորթում գոռոզներին,\nՉեզոքներին պարսավում է,\nԾախում,\nԱռնում,\nՈւ սակարկում...\nՍև ամպի պես ինձ կպարպեմ..."}},{"title":{"hy":"ԱՍԱ"},"group":{"hy":"ՍԻՐՈ ԱՍՏՂԱՇԱՐ"},"text":{"hy":"Ասա...\nԹեկուզ ամոթ լինի\nԱսելն անգամ...\n\nԱսա...\nՑավդ խորունկ լինի –\nՏանեմ,\n\nՄութը հույսդ հունցի –\nՎառեմ,\nՀողմը բույրդ տանի –\nՍանձեմ,\n\nԲախտդ լինի կիսված –\nՏոկամ,\nՄիտքդ տկար լինի –\nԶինեմ։\n\nԱսա...\nԹեկուզ տխուր լինի\nԱսելն անգամ,\n\nԱսա՛,\nՄի՛ հապաղիր,\nՈր հավատամ,\nԹե չի եղել\nՍեր,\nՑնծություն\nՈւ բաժանում..."}},{"title":{"hy":"ՉՈՂԲԱՍ ՀԱՆԿԱՐԾ"},"group":{"hy":"ՍԻՐՈ ԱՍՏՂԱՇԱՐ"},"text":{"hy":"Չողբաս հանկարծ,\nԵթե ավերվեն խոսող ձեռքերդ...\n\nՉհեծեծաս հանկարծ,\nԵթե ծրարվեն լսող աչքերդ...\nՈւ չկորանաս,\nԵթե արգելեն լսողությունդ։\n\nՈղբա՛ դու, տղաս,\nՄեկ ուրիշ բանից –\nՔաղցկեղից հոգու,\nՀեծեծա՛, տղաս,\nՄեկ ուրիշ ցավից –\nԽավարից հոգու,\nԿորացի՛ր, տղաս,\nՄեկ ուրիշ վախից –\nԿապանքից հոգու,\nՈր արթնանալիս\nՀետագծվում է սապատը մեջքի\nԵվ սակարկում են\nՀրաբույրերը\nՄեղվածաղիկի...."}},{"title":{"hy":"ԻՆՁ ԹԱՔՈՒՆ ՍԻՐԵՑԵՔ"},"group":{"hy":"356"},"text":{"hy":"Ինձ թաքուն սիրեցեք, աղջիկներ,\nՈր դաշտում խորդենին բուրվառի,\nԻնձ զրկեք հեքիաթից ձեր զորեղ,\nՈր մարդիկ երազներ չմուրան։\n\nԻնձ տարեք ննջարանն արևի,\nՈր դեմքիս ծիածան հարսնանա,\nԻմ ճամփին ծնծղաներ զարկեցեք,\nԹող դավող հոգիներն արտասվեն,\nԲռնեցեք ուռկանով հրդեհներ,\nԹող ծովում կայծակներ թառամեն...\n\nՊարգևեք ինձ հուշեր, աղջիկներ,\nԻնձ խաբեմ թովչանքով հուշերի,\nԻնձ տանեմ կամրջով ոսկեծամ,\nԱլևոր մտքիս հետ պապանձվեմ..."}},{"title":{"hy":"ԻՆՁ ԿԱՆՉԻՐ ՍՈՒԼՈՑՈՎ"},"group":{"hy":"356"},"text":{"hy":"Ինձ կանչիր սուլոցով,\nԹող հուշերն իմ արբեն,\nԵս մրսում եմ այնպես,\nԵվ չկամ... առանց քեզ։\n\nԻնձ կանչիր շեփորով,\nԹող հալվի ձյունը մեր,\n...Իմ կողքին որբացավ\nՄի ծաղիկ մենավոր։\n\nԻնձ կանչիր խմբերգով,\nԹող կարոտն իմ այրվի,\nՁեռքերս արթնանան՝\nՈւսերդ շղարշեմ...\n\nԻնձ սիրիր մոռացած,\nԵս հոգնել եմ այնպես,\nԾերացել եմ այնպես\nԵվ չկամ առանց քեզ։"}},{"title":{"hy":"ՏԵՍ"},"group":{"hy":"356"},"text":{"hy":"Տե՛ս, ներում են ինձ պատժելու նման, -\nԵս ծերություն եմ գողանում ժայռից,\nԵվ շանթահարվում հուշերգի նման։\n\nՆերելու նման երբ ինձ պատժում են, -\nԵս համրություն եմ գողանում համրից,\nԵվ գինովանում աղոթքի նման։\n\nԵրբ ինձ ատում են սիրելու նման, -\nԵս սառնություն եմ գողանում սառցից,\nԵվ վերադառնում հայցվորի նման։\n\nՈւ երբ սիրում են ատելու նման, -\nԵս խնկաբույր եմ գողանում հողից,\nԵվ բյուրեղանում արցունքի նման։"}},{"title":{"hy":"ԳՆՈՒՄ ԵՄ ՀԻՄԱ"},"group":{"hy":"356"},"text":{"hy":"Գնում եմ հիմա...\nԿորուստներ տալով՝\nԽղճիս արցունքը\nՄի ծածկիր սևով,\nՄտքիս երամը\nԴարձրու կռունկ...\nԶուր ես ինձ տանում\nԱրվեստանոցը\nԵրեսպաշտության.\nԶուր ես ինձ մանրում\nՀին հուռութքի մեջ\nՇողոքորթության։\n\nՎառի՛ր կերոնս,\nՄերժի՛ր խաչագող\nՀարճերի ոգին,\nՇրջի՛ր գլխիվայր\nԽրախճանք t":{"hy":"                          ԵՐԿԻՐ ՀԱՅՐԵՆԻ\n\nՀԱՅԱՍՏԱՆ\nԻմ մեջ որբացած արևի ձայն կա,\nՔաղցած թռչուն կա իմ մեջ խևացած,\nԱստվածաշնչյան Արարատը կա\nԵվ ամրությունը նրա քաջերի...\n\nԻմ մեջ մեղրածոր և՛ քաղցրություն կա,\nԵ՛վ դառնություն կա, երբ դառնացնում են,\nԵրբ զայրացնում են, իմ մեջ պոռթկում կա,\nՈգեկան սով կա իմ մեջ հեղեղված...\n\nԵվ իմ մեջ, իմ մեջ Եռագույնը կա,\nԹշնամիներիս հայացքը կավե...\nԵվ այդ բոլորին իրար կապողը,\nԵրկի՛ր, հավատն է քեզնից ժառանգած։"}},{"title":{"hy":"ԴՈՒ ՀՈՂ ԻՄ, ԱՐՑԱԽ"},"group":{"hy":"ԵՐԿԻՐ ՀԱՅՐԵՆԻ"},"text":{"hy":"Եվ իմ ուզածը ոտնահարեցին...\nՄի բուռ ծիծաղիս գամեցին ցավեր,\nԸնթացքն իմ շրջին թեքության ծովում,\nԻմ զենը տարան,\nԵվ ինձ դարձրին\nՁախորդ ուղևոր,\nՁախորդ մենավոր\nԵվ ձախորդ աստված...\n\nԱփսոս, որ կյանքը\nԱնարդարացի\nԱնծաղիկ օրում\nԿալսվում է լուռ\nԶորեղ ոտքի տակ...\n\nԱփսոս, ինձ կանչող\nՀողը լեռնապատ,\nՈր իմն է եղել...\nԱղի արցունք է\nԻմ ներսում ցամքած,\nԱնճար բողոք է\nՀանճար արևի,\nՈւ մի քացախված\nՍահման ցասումի...\nԴու հող իմ, Արցա՛խ,\nԿարմիր նշխար ես,\nԿարմիր հարսանիք...\n\nՏա՛ր ինձ խնջույքիդ,\nՈր գինովանամ...\nԺխտող դեմքերին\nԵս... ցասումանամ..."}},{"title":{"hy":"ԵՍ ԾԱՐԱՎԵԼՈՒ"},"group":{"hy":"ԵՐԿԻՐ ՀԱՅՐԵՆԻ"},"text":{"hy":"Ես ծարավելու տվայտանք ունեմ,\nԶինվոր չդարձած զոհերիս համար,\nԵվ իմ դատարկված ձորերիս համար,\nԵվ իմ խեղճացած ցասումիս համար...\nԳանգատ-ցավ ունեմ, ափ չհասած հավքեր,\nՄտրակված աչքեր ու կծու ձայներ,\nՄամուռով դաղված շողակաթ ջրեր,\nՈխը բերանում ամլացած պապեր...\n\nԼացո՛ղ արեգակ,\nՕրենքդ ձաղկեմ,\nՈ՞րերորդ անգամ քո երկնքի տակ\nՃակատագիրն իմ փոխվեց ու դաղվեց,\nԿռունկս մնաց Նարեկա դաշտում,\nԱրցախ աշխարհս կրակվեց դաժան...\nԵվ ես խաշվեցի շրթունքով ծարավ։\n\nԱսա՛, արեգա՛կ,\nԻնձ ինչպե՞ս պատժեմ\nԵվ ի՞նչ լինեմ ես...\nՈր ես չունենամ հողմահարվելու\nԵվ ծարավելու տվայտանքը մեծ..."}},{"title":{"hy":"ՖԻԴԱՅԻ ԱՂՋԿԱ ԵՐԳԸ"},"group":{"hy":"ԵՐԿԻՐ ՀԱՅՐԵՆԻ"},"text":{"hy":"Բերդաձորի մախմուր աղջիկ,\nՏաղերգություն միջնադարի,\nՄորմոք վառող եղնածաղիկ,\nԺամերգություն նոճիների...\n\nՔո աչքերում՝ սև ու կաթե,\nՄեծ ամառ կա, համեղ հեքիաթ,\nՄինչև անգամ քո զարմանքում\nՏաք մեղսանք կա, սեր... ու երդում։\n\nԱնմեղ աստված,ո՞ւր ես շտապում,\nՇուտով կգան բույրեր վառման,\nՀայի ձայն է լույսը բերում\nՈւ եռագույն կտակարան։\n\nՀայի ձայն է լույսը ծորում,\nՈր կրակում ինձ չխաչեմ,\nՔա՛ջ Ֆիդայի, ո՞ւր ես շտապում,\nՍև սելջուկին ես կխաչեմ..."}},{"title":{"hy":"ԱՇԽԱՐՀՈՒՄ ՀԻՄԱ"},"group":{"hy":"ԵՐԿԻՐ ՀԱՅՐԵՆԻ"},"text":{"hy":"1.\nԱշխարհում հիմա\nԿյանքը դատարկ է՝\nՓուչ տակառների զնգոցի նման։\n\n2.\nԱշխարհում հիմա\nԵզերքը սև է,\nԿայծակը մոտ է երկնքին պայթում։\n\n3.\nԱշխարհում հիմա\nՑավը կատակ է,\nԾիծաղը խաղ է,\nԱրևը սուրճ է՝\nՄութ աչքերի պես խոնավով շաղված։\n\n4.\nԱշխարհում հիմա\nՀավատքը մունջ է,\nԲախտը խխունջ է,\nԿարկուտը մուրճ է ու մանգաղ...\n\nԵս այդ բոլորը դարձած առանցք՝\nԼուռ պտտվում են աշխարհի շուրջը..."}},{"title":{"hy":"ԵՐԿՐԱՇԱՐԺ"},"group":{"hy":"ԵՐԿԻՐ ՀԱՅՐԵՆԻ"},"text":{"hy":"              07.12.88 թ.\n\n\n1.\n\nԵրկրաշարժի աղետի օրը\nՍև կարկուտ տեղաց,\nԵվ սև սուգ կապեց\nՇիրակա դաշտում։\nԼեռը Գուգարաց,\nՑասումից ցնցված,\nՏեսավ, թե ինչպես\nՓլվում են փերթ-փերթ\nՍուրբ պալատները\nՀայոց աշխարհի...\nՈւ տեսավ, տեսավ\nԵվ ոչ թե հազար,\nԵվ ոչ էլ չորս հազար,\nԵվ դեռ ավելին,\nԵվ դեռ ավելին,\nԱրեգակ սիրող սրտեր դժոխքեց...\nՄի բուռ աշխարհս հողատակ զարկեց,\nԾաղկած շեներս փլատակ սարքեց,\nՀազար որբ տվեց,\nՀազար ողբ վառեց,\nՈ՞նց կարողացավ հազար խինդ մարել,\nՈ՞նց կարողացավ փոքրիկ աշխարհին\n\nԱյդքան ցավ խարկել,\nԱնեծքով դաղել,\nԱնաստվա՛ծ աստված...\n2.\n\nԵվ հաջորդ օրը երկրաշարժի\nԵս տեսա, տեսա\nԽանձված երկինք,\nԴիակների ծուխ,\nԵվ ցավերի չու\nԽեղվածների մեջ...\nԱփսեների պես\nՓշրված-կիսված\nՀազար տուն ու տեղ\nՄխում էր, մխում...\nԵվ խարույկ դարձած\nԱվերակներում\nՄի կանաչ ձայն է\nՏարածվում ներսից.\nԽումբը փրկարար նետվում է առաջ,\nԽնդրում, աղաչում,\nՈր չվախենա հանկարծ աղմուկից...\nՈւ ցավ զգալիս,\nՁայն տա, չլռի...\nԵվ սղոցում են, սղոցում երկար,\nՍալերը ջղուտ...\nԵվ խենթանում են\nՈր... կյանք են փրկում։\nԻսկ մի քիչ հեռու,\n\n\nՄի ջահել տղա\nԿիսացնորված\nՃիչերն իր մեխեց\nՓլատակներին,\n- Փրկությո՜ւն բերեք...\n\n3.\n\nԵվ հաջորդ օրը երկրաշարժի\nԶոհերն անթիվ են ու չծածկված...\nՑավերն հազար են...\nԱսես աշխարհից ցավ-մուր է թափվում,\nՄուր՝ լերդ-լերդ արյան,\nԱրյունով բացված փլատակների.\nԽոռոչների մեջ։\nԲզկտված սրտեր\nԳիշեր ու ցերեկ կիսում են, բանում,\nՈր ճիչը մարեն\nԿույս խեղվածների...\nԵվ հռնդյունով,\nԴեգերումներով\nԽառնվել իրար\nԼայզեր ու հատիչ,\nՔլունգ ու բրիչ...\nՀագուստի նման ձևում են,\nՓերթում\nԱմրության սալեր...\nՈր հույսը վառեն\nՈղջ թաղվածների...\n\n\nԵվ բարձրահարկի փլատակներում\nՄի կին ալեհեր\nՓնտրում է, գտնում\nՁեռքերն ու աչքերը հարազատների...\nԵվ քնածների երթն է ծանրանում\nՈւսերիս վրա ու շրթունքներիս...\n\n\n4.\n\nԵվ հաջորդ օրը\nՄեր բախտը կիսված\nՄեզ հետ էր կարծես,\nՈր մեր դեմ, մեզ հետ\nԽուլ պատերազմեց\nԸնդերքը հողի...\nԵվ ավերակեց\nԱրագածների աչքերի առաջ\nԽնկա... մի երկիր,\nՈւ մի ժողովուրդ՝\nՍրտով վշտառու,\nԿիզված խոր ցավից\nՍև երիզներով\nԴրոշներ կախեց։\nԵվ ինչքա՜ն զոհեր\nՉունեցան դագաղ\nԵվ հուղարկավոր...\nԵվ չարժանացան\nՈ՛չ լաց ու կոծի,\n\n\nՈ՛չ թաղման ծեսի...\nԱ՜խ, ինչպե՞ս ողբամ\nԵվ վերադառնամ\nԻմ հարակատար\nՍուրբ տաճարներին,\nՈր իմ ուղեղը\nՉկրծեմ ցավից,\nՑավագար աշխարհ.\nԱյս ի՜նչ սև սյունի\nԳամեցիր դու ինձ...\n\n5.\n\nԵվ հաջորդ օրը,\nԵվ հաջորդ օրը\nԴեմս մշուշ էր,\nԾուխ ու ավերակ...\nՈղջ թաղվածների\nՍարսուռող տապան։\nՅոթ վերքի կիսված՝\nՄխում էր գունատ\nԵրկիրն իմ Շիրակ...\nԵվ ցավից ցավոտ\nՄամուռվեց լեզուս,\nՈւ կկվի նման\nՀեկեկաց հոգիս.\n- Մի՞թե, կեղծ աստված,\nՄենք նորից, նորից\nԴատապարտված ենք\n\n\nՃակատագրով...\nԻնչո՞ւ ես խլում\nՏվածդ, աստվա՛ծ,\nՏատասկապատում\nՀանդերս կապույտ,\nԴժոխքված ձայնով\nԻնչո՞ւ ես ձաղկում\nԴեմքը անցյալիս,\nԵվ արցունքոտում\nԱչքերը մանկան։\n\n\n6.\n\nԵվ հաջորդ օրը,\nԵվ հաջորդ օրը\nՑավս առյուծ է,\nԲախտի՛կս խռով,\nՆերարկի՛ր իմ մեջ\nԼիցք... արիության,\nՆոր չեն ինձ համար\nՎթար ու աղետ\nԵվ երկրաշարժ...\nԴիմացել եմ ես\nԵվ դիմակայել\nՀազարամռունչ\nՓորձությունների...\nԱվերակվել եմ\nՏաք մոխիրների\n\n\nԽուրձ-խուրձ բոցերում,\nՓլատակներն են\nԲռնանում զորեղ\nՄոլությամբ հզոր,\nԽորովում աղմուկ,\nՍուգ ու վայնասուն։\nԲա՛խտ իմ կրակված,\nՈրբերս շատ են,\nՏո՛ւր հզորություն ամենավսեմ,\nԱռնականություն ամենազորեղ,\nԵվ ր առավոտը\n        Ֆիդայի տեսքով։\n\n        Գնամ սարերը,\n        Գնամ ամբարեմ\n        Սիրտը ոսոխի...\n\n        Կույս ծաղիկները՝\n        Մովսեսի1 դեմքով\n        Մանչեր են ծնում։\n\n        Մենք շատանում ենք\n        Սարսուռներ էրնող\n        Սարերի վրա...\n\n        Գնամ... որդուս պես\n        Իմ բաժին ղատով\n1 Մովսես Գորգիսյան – զոհված Երասխի ճակատամարտում։\n\nՊարտքերս մարեմ...\nԳնամ... ես բերեմ\nԿապանքներ այրող\nՀորովելներս..."}},{"title":{"hy":"ԵՎ ԵՐԿԱՐ"},"group":{"hy":"ԵՐԿԻՐ ՀԱՅՐԵՆԻ"},"text":{"hy":"Եվ երկար, երկար\nՀաշտվել էինք...\nԵվ չէինք խնդում,\nՉէինք մոտենում մեր ակնթարթին...\nԲթացել էինք,\nԵվ չէինք կարող մենք արտաբերել\nՁայն ասպետական,\nՈւ այս տրտմունքը մեր մտքերի մեջ\nԱնվանում էինք ցավ տիրանական...\nՈւ խորովվում էր մեր զույգ աչքերում\nՅոթը տառապանք յոթ հնչյուններով,\nԵվ չէինք հասնում բնազդի ծովին\nԵվ մնում էինք անուժ, անկորով,\nԿասկած-սարսափով...\nՀաշտվել էինք...\nԵվ սրտի տապից\nՀույսն էր բռնանում,\nՄիտքը՝ որբանում,\nԿամքը՝ մերկանում...\nՈւ գնում էինք հաղթողների պես՝\nԱռանց հավատի ու շրթներս զսպած...\nԵվ սպասումի տիրակալը մեծ\nՄեզ համբուրում էր ու ուսուցանում\nԴժվար արվեստը ինքնազոհության...\n\nՀաշտվել էինք,\nՊարպվել էինք...\n\nՉէինք մոտենում մեր ակնթարթին,\nՈւ գնում էինք ամոթ խմելով,\nՈւ չկայինք մենք,\nՈւ չկայինք մենք..."}},{"title":{"hy":"ՕՏԱՐ ՃԱՄՓԵՔՈՎ"},"group":{"hy":"ԵՐԿԻՐ ՀԱՅՐԵՆԻ"},"text":{"hy":"Օտար ճամփեքով գնում են անդարձ\nԼքյալները խենթ,\nԳնում են, սակայն ունեն Դավթի տուն,\nԿույսեր հոլանի,\nԳնում են անդարձ,\nՄերկ ու սևասուգ,\nԻրենց հայրենի դաշտերը թողած,\nՏապանը Նոյի,\nԳնում են ասես իրենց որոնելու,\nԳնում են տաղտուկ և շփոթահար՝\nՀեքիաթի կապույտ թռչուն որսալու,\nԵվ իմ ականջում նրանց խեղճության\nԾղրիդն է երգում։\n\nՕ՜, խելագարնե՜ր,\nԵղեռնը տեսած արյունս վկա,\nԴուք չեք սիրել ձեզ,\nԹքել եք դուք ձեր երեսի վրա,\nՍեփական «ես»-ի դաշտերը զօծել,\nԱրմատազերծել գութը ձեր ներսի,\nԽիղճը կացինել, զուլալը պղծել՝\nՀանուն ձեր շահի և հաջողության...\n\nԵղեռնը տեսած ամեն խաղանդամ\nԹող դասեր տա ձեզ,\nԴասեր Դեր-Զորի ու Բուխենվալդի...\nԴասեր հավատքի,\n\nԴասեր կարոտ եց...\n\nԵս վեր հառնեցի աղավնի դարձած,\nՕրհնեցի քեզ, երկնասո՛ւյզ իմ լեռ,\nՑնծա՛ դու ինձ հետ գոնե երազում,\nԵվ զարթնիր իբրև քաղցած հիացում։"}},{"title":{"hy":"ՄԵՆՔ"},"group":{"hy":"ԵՐԿԻՐ ՀԱՅՐԵՆԻ"},"text":{"hy":"Մենք ազգ ենք տոկուն\nԵվ արիական...\nՎաչկատուն ցեղը մեզ չի սասանի,\nԵվ չի ջլատի ՇՐՋԱՓԱԿՈՒՄԸ...\nՄենք պինդ ընկույզ ենք,\nԵվ Նոյյան որդի,\nԱյդ մենք են փարվել\nՍուրբ Քրիստոսին,\nԵվ սրբացել սուրբ...\nՈչ թե շեղաչը\nՈւ բարբարոսը\nԱյդ կասպիական...\n\nՄենք հայ ենք ու կանք,\nՈւ դեռ կզնգանք...\nՄեր ոգին որձ է\nՈւ անբռնելի..."}},{"title":{"hy":"ԱՂՋԿԱՍ՝ Նաիրային"},"group":{"hy":"ՍԻՐՈ ԿԱԹԻԼՆԵՐ"},"text":{"hy":"                       ՍԻՐՈ ԿԱԹԻԼՆԵՐ\nԱՂՋԿԱՍ՝ Նաիրային\nԵրևանի սիրուն աղջիկ՝\nԱդամանդե ցոլանքներով...\nՔո աչքերից լույս է թափվում՝\nԱնմեղություն Աստվածների։\n\nԴու՝ Նաիրյան հպարտ բարդի,\nՍլացիկ ես կարապի պես,\nԵրկնքի պես ջինջ ու մաքուր\nՍեր ես վառում հիացումի։\n\nԴու կաքավ ես՝ կաքավում ես,\nԴու շարժում ես շունչը դարի,\nԵս ապրում եմ քո աչքի մեջ՝\nՈրպես կյանքի քաղցր երազ։"}},{"title":{"hy":"ՄՈՐՄՈՔ"},"group":{"hy":"ՍԻՐՈ ԿԱԹԻԼՆԵՐ"},"text":{"hy":"Մա՛յր, ձեռքերիդ լռության մեջ\nՈրքա՜ն ճիչ կա\nԵվ հացի բույր...\nՄա՛յր, աչքերիդ հոգնության մեջ\nՀազար ժայռի բախված ցավ կա,\nԱրևի լաց, կորուստի շեր։\n\nՄա՛յր, հավատիդ սեգության մեջ\nՄարտի կանչող Արցախը կա...\nՔաջերը կան ծաղիկ-ծաղիկ։\n\nՄա՛յր, շունչդ տուր՝ ես արթնանամ,\nՄեծ ափիս մեջ տաք փամփուշտ դիր...\nԳոնե մի օր իմ խուլ կյանքով\nԹիկունք լինեմ հաղթողներին..."}},{"title":{"hy":"ՄՈՒԹԻ ՊԵՍ"},"group":{"hy":"ՍԻՐՈ ԿԱԹԻԼՆԵՐ"},"text":{"hy":"Մութի պես ճամփորդ է աշունը –\nՎնգում է ծոցիս մեջ անողոք,\nԱսում են՝ շամբոտ է աշունը,\nՋրերը մեռոն են ու աղոթք։\n\nԵրկիրս Նարեկ է ու գինի,\nԵրանի՜ հեքիաթն իմ ծաղիկվեր,\nՈւ մորս խամրած ձեռքերին\nԿակաչի նեկտարը բարուրվեր։"}},{"title":{"hy":"ԹՈՌՆԻԿԻՍ"},"group":{"hy":"357"},"text":{"hy":"ԹՈՌՆԻԿԻՍ՝ Տաթևիկին\nՄախմուր դաշտի մախմուր աղջիկ,\nՏաղերգություն ոսկեդարի,\nԱրև վառող եղնածաղիկ,\nԺամերգություն ուռիների։\n\nՔո աչքերում հեզ ու կաթե\nՄեծ գարուն կա, համեղ հեքիաթ,\nՄինչև անգամ՝ քո զարմանքում\nՏաք անուրջ կա, սեր ու երդում։\n\nԴու նազ աղջիկ՝ նուրբ ու շքեղ\nՈրմնանկար աստվածների...\nԴու սուրբ-սրբոց, վանքի տաճար,\nՀամբերություն քարափների։\n\nԱնմեղ ծաղիկ, ո՞ւր ես գնում,\nԻնձ գորով տուր աստեղնային,\nԹափ տուր ոգուս ձայնը լուսե,\nՈր հունձք դառնաս լուսաբացի..."}},{"title":{"hy":"ԿՐԿՆԻՐ ԴՈՒ ԻՆՁ"},"group":{"hy":"357"},"text":{"hy":"Կրկնի՛ր դու ինձ,\nԻնձ երկունք տվող,\nՆույնչափ ավերող,\nՆույնչափ ափ հանող,\nԾնունդը մահից\nՀաճախ տարբերող\nՄԱՐԻԱՄԱԾԱՂԻԿ։\n\nԻնքնամերժ ոգուս\nԱրդարացնելու\nՈրքա՜ն ուժ ունես,\nԵվ դաշնության բոց...\nԿրկնի՛ր դու ինձ,\nԼցվի՛ր տիրամոր կապույտ հիացքով,\nՏո՛ւր ներդաշնություն,\nՀրճվանք բոսոր...\nՈր բախտս լինի ծովերի պես բիլ,\nՈր մտաբերեմ գույնը աչքերիդ,\nՈրոնց կարծես թե չեմ հիշում արդեն,\nՈրոնց կարծես թե չեմ այրել ցավով,\nԵվ որոնց համար ես չկամ արդեն...\n\nԿրկնի՛ր դու ինձ,\nԻմ անո՜ւշ, անո՜ւշ\nՄԱՐԻԱՄԱԾԱՂԻԿ..."}},{"title":{"hy":"ԻՄ ՇՈՒՆԸ"},"group":{"hy":"357"},"text":{"hy":"Իմ երազի ծոցում, կարծես ամեն գիշեր,\nՀին բազալտի տակից դուրս էր գալիս թափով,\nՎաղուց փոշի դարձած, իմ գամփռը խոժոռ...\nԴուրս էր գալիս սևբաշ, սևահողմի նման,\nՄի մեծ շղթա վզին, շղթայի տակ՝ վերքեր...\nԴուրս էր գալիս թափով, ու թափ տալիս\nայնպես\nԵրկաթակուռ շղթան,\nՈր զնգում էր չորս դին զրահների նման,\nԹափ էր տալիս իրեն, ինչքան սիրտը կուզեր,\nՀետո կլանչում էր...\nՇղթան զարկով խփում որձաքարին հսկա,\nԵվ կայծեր էր թռչում աստղիկներին վառող,\nՀետո տարածվում էր մութի նման տխուր,\nԳալիս մոտիկ-մոտիկ՝ հորթի նման լիզում\nԻմ ձեռքերը հոգնած...\nԻսկ ես, քացի տալով, գոռում էի,\nՆա փախչում էր, գնում թաց խսիրին պառկում.\nԳլորվում էր կամաց արցունքները աղի,\nԵվ մի օր էլ խցում\nՆա կորացավ դանդաղ, շղթան ծալվեց հողին,\nՈւ ավետեց հոգին...\nԵս տխրեցի երկար և հանեցի վզից\nՄաշված ու հին շղթան ու թաղեցի հողում...\nԵվ հասկացա, որ ես բիրտ եմ եղել, դաժան,\nԻմ տաք սրտի տեղակ քար եմ պահել կրծքում...\nԵվ այս երգը ծնվեց...\n\nՀիմա ամեն գիշեր իմ երազի ծոցում\nԳուրգուրում եմ նրան...\nԲայց նա հեռու փախչում, կլանչում է երկար,\nԱնիծում է ասես՝ ինչո՞ւ շուն էր ծնվել։"}},{"title":{"hy":"ԷԼ ՉԵՄ ԳԱ ՔԵԶ ՄՈՏ"},"group":{"hy":"357"},"text":{"hy":"Էլ չեմ գա քեզ մոտ...\nԻնձ պիտի սիրեմ՝\nԿաթնաբույլի մեջ ճառագայթների...\nԱրձակեմ ոգիս անարատ դաշտում,\nԾովից մինչև լյառ ագատ երկնչեմ...\n\nԻնձ պիտի սիրեմ\nԵվ չլալկվեմ...\nՀամբույր չտեսած աղջնակի պես.\nՊիտի արարեմ\nԱրբունք ու գինի...\nԵվ ինձ հռչակեմ\nՃանաչված ու մեծ...\n\nԷլ չեմ գա քեզ մոտ,\nԵվ չեմ խենթանա լույսիդ ծարավից,\nԵս անգիր գիտեմ գիրը ճակատիս,\nԵվ ճիչը մեղքի, և գույնը ցավի.\nԹող մոտենամ ինձ,\nԱչքերն իմ սիրեմ,\nՕրն անարատ է, սերը՝ անազատ։"}},{"title":{"hy":"ՎԵՐԱԴԱՐՁԵԼ ԵՍ"},"group":{"hy":"357"},"text":{"hy":"Վերադարձել ես...\nՈր իմ աչքերում թռչուններ մեռնեն,\nՈւ մի սիրտ ողբա,\nՈւ մի կամք մրսի հովտում Գեղամա...\n\nՎերադարձել ես...\nԱյնպես խեղճ ու ծեր,\nԱյնպես պարպված ու այնպես մաշված,\nՈր իմ աչքերից ներումներ շահես,\nՈւ ես աշխարհում\nԾաղրը շալակեմ,\nՄեխեմ ճակատիս մացառը ցավի..."}},{"title":{"hy":"ՀԵՔԻԱԹ ԴԱՐՁՐՈՒ"},"group":{"hy":"357"},"text":{"hy":"Թե հանկարծ, հանկարծ ակամա սիրես,\nԻնձ կբեկանեմ,\nՉեմ փնտրի ուրիշ կանացի մի ձեռք,\nՈր իմ ամլացած պատրանքն հնչեցնի...\n\nԹե դժվար սիրես...\nԻնձ կհաշտեցնեմ...\nՉեմ սնգրտա ես քմահաճ խաղից,\nՇողոքորթ ձայնից ես չեմ ծերանա,\nՀողին սեր բերող անձրևի նման\nԿլինեմ զորեղ ու անապական,\nԿլինեմ ղողանջ – հրճվանք տենչի,\nՀեքիաթի նման տաք ու թափանցիկ,\nՀեքիաթի նման առ ինձ ափիդ մեջ,\nՀեքիաթ դարձրու,\nԹող ես հորինվեմ հեքիաթի նման,\nԹող տոկամ որպես քաղցած արշալույս,\nԵվ մեռնեմ որպես հորինված աստված..."}},{"title":{"hy":"ՄԵՆՔ ԶՈՐԱՎՈՐ ԱՅՐ ԵՆՔ"},"group":{"hy":"ԽՂՃԻ ՄՈՐՄՈՔ"},"text":{"hy":"                             ԽՂՃԻ ՄՈՐՄՈՔ\n\n***\n\nՄենք զորավոր այր ենք անվարձ,\nՉճշգրտված Աստծո Որդի,\nՄենք՝ լուսավոր ճամփորդ անդարձ\nԵվ ուղևոր կորած բախտի...\n\nՄենք՝ հպանցիկ և օրհնաբան,\nԵվ նեղացած մի բուռ տանջանք,\nՄի՞թե կրքով պիտի զինվենք,\nՈր մեր ներսում ծաղկի շուշան։\n\nՏվե՛ք ինձ լույս՝ զանազանեմ,\nՀամբերություն, մոլուցք ու խաղ,\nՇրթիս աղ կա, մորմոք վսեմ\nԵվ հացի բույր՝ լուսաշաղախ։\n\nԴուռս բացե՛ք, ամպոտ ձայնով\nՏեսանելի լինեմ վերից.\nՄենք անսասան այր ենք ոգով,\nԵվ կողոպտված Աստծո Որդի..."}},{"title":{"hy":"ԻՆՁԱՆԻՑ ԽԼԵՑԻՆ"},"group":{"hy":"ԽՂՃԻ ՄՈՐՄՈՔ"},"text":{"hy":"Ինձանից խլեցին դաշնությունն իմ սրտի,\nԼեռներում կուրացան երամները լույսի.\nՉարացան հավաստման բերկրանքները\nանտիկ,\nԵվ մոլոր համրացան պատրանքներն իմ\nդարձի...\n\nՈւ մի խենթ շնչավոր երգում էր հիվանդոտ,\nՔերում էր իմ հոգին՝ ժպիտներ մուրալով,\nԵվ նա չէր հասկանում՝ ինչո՞ւ եմ ես թախծոտ,\nԵվ այսքան անկարող, և այսքան անհեթեթ...\n\nՆա չէր չափչփում լայնությունն իմ սրտի,\nԵվ ծաղրի խարտոցող բռնությունը դաժան,\nԵվ մտքի երերուն առավոտը կաթե\nԻնչպես էր իմ ներսում սրսռում անսասան։\n\nՏարվեցի իմ ցավով, և ինձնից հեռացան,\nԱզգական ու ընկեր ու մի սեր բախտասաց,\nՄենակ եմ ես հիմա... ինձանով հիացած,\nՈր ականջ չեմ դրել ես ոչ մի տմարդի..."}},{"title":{"hy":"ԷԼ ՉԵՄ ԽԱԲՎԻ"},"group":{"hy":"ԽՂՃԻ ՄՈՐՄՈՔ"},"text":{"hy":"Էլ չեմ խաբվի –\nՎախը տեսած աչքերի պես,\nԶգուշ եմ ես...\n\nԷլ չեմ բախվի ...\nԱրդեն գիտեմ\nԱռուծախը շահի, վախի ու ծաղրանքի...\n\nԷլ չեմ լինի\nՑոփ ու գոռոզ,\nԵվ աչքի ցավ,\nԵվ աչքի փուշ...\n\nԵս կլինեմ խղճի ախպեր,\nՑավաժպտուն մի ուխտավոր,\nԵրջանկատենչ հարսնաքավոր,\nԿամ էլ համր\nՀուղարկավոր...\nՄեկի մեռած բախտի համար\nԱչքալուսանք...\nԱնգամ հենակ...\nԷլ չեմ խաբվի –\nԽաբված եմ ես։"}},{"title":{"hy":"ԼԵՌՆԱՅԻՆ ԾՈՎՈՒՄ"},"group":{"hy":"ԽՂՃԻ ՄՈՐՄՈՔ"},"text":{"hy":"Լեռնային ծովում նորից ճախրում են ծեր\nբազեները,\nՊողպատ-կռինչով կտցում, տանում են\nգույների մեղր,\nՈր ծվատելով իմ սիրտը պարպեն,\nԽառնություն վառեն դառնության հունձքով։\n\nԱզատի՛ր, տեր իմ, այդ բութ հաճույքից,\nՍաստկության մեռոն քսիր աչքերիս,\nՀոգա՛ իմ կյանքը բողոքի երգով,\nԳույների մեղրը քամիր շուրթերիս...\n\nԱչքիս տաճարում խամրում են նորեն\nՀեքիաթով սնվող մեղրը գույների,\nՈր ծանակելով իմ հոգին այրեն\nԵվ կուրծքս դողա երազի բեռով...\n\nԼեռնային ծովում բազեներն անվախ\nՎխտում են շան պես ճակատիս վրա,\nԻմ բաժին գույնը խաթարում դանդաղ,\nԵվ պայտում իմ մեջ ցավերի լեռներ,\nԲազեներ...\nՉարեր, չգիտե՞ք արդյոք,\nՎաղուց եմ ցավին ես հոտաղ դարձել։"}},{"title":{"hy":"ԵՂՅԱՄ Է ՊԵՂՈՒՄ"},"group":{"hy":"ԽՂՃԻ ՄՈՐՄՈՔ"},"text":{"hy":"Եղյամ է պեղում ցուրտն առավոտի...\nԱսես չի եղել այստեղ գարնան ճոճք,\nԵվ մախմուր կանայք չեն գողացել սեր...\n\nԳինովանում է ցուրտն առավոտի.\nՈւ մեղքի նման\nՇան կլանչոցն է հասնում ականջիս,\nՈր ես խեղճանամ,\nՀոգիս մերկանա,\nՀեսանվեմ բախտիս...\nՈւ ինձ մոռանամ։\n\n... Ու պատերի տակ\nՇան հին ոռնոցն է,\nՈր հասնում է ինձ,\nՄեջը խռովք կա,\nՀեծեծանք որբի,\nԿգժվի հիմա,\nԿքամի հոգին լռակյաց դաշտի։\n\nԵվ մշուշի մեջ պաղ կհեռանա\nՃամփան կորցրած մի մերկ առաքյալ..."}},{"title":{"hy":"ԵՍ ՀԱԶԱՐ ԱՆԳԱՄ"},"group":{"hy":"ԽՂՃԻ ՄՈՐՄՈՔ"},"text":{"hy":"Ես հազար անգամ ինձ կողոպտեցի,\nՇրթունքս մրսեց աչքում իմ շաղոտ,\nԲայց մի ծեր թունոտ այնպես շողոմվեց,\nԱսես թե լիներ երկնում յոթերորդ։\n\nԵս հազար անգամ իմ ներսում տեսա՝\nՈնց է խեղդվում խիղճը իմ տարեց,\nԵվ ոնց է գժվում խարդավանքը սև,\nԵվ ճմլվում է սոսափը կաղնու...\n\nՈնց է տոգորվում աղետը մեղքի,\nԵվ սուտը մրսում մենակյացի պես,\nԻնձ ո՞վ ավետեց, որ լինեմ ես բախտ,\nՔո վիշտը տանեմ ու մնամ խաբված։\n\nԵս հազար անգամ ինձ ավերեցի,\nՈր դու ճամփորդես, ավետյա՛ց երկիր..."}},{"title":{"hy":"ԵՐԱԶՆ ԻՄ Ո՞ՒՐ Է"},"group":{"hy":"ԽՂՃԻ ՄՈՐՄՈՔ"},"text":{"hy":"Անսխալական մահկանացու եմ,\nՉեմ պահում իմ մեջ սառույցը ցավի,\nՏապանը մեղքի չեմ կրում իմ մեջ,\nԼոկ խոսող կավ եմ\nԵվ քարքարոտ հող...\nՄի՛ նեղացնի ինձ,\nԹող վանքոտ դաշտում\nԱրդար համարվեմ,\nԽաբեմ աչքերիս,\nՈր էլ աշխարհում\nԲանակներ չկան,\nՉկան զենքեր... զորացած,\nԿորացած բախտեր,\nԱյրեր կրակված...\n\nԱրևսանձ դաշտեր,\nԵս ձեր աղբյուրն եմ,\nՀամբերությունը.\nԿարոտ-մամուռն եմ,\nՁեր աղոթքները...\nՔարը ծաղկել է,\nԵրազն իմ ո՞ւր է..."}},{"title":{"hy":"ԿՅԱՆՔՆ ԱՆՑՆՈՒՄ Է"},"group":{"hy":"ԽՂՃԻ ՄՈՐՄՈՔ"},"text":{"hy":"Կյանքն անցնում է,\nՈւ մրսում է մեղքի ձորում\nՄի արագիլ...\n\nԿյանքն անցնում է\nԱնհայտություն...\nՈւ մի տղա\nՈտաբոբիկ\nՈւ լուսահեր\nԻնձ է գալիս,\nԻնձ ընծայի\nՋահելություն։\n\nԲայց պառավն\nԱրտասվում է,\nՈւ տարածում\nՁայն բողոքաց.\n- Բան չհասկացա\nՓուչ աշխարհից,\nՉարը շատ էր,\nԽերը՝ մեռած...\nՈւ կրծքիս տակ\nԳահակալեց\nՄի հսկա քար\nԱնդունդների..."}},{"title":{"hy":"ՔԱՐՔԱՐՈՏ ՃԱՄՓԱՆ"},"group":{"hy":"ԽՂՃԻ ՄՈՐՄՈՔ"},"text":{"hy":"Քարքարոտ ճամփան անցնելու համար\nՊետք է ունենալ ճակատ լուսահեր,\nՈր կալսի ներսից տապը ցասումի\nԵվ սառնությունը երկնակամարի։\n\nՉարն ու սադրանքը ճշտելու համար\nՊետք է խենթ մագմա կանխազգացումի,\nՈր տանի ներսից ոգին դառնության,\nԵվ բարկությունը դառնա ցորեն հաց։\n\nՉապրած օրերը գտնելու համար\nՊետք է չխամրող արկած հեքիաթի,\nՈր ջնջի ցավը կեղծ լուսաբացի,\nՏա կապույտ երկինք և ձայն առաջին։"}},{"title":{"hy":"ՀԵՌՈՒ ՀԵՌՎՈՒՄ"},"group":{"hy":"ԽՂՃԻ ՄՈՐՄՈՔ"},"text":{"hy":"Գիշերը վերք է խորաբաց...\nՈւ չկա երկնքում երկինք,\nՈւ չկան ձայներ ու ցոլանք,\nԳիշերը երգ է մոռացված...\n\nԱյնպես եմ ուզում ինձ տեսնեմ,\nԾաղիկներ վաճառեմ աստղերին,\nԲզկտեմ իմ հոգին և հիշեմ\nԵրկիրն իմ սարոտ ու անգին։\n\nԻսկ այստեղ նեղսրտած տղերք\nՏեսել են քրքրում խռովքի,\nՄաղում են իմ գլխին շող-շաղիկ\nՈւ փակում ճամփաները սգի։\n\nԳիշերը վերք է խորացած,\nՏնքում է մրմունջը բողոքի,\nՈւ չկա երկնքում երկինք,\nԳիշերը ցավ է խռոված։"}},{"title":{"hy":"ԵՐԲ ՈՐ ԶՂՋՈՒՄ ԵՆ"},"group":{"hy":"ԽՂՃԻ ՄՈՐՄՈՔ"},"text":{"hy":"...Երբ որ զղջում են,\nԵրբ որ ծաղրում են,\nՈ՜նց եմ ես նեղվում աղքատի նման,\nԵվ առյուծի սիրտ պահանջում բախտից.\nԵվ նորից մենակ ես ոնց եմ ապրում,\nԵրբ որ պարզ օրը խարույկ են նետում,\nԵրբ որ խլում են քունը աչքերից,\nԵվ տաքուկ վախը արցունք է դնում...\nԵրբ փախցնում են սերը շրթունքից,\nՈնց եմ կակազում,\nՈնց եմ ծերանում,\nԴառնում վերստին մի օտարական,\nԵվ փնտրում կամքով\nԴեմքը լռության...\nՈր չի ունենում տեր ու կայսրություն,\nԴիմակ ու աղետ...\nԽենթ երանություն,\nԱնուշ մեղմություն,\nՄեկ էլ խելքահան մի անդորրություն...\nԱ՜խ, անդորրություն,\nՇիրակա դաշտից՝ մինչև Ծիր Կաթին..."}},{"title":{"hy":"ԸՄԲՈՍՏՅԱԼՆԵՐԸ"},"group":{"hy":"ԽՂՃԻ ՄՈՐՄՈՔ"},"text":{"hy":"Եվ ազատության թանձր արցունքով\nՆժարում ոգին խենթ ժամանակի,\nՄտրակված աչքով\nՉափում եմ հույսի հևքը կարկաչուն,\nԱռանց դադարի,\nԿարծես, տանում եմ պաշարը ոգուս,\nՈր հասնեմ, դառնամ\nԵվ վերադառնամ...\n\nԶարմանալի են\nԸմբոստյալները տկար՝\nԵվ առաջնորդ են, և հավատարար...\n\nԻսկ ես՝ ծպտյալ այր,\nԻնչո՞ւ եմ այդպես սաստումով լցված,\nԵվ ինչո՞ւ սառեց շրթունքիս վրա\nՏագնապը նրանց...\nՏարեգրության։\n\nԲայց հավետ ծաղկեց ճակատիս վրա\nԿարմրաշաղիկ մարիամածաղիկ։"}},{"title":{"hy":"ՔԵՆՆ ՈՒ ՍԱԴՐԱՆՔԸ"},"group":{"hy":" /* ============================================================
   2. ՄԵԽԱՆԻԶՄ
   ============================================================ */
let lang = (()=>{ try{ return localStorage.getItem("lang") }catch(e){ return null } })() || "hy";
let size = 1.15;
let theme = (()=>{ try{ return localStorage.getItem("theme") }catch(e){ return null } })() || "sepia";
const applyTheme = () => document.documentElement.setAttribute("data-theme", theme);
applyTheme();
const $ = s => document.querySelector(s);
const t = k => SITE.ui[lang][k];
const L = o => (o && (o[lang] || o.hy)) || "";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function coverHtml(b){
  const title = esc(L(b.title));
  if(b.cover){
    return `<div class="cover"><img src="${b.cover}" alt="${title}" data-title="${title}" loading="lazy" onerror="coverImgError(this)"></div>`;
  }
  return `<div class="cover"><span>${title}</span></div>`;
}
function coverImgError(img){
  const span = document.createElement("span");
  span.textContent = img.getAttribute("data-title") || "";
  img.replaceWith(span);
}

function paras(text){
  return text.split(/\n{2,}/).map(p => `<p>${esc(p).replace(/\n/g,"<br>")}</p>`).join("");
}

function chrome(route){
  document.documentElement.lang = lang;
  document.title = L(SITE.name);
  $("#brand").textContent = L(SITE.name);
  const items = [["#/",t("home"),"home"],["#/books",t("books"),"books"],["#/about",t("about"),"about"],["#/contact",t("contact"),"contact"]];
  $("#nav").innerHTML = items.map(([h,n,k]) => `<a href="${h}" class="${route[0]===k||(k==="home"&&route[0]==="")?"on":""}">${n}</a>`).join("");
  $("#lang").innerHTML = ["hy","ru","en"].map(l => `<button class="${l===lang?"on":""}" data-l="${l}">${l.toUpperCase()}</button>`).join("");
  $("#foot").textContent = `© ${new Date().getFullYear()} ${L(SITE.name)}. ${t("rights")}`;
}

function bookCard(b){
  return `<li class="book"><a href="#/book/${b.id}">${coverHtml(b)}<small>${b.year}</small></a></li>`;
}

const views = {
  home(){
    return `<section class="hero"><h1>${esc(L(SITE.name))}</h1><p>${esc(L(SITE.tagline))}</p></section>
            <h2>${t("books")}</h2><ul class="books">${SITE.books.map(bookCard).join("")}</ul>`;
  },
  books(){
    return `<h2>${t("books")}</h2><ul class="books">${SITE.books.map(bookCard).join("")}</ul>`;
  },
  book(id){
    const b = SITE.books.find(x => x.id === id); if(!b) return views.nf();
    let lastGroup = undefined, toc = "";
    if(b.chapters.length){
      b.chapters.forEach((c,i) => {
        const g = c.group ? L(c.group) : "";
        if(g !== lastGroup){
          if(lastGroup !== undefined) toc += `</ol>`;
          if(g) toc += `<h3 class="group-head">${esc(g)}</h3>`;
          toc += `<ol class="toc">`;
          lastGroup = g;
        }
        toc += `<li>${c.text
          ? `<a href="#/read/${b.id}/${i}">${esc(L(c.title))}</a>`
          : `${esc(L(c.title))} <span class="soon">— ${t("soon")}</span>`}</li>`;
      });
      toc += `</ol>`;
    } else {
      toc = `<p class="soon">${t("soon")}</p>`;
    }
    return `<p class="crumb"><a href="#/books">${t("back")}</a></p>
      <div class="book-head">${coverHtml(b)}
        <div><h1>${esc(L(b.title))}</h1><p>${esc(L(b.desc))}</p><small>${b.year}</small></div></div>
      <h2>${t("toc")}</h2>${toc}`;
  },
  read(id,i){
    const b = SITE.books.find(x => x.id === id); i = +i;
    const c = b && b.chapters[i]; if(!c || !c.text) return views.nf();
    const has = j => b.chapters[j] && b.chapters[j].text;
    return `<div class="tools"><div class="wrap">
        <a href="#/book/${b.id}">${esc(L(b.title))}</a>
        <span class="grp">${["light","sepia","dark"].map(k=>`<button data-th="${k}" class="${theme===k?"on":""}">${t("th_"+k)}</button>`).join("")}</span>
        <span class="grp">${t("size")} <button data-s="-1" aria-label="-">A−</button><button data-s="1" aria-label="+">A+</button></span>
      </div></div>
      <article class="read"><h1>${esc(L(c.title))}</h1>${paras(L(c.text))}</article>
      <div class="pager">
        ${has(i-1)?`<a href="#/read/${b.id}/${i-1}">${t("prev")}</a>`:"<span></span>"}
        ${has(i+1)?`<a href="#/read/${b.id}/${i+1}">${t("next")}</a>`:"<span></span>"}
      </div>`;
  },
  about(){
    const ph = SITE.photo ? `<figure class="portrait" style="margin-top:2.5rem"><img src="${SITE.photo}" alt="${esc(L(SITE.name))}" onerror="this.closest('figure').remove()"></figure>` : "";
    return `<h2>${t("about")}</h2>${ph}${SITE.about[lang].map(p=>`<p>${esc(p)}</p>`).join("")}<div class="clear"></div>`;
  },
  contact(){ return `<h2>${t("contact")}</h2><p>${esc(L(SITE.contact.note))} <a href="mailto:${SITE.contact.email}">${SITE.contact.email}</a></p>`; },
  nf(){ return `<p>${t("notfound")}</p>`; }
};

function render(){
  const route = (location.hash.replace(/^#\/?/,"") || "").split("/");
  const [name,a,b] = route;
  const view = name === "" ? "home" : name;
  chrome(route);
  $("#app").innerHTML = (views[view] || views.nf)(a,b);
  document.documentElement.style.setProperty("--read-size", size+"rem");
  window.scrollTo(0,0);
}

document.addEventListener("click", e => {
  const l = e.target.closest("[data-l]");
  if(l){ lang = l.dataset.l; try{ localStorage.setItem("lang",lang) }catch(_){} render(); }
  const th = e.target.closest("[data-th]");
  if(th){ theme = th.dataset.th; applyTheme(); try{ localStorage.setItem("theme",theme) }catch(_){}
          document.querySelectorAll("[data-th]").forEach(b => b.classList.toggle("on", b.dataset.th===theme)); }
  const s = e.target.closest("[data-s]");
  if(s){ size = Math.min(1.8, Math.max(.9, size + .1*(+s.dataset.s)));
         document.documentElement.style.setProperty("--read-size", size+"rem"); }
});
window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
