<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Գրողի էջ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Armenian:wght@400;600;800&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --parchment:#f3ead7;
  --paper:#fbf6ea;
  --ink:#2b2118;
  --muted:#6f5f4d;
  --red:#7a1f26;
  --line:#d9c9a6;
  --font:"Noto Serif Armenian","Noto Serif",Georgia,"Times New Roman",serif;
  --read-size:1.15rem;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--parchment);color:var(--ink);font-family:var(--font);line-height:1.75;
  padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
a{color:var(--red)}
a:focus-visible,button:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.wrap{max-width:46rem;margin:0 auto;padding:0 1.25rem}

/* Header */
header{border-bottom:1px solid var(--line);background:var(--paper)}
.bar{display:flex;flex-wrap:wrap;gap:.6rem 1.5rem;align-items:center;justify-content:space-between;padding-top:.9rem;padding-bottom:.9rem}
.brand{font-weight:800;font-size:1.15rem;color:var(--red);text-decoration:none}
nav{display:flex;gap:1.1rem;flex-wrap:wrap}
nav a{text-decoration:none;color:var(--ink)}
nav a:hover,nav a.on{color:var(--red);text-decoration:underline;text-underline-offset:.3em}
.lang button{background:none;border:1px solid var(--line);color:var(--muted);padding:.2rem .6rem;cursor:pointer;font:inherit;font-size:.85rem}
.lang button.on{background:var(--red);color:#fff;border-color:var(--red)}

/* Home */
.hero{padding:4.5rem 0 3rem}
.hero h1{font-size:clamp(2.2rem,8vw,3.6rem);line-height:1.15;margin:0 0 .5rem;font-weight:800;color:var(--red)}
.hero p{font-size:1.2rem;color:var(--muted);max-width:34rem;margin:0}
h2{font-size:1.5rem;margin:2.5rem 0 1rem;color:var(--red)}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.5rem,1fr));gap:1.25rem;padding:0;list-style:none}
.book a{display:block;text-decoration:none;color:var(--ink)}
.cover{position:relative;overflow:hidden;aspect-ratio:2/3;background:var(--red);color:var(--parchment);display:flex;align-items:flex-end;padding:.8rem;
  font-weight:600;line-height:1.3;border-left:6px solid rgba(0,0,0,.25);box-shadow:3px 4px 0 var(--line)}
.book small{display:block;color:var(--muted);margin-top:.5rem}

.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.portrait{float:right;width:11rem;max-width:40%;margin:0 0 1rem 1.5rem;border:1px solid var(--line);box-shadow:3px 4px 0 var(--line)}
.portrait img{display:block;width:100%;height:auto}
.clear{clear:both}

/* Book page */
.crumb{margin:2rem 0 0;font-size:.95rem}
.book-head{display:grid;gap:1.5rem;grid-template-columns:9rem 1fr;align-items:start;margin:1rem 0 2rem}
.book-head .cover{font-size:.95rem}
.book-head h1{margin:0 0 .5rem;font-size:2rem;line-height:1.25}
ol.toc{padding-left:1.4rem}
ol.toc li{padding:.35rem 0;border-bottom:1px dotted var(--line)}
.soon{color:var(--muted);font-style:italic}

/* Reader */
.tools{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--line);padding:.5rem 0;z-index:5}
.tools .wrap{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.tools button{background:none;border:1px solid var(--line);padding:.2rem .7rem;font:inherit;cursor:pointer;color:var(--ink)}
article.read{font-size:var(--read-size);line-height:1.9;padding:2rem 0 3rem}
article.read h1{font-size:1.9rem;line-height:1.3;margin:0 0 1.5rem}
article.read p{margin:0 0 1.1em;text-align:left}
article.read .verse{white-space:pre-line}
.pager{display:flex;justify-content:space-between;gap:1rem;border-top:1px solid var(--line);padding:1.25rem 0 3rem}

footer{border-top:1px solid var(--line);padding:1.5rem 0 2.5rem;color:var(--muted);font-size:.9rem;background:var(--paper)}
@media (max-width:30rem){.book-head{grid-template-columns:1fr}.book-head .cover{max-width:9rem}.hero{padding:2.5rem 0 1.5rem}nav{gap:.4rem 1rem}}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="brand" href="#/" id="brand"></a>
    <nav id="nav"></nav>
    <div class="lang" id="lang"></div>
  </div>
</header>

<main id="app" class="wrap"></main>

<footer><div class="wrap" id="foot"></div></footer>

<script>
/* ============================================================
   1. ԲՈՎԱՆԴԱԿՈՒԹՅՈՒՆ — այստեղ փոխիր տվյալները
   ============================================================ */
const SITE = {
  name:   { hy:"Գրողի Անուն", ru:"Имя писателя", en:"Writer's Name" },
  photo:"img/writer.jpg",   /* գրողի լուսանկար։ Եթե ֆայլ չկա՝ չի ցուցադրվում */
  tagline:{ hy:"Գրող, publicist", ru:"Писатель, публицист", en:"Writer and publicist" },
  ui: {
    hy:{ home:"Գլխավոր", books:"Գրքեր", about:"Գրողի մասին", contact:"Կապ", read:"Կարդալ", toc:"Բովանդակություն",
         back:"← Գրքերին", prev:"← Նախորդ", next:"Հաջորդ →", bookpage:"Գրքի էջ", soon:"Շուտով",
         size:"Տառաչափ", rights:"Բոլոր իրավունքները պաշտպանված են։", notfound:"Էջը չի գտնվել։" },
    ru:{ home:"Главная", books:"Книги", about:"Об авторе", contact:"Контакты", read:"Читать", toc:"Содержание",
         back:"← К книгам", prev:"← Назад", next:"Далее →", bookpage:"Страница книги", soon:"Скоро",
         size:"Размер шрифта", rights:"Все права защищены.", notfound:"Страница не найдена." },
    en:{ home:"Home", books:"Books", about:"About", contact:"Contact", read:"Read", toc:"Contents",
         back:"← All books", prev:"← Previous", next:"Next →", bookpage:"Book page", soon:"Coming soon",
         size:"Text size", rights:"All rights reserved.", notfound:"Page not found." }
  },
  about:{
    hy:["Այստեղ կլինի գրողի կենսագրությունը։ Երկու-երեք պարբերություն՝ ծնունդ, կրթություն, գրական ուղի։"],
    ru:["Здесь будет биография автора: два-три абзаца о жизни и литературном пути."],
    en:["The author's biography goes here: two or three paragraphs on life and literary path."]
  },
  contact:{ email:"writer@example.com", note:{ hy:"Գրեք ինձ՝", ru:"Напишите мне:", en:"Write to me:" } },

  /* 4 գիրք։ Յուրաքանչյուր գլուխ՝ առանձին օբյեկտ (հետագայում՝ առանձին ֆայլ)։ */
  books:[
    { id:"book-1", cover:"img/book-1.jpg", year:"2019",
      title:{ hy:"Գիրք առաջին", ru:"Книга первая", en:"Book One" },
      desc:{ hy:"Գրքի կարճ նկարագրություն՝ 2–3 նախադասություն։", ru:"Краткое описание книги.", en:"Short description of the book." },
      chapters:[
        { title:{hy:"Գլուխ 1",ru:"Глава 1",en:"Chapter 1"},
          text:{ hy:"Այստեղ կտեղադրվի թվայնացված տեքստը։\n\nՆոր պարբերությունը բաժանվում է դատարկ տողով։",
                 ru:"Здесь будет оцифрованный текст.\n\nНовый абзац отделяется пустой строкой.",
                 en:"The digitized text goes here.\n\nA new paragraph is separated by a blank line." } },
        { title:{hy:"Գլուխ 2",ru:"Глава 2",en:"Chapter 2"}, text:null }
      ]},
    { id:"book-2", cover:"img/book-2.jpg", year:"2021", title:{hy:"Գիրք երկրորդ",ru:"Книга вторая",en:"Book Two"},
      desc:{hy:"Նկարագրություն։",ru:"Описание.",en:"Description."}, chapters:[] },
    { id:"book-3", cover:"img/book-3.jpg", year:"2023", title:{hy:"Գիրք երրորդ",ru:"Книга третья",en:"Book Three"},
      desc:{hy:"Նկարագրություն։",ru:"Описание.",en:"Description."}, chapters:[] },
    { id:"book-4", cover:"img/book-4.jpg", year:"2025", title:{hy:"Գիրք չորրորդ",ru:"Книга четвёртая",en:"Book Four"},
      desc:{hy:"Նկարագրություն։",ru:"Описание.",en:"Description."}, chapters:[] }
  ]
};

/* ============================================================
   2. ՄԵԽԱՆԻԶՄ
   ============================================================ */
let lang = (()=>{ try{ return localStorage.getItem("lang") }catch(e){ return null } })() || "hy";
let size = 1.15;
const $ = s => document.querySelector(s);
const t = k => SITE.ui[lang][k];
const L = o => (o && (o[lang] || o.hy)) || "";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function coverHtml(b){
  const img = b.cover ? `<img src="${b.cover}" alt="${esc(L(b.title))}" loading="lazy" onerror="this.remove()">` : "";
  return `<div class="cover"><span>${esc(L(b.title))}</span>${img}</div>`;
}

function paras(text){
  return text.split(/\n{2,}/).map(p => `<p>${esc(p).replace(/\n/g,"<br>")}</p>`).join("");
}

function chrome(route){
  document.documentElement.lang = lang;
  document.title = L(SITE.name);
  $("#brand").textContent = L(SITE.name);
  const items = [["#/",t("home"),"home"],["#/books",t("books"),"books"],["#/about",t("about"),"about"],["#/contact",t("contact"),"contact"]];
  $("#nav").innerHTML = items.map(([h,n,k]) => `<a href="${h}" class="${route[0]===k||(k==="home"&&route[0]==="")?"on":""}">${n}</a>`).join("");
  $("#lang").innerHTML = ["hy","ru","en"].map(l => `<button class="${l===lang?"on":""}" data-l="${l}">${l.toUpperCase()}</button>`).join("");
  $("#foot").textContent = `© ${new Date().getFullYear()} ${L(SITE.name)}. ${t("rights")}`;
}

function bookCard(b){
  return `<li class="book"><a href="#/book/${b.id}">${coverHtml(b)}<small>${b.year}</small></a></li>`;
}

const views = {
  home(){
    return `<section class="hero"><h1>${esc(L(SITE.name))}</h1><p>${esc(L(SITE.tagline))}</p></section>
            <h2>${t("books")}</h2><ul class="books">${SITE.books.map(bookCard).join("")}</ul>`;
  },
  books(){
    return `<h2>${t("books")}</h2><ul class="books">${SITE.books.map(bookCard).join("")}</ul>`;
  },
  book(id){
    const b = SITE.books.find(x => x.id === id); if(!b) return views.nf();
    const toc = b.chapters.length
      ? `<ol class="toc">${b.chapters.map((c,i)=>`<li>${c.text
          ? `<a href="#/read/${b.id}/${i}">${esc(L(c.title))}</a>`
          : `${esc(L(c.title))} <span class="soon">— ${t("soon")}</span>`}</li>`).join("")}</ol>`
      : `<p class="soon">${t("soon")}</p>`;
    return `<p class="crumb"><a href="#/books">${t("back")}</a></p>
      <div class="book-head">${coverHtml(b)}
        <div><h1>${esc(L(b.title))}</h1><p>${esc(L(b.desc))}</p><small>${b.year}</small></div></div>
      <h2>${t("toc")}</h2>${toc}`;
  },
  read(id,i){
    const b = SITE.books.find(x => x.id === id); i = +i;
    const c = b && b.chapters[i]; if(!c || !c.text) return views.nf();
    const has = j => b.chapters[j] && b.chapters[j].text;
    return `<div class="tools"><div class="wrap">
        <a href="#/book/${b.id}">${esc(L(b.title))}</a>
        <span>${t("size")} <button data-s="-1" aria-label="-">A−</button> <button data-s="1" aria-label="+">A+</button></span>
      </div></div>
      <article class="read"><h1>${esc(L(c.title))}</h1>${paras(L(c.text))}</article>
      <div class="pager">
        ${has(i-1)?`<a href="#/read/${b.id}/${i-1}">${t("prev")}</a>`:"<span></span>"}
        ${has(i+1)?`<a href="#/read/${b.id}/${i+1}">${t("next")}</a>`:"<span></span>"}
      </div>`;
  },
  about(){
    const ph = SITE.photo ? `<figure class="portrait" style="margin-top:2.5rem"><img src="${SITE.photo}" alt="${esc(L(SITE.name))}" onerror="this.closest('figure').remove()"></figure>` : "";
    return `<h2>${t("about")}</h2>${ph}${SITE.about[lang].map(p=>`<p>${esc(p)}</p>`).join("")}<div class="clear"></div>`;
  },
  contact(){ return `<h2>${t("contact")}</h2><p>${esc(L(SITE.contact.note))} <a href="mailto:${SITE.contact.email}">${SITE.contact.email}</a></p>`; },
  nf(){ return `<p>${t("notfound")}</p>`; }
};

function render(){
  const route = (location.hash.replace(/^#\/?/,"") || "").split("/");
  const [name,a,b] = route;
  const view = name === "" ? "home" : name;
  chrome(route);
  $("#app").innerHTML = (views[view] || views.nf)(a,b);
  document.documentElement.style.setProperty("--read-size", size+"rem");
  window.scrollTo(0,0);
}

document.addEventListener("click", e => {
  const l = e.target.closest("[data-l]");
  if(l){ lang = l.dataset.l; try{ localStorage.setItem("lang",lang) }catch(_){} render(); }
  const s = e.target.closest("[data-s]");
  if(s){ size = Math.min(1.8, Math.max(.9, size + .1*(+s.dataset.s)));
         document.documentElement.style.setProperty("--read-size", size+"rem"); }
});
window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
