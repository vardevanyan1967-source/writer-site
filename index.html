<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Գրողի էջ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Armenian:wght@400;600;800&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --parchment:#f3ead7;
  --paper:#fbf6ea;
  --ink:#2b2118;
  --muted:#6f5f4d;
  --red:#7a1f26;
  --line:#d9c9a6;
  --font:"Noto Serif Armenian","Noto Serif",Georgia,"Times New Roman",serif;
  --read-size:1.15rem;
}
:root[data-theme="light"]{--parchment:#ffffff;--paper:#ffffff;--ink:#1a1a1a;--muted:#666;--line:#e3e3e3;--red:#7a1f26}
:root[data-theme="dark"]{--parchment:#17130f;--paper:#211c16;--ink:#e6dac3;--muted:#a3927a;--line:#3a3227;--red:#e0959a}
body{transition:background .25s,color .25s}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--parchment);color:var(--ink);font-family:var(--font);line-height:1.75;
  padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
a{color:var(--red)}
a:focus-visible,button:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.wrap{max-width:46rem;margin:0 auto;padding:0 1.25rem}

/* Header */
header{border-bottom:1px solid var(--line);background:var(--paper)}
.bar{display:flex;flex-wrap:wrap;gap:.6rem 1.5rem;align-items:center;justify-content:space-between;padding-top:.9rem;padding-bottom:.9rem}
.brand{font-weight:800;font-size:1.15rem;color:var(--red);text-decoration:none}
nav{display:flex;gap:1.1rem;flex-wrap:wrap}
nav a{text-decoration:none;color:var(--ink)}
nav a:hover,nav a.on{color:var(--red);text-decoration:underline;text-underline-offset:.3em}
.lang button{background:none;border:1px solid var(--line);color:var(--muted);padding:.2rem .6rem;cursor:pointer;font:inherit;font-size:.85rem}
.lang button.on{background:#7a1f26;color:#fff;border-color:#7a1f26}

/* Home */
.hero{padding:4.5rem 0 3rem}
.hero h1{font-size:clamp(2.2rem,8vw,3.6rem);line-height:1.15;margin:0 0 .5rem;font-weight:800;color:var(--red)}
.hero p{font-size:1.2rem;color:var(--muted);max-width:34rem;margin:0}
h2{font-size:1.5rem;margin:2.5rem 0 1rem;color:var(--red)}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.5rem,1fr));gap:1.25rem;padding:0;list-style:none}
@media (min-width:30rem){.books{grid-template-columns:repeat(4,1fr);gap:1.5rem}}
.book a{display:block;text-decoration:none;color:var(--ink)}
.cover{position:relative;overflow:hidden;aspect-ratio:2/3;background:var(--parchment);color:#f3ead7;
  font-weight:600;line-height:1.3}
.cover>span{position:absolute;inset:0;display:flex;align-items:flex-end;padding:.8rem;z-index:1}
.book small{display:block;color:var(--muted);margin-top:.5rem}

.cover img{position:absolute;inset:-1px;width:calc(100% + 2px);height:calc(100% + 2px);object-fit:cover;display:block;z-index:0}
.portrait{float:right;width:11rem;max-width:40%;margin:0 0 1rem 1.5rem;border:1px solid var(--line);box-shadow:3px 4px 0 var(--line)}
.portrait img{display:block;width:100%;height:auto}
.clear{clear:both}

/* Book page */
.crumb{margin:2rem 0 0;font-size:.95rem}
.book-head{display:grid;gap:1.5rem;grid-template-columns:9rem 1fr;align-items:start;margin:1rem 0 2rem}
.book-head .cover{font-size:.95rem}
.book-head h1{margin:0 0 .5rem;font-size:2rem;line-height:1.25}
ol.toc{padding-left:1.4rem;margin:0 0 .5rem}
ol.toc li{padding:.35rem 0;border-bottom:1px dotted var(--line)}
h3.group-head{margin:1.5rem 0 .25rem;font-size:1rem;color:var(--muted);font-weight:600;letter-spacing:.02em}
.soon{color:var(--muted);font-style:italic}

/* Reader */
.tools{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--line);padding:.5rem 0;z-index:5}
.tools .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.4rem 1rem}
.tools .grp{display:inline-flex;align-items:center;gap:.3rem}
.tools button.on{background:#7a1f26;color:#fff;border-color:#7a1f26}
.tools button{background:none;border:1px solid var(--line);padding:.2rem .7rem;font:inherit;cursor:pointer;color:var(--ink)}
article.read{font-size:var(--read-size);line-height:1.9;padding:2rem 0 3rem}
article.read h1{font-size:1.9rem;line-height:1.3;margin:0 0 1.5rem}
article.read p{margin:0 0 1.1em;text-align:left}
article.read .verse{white-space:pre-line}
.pager{display:flex;justify-content:space-between;gap:1rem;border-top:1px solid var(--line);padding:1.25rem 0 3rem}

footer{border-top:1px solid var(--line);padding:1.5rem 0 2.5rem;color:var(--muted);font-size:.9rem;background:var(--paper)}
@media (max-width:30rem){.book-head{grid-template-columns:1fr}.book-head .cover{max-width:9rem}.hero{padding:2.5rem 0 1.5rem}nav{gap:.4rem 1rem}}
</style>
</head>

<main id="app" class="wrap"></main>

  about:{
    hy:["Վլադիմիր Ավետիսյանը ծնվել է 1934 թ. բարձրագեղ Ջավախքի Ախալքալաք քաղաքում։ Ավարտել է միջնակարգ դպրոցը և մեկնել Սովետական բանակ, այնուհետև ընդունվել է Սվերդլովսկի (Եկատերինբուրգ) Բարձրագույն զինվորական ուսումնարան և ծառայության անցել որպես սպա։ Զորացրվելուց հետո տեղափոխվել է Երևան, ավարտել է Երևանի պետական մանկավարժական ինստիտուտի պատմության ֆակուլտետը, այնուհետև՝ Երևանի պետական համալսարանի ժուրնալիստիկայի ֆակուլտետը։ Առաջին բանաստեղծությունը տպագրվել է 1963 թ. «Ավանգարդ» թերթում, հետագայում՝ «Գրական թերթ»-ում, «Գարուն» ամսագրում և այլ պարբերականներում։ Աշխատել է հեռուստատեսությունում որպես լրագրող, այնուհետև Հայաստանի Կենտկոմի հրատարակչությունում՝ «Երեկոյան Երևան» թերթի պատասխանատու քարտուղար, «Ծիածան» թերթի գլխավոր խմբագիր։ Հանդիսանում է Հայաստանի գրողների միության անդամ։ Վլադիմիր Ավետիսյանի առաջին՝ «Իսկ դու չեկար» ժողովածուն լույս է տեսել 1968 թ., երկրորդը՝ «Անձրևող կարոտ»-ը՝ 1974 թ., երրորդը՝ «Հեռացող լեռներ»-ը՝ 1986 թ.։ Բանաստեղծի ստեղծագործական ուղու վրա մեծ ազդեցություն է թողել՝ Երկրորդ համաշխարհային պատերազմում հոր զոհվելը։ Վլադիմիր Ավետիսյանի բանաստեղծությունների հիմնական բովանդակությունը քաղաքացիական պաթոսն է և անձնանվեր սերը դեպի Հայրենիք, պատերազմի անդառնալի կորուստներն ու ցավը, մարդու ամենօրյա պայքարն ու կյանքի մասին մտորումները՝ բնության, սիրո, մարդու առաքելության և մարդկայնության թեմաներով։ Այս ժողովածուն ամփոփում է հեղինակի ողջ ստեղծագործական ուղին՝ ներառելով երբևէ չհրատարակված բանաստեղծություններ։"],

  books:[{"id":"book-1","cover":"img/book-1.jpg","year":"1968","title":{"hy":"ԻՍԿ ԴՈՒ ՉԵԿԱՐ"},"desc":{"hy":"Վլադիմիր Ավետիսյանի առաջին ժողովածուն, հրատարակված 1968 թվականին։"},"chapters":[{"title":{"hy":"ԻՍԿ ԴՈՒ ՉԵԿԱՐ"},"group":null,"text":{"hy":"Նորից նամակ ռազմի դաշտից,\nՈրքան հույզե՜ր. տագնապ նորից.\nՆորի՜ց, նորի՜ց գրել ես դու՝\nԿգա՜մ, կգա՜մ՝\nՊատերազմը երբ վերջանա։\nՍպասեցինք մենք քեզ երկար,\nԻսկ դու՝ չեկար...\nԻնձ որբության վախն էր տանջում,\nԻսկ դու չեկար, չեկա՜ր, չեկա՜ր...\nԲայց քանի դեռ ապրում եմ ես\nԱյս աշխարհում\nՊիտի հուսամ.\nՀայր իմ, չէ որ ասիր կգամ։"}},{"title":{"hy":"ԱՐԵՎՆ ԻՋԵԼ ԷՐ ԼԵՌՆԵՐԻ ԳԼԽԻՆ"},"group":null,"text":{"hy":"Արևն իջել էր լեռների գլխին,\nՈրտեղ մասրենին ճերմակ վարդերի\nՀրդեհ էր վառել...\nԿապույտ լեռներում թաց վարդերն էին\nԵրերում, դողում։\nԱյդ անուշ պահին մի քնքուշ մեղու\nԹևը խրել էր վարդի փշերին,\nՄեռնում էր տխուր։\nԻսկ լուսաբացին վարդերի միջով\nՄրջյունները լուռ քարշ տվին մեղվին,\nՎերը՝ երկինքն էր թավշյա ստվերով,\nՆերքևը՝ լեռն էր,\nԱյնպես հանդարտ էր,\nԿարծես չէր եղել ոչինչ արտակարգ\nԼեռների գլխին։"}},{"title":{"hy":"ԵՐԿԻՐ ԻՄ"},"group":null,"text":{"hy":"Մենք որ ծնվեցինք,\nՄեր արյան գույնը քեզանից առանք.\nՔեզանից առանք գիտություն ու գիր,\nԵվ երկինք պահող հավատ անխորտակ։\nՔեզանով դարձանք Դավիթ ու Հունան,\nԱրձագանք դարձանք քեզանով միայն,\nՈչ թե լռություն...\nՄիայն մի սիրտ էր մեր մեջ թպրտում,\nՄիայն մի լեզու, միայն մի հավատ,\nՈւ մենք ծնվեցինք\nԹշնամության դեմ՝ պարզած կարծրություն,\nՍտորության դեմ՝ անկոր բարձրություն,\nԱնգթության դեմ՝ պարզած խղճմտանք։\nԵրբ ելան հողմեր աշխարհը ճոճվեց,\nՄենք չճոճվեցինք,\nԹեկուզ ուզեցին\nՄեզ զրկել, այրել,\nԲայց մենք կանգնեցինք...\nՄենք որ ծնվեցինք,\nԱշխարհը արդեն բողբոջի նման\nՃաքել էր, բացվել..."}},{"title":{"hy":"ԳԱՐՆԱՆԱՄՈՒՏ"},"group":null,"text":{"hy":"Գարնանամուտ է,\nԻմ հողը ամբողջ տագնապի մեջ է,\nՔրտինքի մեջ է ու սարսուռի...\nԻմ լեռնադաշտը\nՁյունիկի լաց է ու ծկլթոց է,\nԲողբոջի ճաք է\nՈւ կարկատան է հաղարջանման,\nԼոկ խճճվել է մի բուռ արևս,\nԵվ հողաբույր է՝ բույլ-բույլ տոնում։\nԻմ արյան եռքս արևանում է,\nՈւ վարար-վարար գարնանանում..."}},{"title":{"hy":"ԻՄ ՄԵՋ ՇԻԿԱՑԱԾ"},"group":null,"text":{"hy":"Իմ մեջ շիկացած արևի ձայն կա,\nԲողբոջի ճիգ կա իմ մեջ խևացած,\nԻմ մեջ նորացած Հայաստանը կա,\nԵվ ամրությունը նրա լեռների։\nԻմ մեջ որբության կարկատանը կա,\nՄերժված սիրողի սրտի հոգոցը,\nՄայթերի տաքը և տառապանքը,\nԵվ մեր Տերյանի երգի հմայքը,\nԻմ մեջ մեղրածոր և՛ քաղցրություն կա,\nԵ՛վ դառնություն կա, երբ դառնացնում են,\nԵրբ զայրացնում են իմ մեջ պոռթկում կա,\nԱրևի լաց կա իմ մեջ հեղեղված...\nԵվ այդ բոլորին իրար կապողը\nԵրկի՛ր, հավատն է քեզնից ժառանգած։"}},{"title":{"hy":"ԼՈՒՅՍԸ ՄԱՐԵԼ Է"},"group":null,"text":{"hy":"ԼՈՒՅՍԸ ՄԱՐԵԼ Է...\nԱրդեն գիշեր է,\nԱրդեն գիշեր է,\nԲայց ինչ-որ մի տեղ\nԼույսը մարել է.\nՄեկին փրկել է,\nՄեկին զրկել է...\n\nԼույսը մարել է,\nԵվ տաքուկ սիրով\nԵրկու լույս ձեռքեր\nԻրար գտել են...\nԵվ խելագարվել...\n\nԻսկ հեռվում անհույս,\nՄեկը ընկել է.\nԺայռին քարակոփ...\nԵվ հառաչել է,\nԵրբ լո՜ւյսը, լո՜ւյսը,\nԼո՜ւյսը մարել է։"}},{"title":{"hy":"ԳԵՏՆԱՔԱՐՇ ՉԵՄ ԵՂԵԼ"},"group":null,"text":{"hy":"Գետնաքարշ չեմ եղել հողմի թափից,\nԵվ նեղ չի թվացել նեղլիկ ճամփան,\nԹե մի քիչ վառվել եմ, դա նրանից է,\nՈր ուժեղ եմ եղել հողմի թափից:\nԱրձան չեմ եղել առնական դեմքով,\nՓոխվել եմ ես միշտ, այրվել ներսից,\nԹե բռնկվել եմ, դա նրանից է,\nՈչ կուչ չեմ եկել մրրիկի ճայթից,\nՍնդիկի նման չեմ եղել երբեք,\nՊաշտել եմ լեռս, ծովակս կապույտ,\nԹե լուռ եմ եղել, դա նրանից է,\nՈր զուսպ եմ սիրել երկիրն հայրենի։"}},{"title":{"hy":"ԱՅՍ ԿՆՃՌՈՏՎԱԾ"},"group":null,"text":{"hy":"Այս կնճռոտված խաչուղու վրա,\nԻնչո՞ւ խշրտաց հասուն տանջանքս.\nԻնչո՞ւ հիշեցի\nՄատներիդ շփոթը մազերիս մեջ,\nՇուրթերիդ խաղը,\nԱչքերիդ խունկը,\nԻնչո՞ւ բաբախեց սիրտս մենավոր,\nԵվ առաջնորդս դարձավ ստվերս,\nՈր պաղ ցուրտ սփռեց,\nԵվ մի աղավնի կարմիր ոտքերով\nՑուրտը քրքրեց\nԽաչուղու վրա։\nՉէ որ այդ պահին,\nԱշխարհը, ինչպես լուսե Մաշտոցը,\nՊայծառ էր, Այր էր։"}},{"title":{"hy":"ՈՒՐԻՇՆԵՐԻ ՊԵՍ"},"group":null,"text":{"hy":"Ուրիշների պես ինձ նեղ չթվաց\nԱյս բարակ ճամփան,\nԱյս բլուրները՝ լեռներ թվացին,\nԵվ այս լճերը՝ ծովեր անհագուրդ։\nՈւրիշների պես մրուր չթվաց\nԾխացող մութը,\nԵս մթի միջից հանեցի շողեր,\nՇաղեցի անհոգ դեմքերի վրա,\nԵս թափ տվեցի հայացքներ լցված\nԾխի փնջերով և ... ամբողջացա։\nԵս իմ ողջ կյանքում չեմ փնտրել հենակ,\nՈչ էլ փափկություն,\nՓափկությունն, ինչպես դեղնափառ դրամն,\nԻմ անկոր հոգուս զզվանք է բերել...\nՈւրիշների պես ինձ նեղ չթվաց\nՀողագունդը այս,\nՀիմա հևում է իմ մեջ մի աշխարհ,\nՄի ծնունդ,\nՄի հոգս...\nԵվ մի Հայաստան։"}},{"title":{"hy":"ՀՈՂՍ ԼԵԳԵՆԴ Է"},"group":null,"text":{"hy":"ՀՈՂՍ ԼԵԳԵՆԴ Է...\nՀողս լեգենդ է...\nԼեռների ծուխը այստեղ կապույտ է,\nՃերմակ թելեր են խենթ ջրվեժները.\nԱբուլի գլխից ելնող արևը՝\nՊտուղի ձայն է այստեղ փաթաթում.\nԱյստեղ ամեն ժայռ վանքի պատառ է,\nԽոսող երազ է այստեղ ամեն ձոր։\nԱյստեղ ամեն հևք երգ արարող է\nԵվ չունի մահի ոչ մի դող։\nԱյստեղ աշխարհը քարե հեղեղ է,\nԿարմիր աղոթք են և քարափները,\nՄամուռից ծորող ամեն մի կաթիլ,\nԴարի արցունքն է..."}},{"title":{"hy":"Ա-ին"},"group":null,"text":{"hy":"Ծնվել էի ես քեզ համար,\nՔո ուռճացած թուլությունը\nԼոկ կռելու,\nԵվ լավը միշտ նվաճելու։\nՈր վեհացնող կուռք դառնայի\nԵրազներիդ մագաղաթին։\nՀիմա չկաս,\nՈւ ես չկամ։"}},{"title":{"hy":"ԳԱՐՆԱՆ ԳԻՇԵՐԸ"},"group":null,"text":{"hy":"Իմ հոգնած գլուխը ափերիս մեջ,\nԵս անցնում եմ լույսի ու մութի\nՍտվերների միջով,\nԵվ ձյան լացը բաց ծորակի նման\nՀեկեկում է՝\nԸնդմիշտ սեղմված մայթերի վրա։\nԵս անցնում եմ,\nՈւ կանաչ ծիծաղը մի աղջկա,\nՍնդիկի նման բարձրանում է,\nՃկվելով լռության կողերի մեջ՝\nԱկոսում է իմ թմրությունը։\nԵվ ափերիս մեջ հոգնած գլուխս\nԲարձրանում է,\nԵվ խոնարհվում է ուխտյալի սիրով\nՍեղմված\nԱրևի ու լույսի մեջ։"}},{"title":{"hy":"ԻՄ ՋԱՎԱԽՔԻ ՏՂԱՆԵՐ"},"group":null,"text":{"hy":"Ախ, փոխվել եք, դուք փոխվել,\nԻմ Ջավախքի տղաներ,\nԲարձրահասակ ու հպարտ, իմ Ջավախքի տղաներ,\nԴուք կարծել եք՝ Աբուլից այն կողմ աշխարհ\nԷլ չկա,\nՈւ լճակից Փարվանա՝ ուրիշ լճակ էլ չկա։\nՀիմա փոխվել, լեռնացել, միանգամից եք փոխվել,\nԱկոսել եք դուք լեռներ, անցել մի բարդ ճանապարհ,\nՄառախուղներ եք հնձել, մութը՝ լույսով եք\nՎառել.\nՁեր լուսաշող ճակատին, ձեր այտերին կենսաշող՝\nՈրպես հավետ վկաներ, սպիներ են մնացել։\nԵ՛վ ներող եք դուք եղել, և՛ տաքարյուն, և՛ բարի,\nԱրևային եք եղել, արևածին տղաներ,\nԼեռներիս պես մշտասեգ, ջրերիս պես մաքրաջինջ,\nԱ՜խ, ուրիշ եք դուք եղել...\nԵրանի չէր իմ հայրն էլ պատերազմից\nՏուն դառնար,\nԻնձ էլ տեսներ, ա՜խ, փոխված, ձեզ պես կտրիճ,\nՄի տղա,\nԻմ Ջավախքի տղաներ։"}},{"title":{"hy":"ԱՄԵՆ ՎԵՐՔԻ"},"group":null,"text":{"hy":"Ամեն վերքի,\nԱմեն վերքի,\nՄեղավորը՝\nՊատերազմն էր, պատերազմը...\nՄեկին բերեց անամոք վիշտ,\nՄեկին՝ սարսուռ,\nԻսկ խեղճ մորս, ջահե՜լ, ջահե՜լ,\nՄեջքը թեքեց պատերազմը...\nԽաղաղվել է ողջ աշխարհը,\nԱվերակներն են շենացել,\nԴարձյալ հայրս չկա, չկա...\nԲայց մենք էլի սպասում ենք\nՎաղվա անզուսպ ծով գալիքին,\nԱխ, եթե դուք իմանայիք,\nԻմ մեջ որքան արևածոր\nՀորս քաղցր արյունը կա..."}},{"title":{"hy":"ՀԱՅԱՍՏԱՆ ԱՇԽԱՐՀ"},"group":null,"text":{"hy":"Ես դեռ չեմ տեսել քարերիդ նման\nՍրբացած քարեր,\nՄարմարիդ նման մարմարե լույսեր,\nԼռությանդ պես մի թաց լռություն,\nՍարսուռիդ նման մի տամուկ սարսուռ,\nՈւ չեմ էլ տեսնի իմ ամբողջ կյանքում։\nԵվ այնտեղ՝ լեռան տաք ողնաշարում,\nԱյնտեղ են պեղել թմբերին հանգչող\nՊաշտված քարեր\nԵվ դարերի հետ հաշտված քարեր,\nՈր երակներում գոլ տվայտանքներ\nՈւ արձագանքներ ունեն պահած..."}},{"title":{"hy":"ԱՐԻ, ՍԻՐԵԼԻՍ"},"group":null,"text":{"hy":"               Հայկանուշին\n\n\nԱրի, սիրելիս,\nԱրևի ներկից մի քիչ ներկոտվենք,\nԾաղկի նեկտարից փոշոտվենք մի քիչ,\nՀողմերի դիմաց մենք անթեք կանգնենք,\nԵվ չմեղանչենք աշխարհում երբեք։\nԴառնանալու հետ մի քիչ քաղցրանանք,\nԸնկճվելու հետ մի քիչ վեհանանք,\nՈւ բժշկի պես կարեկից լինենք.\nԿարկատանի պես չերևանք կյանքում,\nԱնձնադատ լինենք ու մաղձ չծծենք...\nԱրի, սիրելիս,\nԽոր ձորերի պես մի քիչ խորանանք,\nՆոր նայենք մարդուն.\nԱրդյո՞ք կարող ենք մենք էլ աշխարհում\nԱրժանի լինել մարդու անունին..."}},{"title":{"hy":"ՄԵՆՔ ԻՆՉ-ՈՐ ԲԱՆՈՎ"},"group":null,"text":{"hy":"Մենք ինչ-որ բանով պարտք ենք աշխարհին,\nԵվ ինչ-որ բանից մենք զրկվել ենք,\nՄենք ինչ-որ բանով կապված ենք դարին,\nԵվ ինչ-որ բանից մեզ սրտնեղել են։\nՈրոգայթվել ենք մենք ինչ-որ բանից,\nԲայց ինչ-որ բանով ճառագայթել ենք,\nՄեր արյան խունկը մարմնացել է,\nՈրպես առասպել ու որպես Մասիս։\nՄեր էության մեջ հավատն ու սերը,\nԱրևագալի տենդով են ծխում.\nՄեր տաք արյունի բաբախումները\nՉեն կարող փոխվել,\nԻնչպես չի փոխվում լիցքը կայծակի...\nԴեռ նեոլիթից\nՃանաչում են մեզ...\nՈր սիրել գիտենք,\nԵվ գիտենք կանգնել,\nՈւ բոց արյունով հողմերը մարել։\nՀիմա ծնկաչոք\nԵս համբուրում եմ քարերդ խոսող,\nԵվ հավերժացնում\nՍրբալույս մի տեղ՝\nՀայաստան Աշխարհ։"}},{"title":{"hy":"ԱՆՁՐԵՎԻ ՊՍՊՂՈՒՆ"},"group":null,"text":{"hy":"Անձրևի պսպղուն սյուների տակ\nԳնում եմ անկոր,\nԵվ գոլ ոտքերով\nՀրում եմ այս ծեր հողագունդը ետ,\nՈր գնամ առաջ,\nԵվ ցեխի ճեղքը իմ ոտքերի տակ\nՆման է տամուկ մի տառապանքի։\nՈւ ես խևացած,\nԱռևանգելով բոլոր ուժերին,\nԳնում եմ անդող՝\nՔաղցկեղով հիվանդ առասպելների\nՃիգը այրելու,\nԵվ մթնում կորած լույս էպոսների\nՃիչը փնտրելու...\nԳնում եմ անկոր..."}},{"title":{"hy":"ԱՅՍ Ի՞ՆՉ ՀՐԱՇՔ Է"},"group":null,"text":{"hy":"Այս ի՞նչ հրաշք է.\nՏաք երակիս մեջ մի դող է պայթել,\nՈւ մերթ ելնում է կծկվում սրտիս\nՔաղցկեղի նման\nՈւ մնում ներսում։\n\nԱյս ի՞նչ ամպրոպ է,\nՈր կապը կտրած ցուլերի նման,\nԵս գժտվում եմ,\nՈւ մի պահ հետո կարծես դառնում եմ\nԾխի պես շվար...\n\nԵվ ի՞նչ կրակ է,\nՈրի այրոցքից\nՀորձանք առ հորձանք,\nԼցվում եմ հաճախ ու մղկտում եմ՝\nԱնագե սառը փայլփլումներով։\n\nԵվ, հավանորեն, նոր սեր է ծնվում..."}},{"title":{"hy":"ՊԱՏԱՀՈՒՄ Է"},"group":null,"text":{"hy":"Պատահում է, որ սիրտդ ցավում է\nՈւ չես կարենում\nԼացել,\nՀառաչել,\nՈւզում ես բացել սիրտդ դու մեկին,\nՈրի հետ անշուք օրեր ես մաշել։\nԵրբ ցավդ ես պատմում...\nԶգում ես արդեն՝ նրա հոգու մեջ\nԱղքատությունն է լոկ աճապարում.\nԵվ մտածում ես.\nԻնչո՞ւ է ապրում,\nԵվ ինչո՞վ է նա արդյոք բախտավոր։"}},{"title":{"hy":"ՀՈՂ ԻՄ"},"group":null,"text":{"hy":"Այս նեղ պահին,\nԱյս չար պահին\nՊղնձվել ենք արևն ու ես,\nՊղնձվել ենք։\nՈւ ձուլվել ենք պղնձի պես,\nՊղնձացել։\nՈւ ես կյանքում քեզ չեմ պղծել\nԱրհավիրքի պահին անգամ,\nՊղնձացել,\nԸնկել եմ ես, կանգնել վառման...\nԿոչվել նույնիսկ առաջատար,\nՀո՛ղ իմ, որ քեզ սերս ցույց տամ,\nՊղնձավառ։"}},{"title":{"hy":"ՁԵՌՔԵՐՍ ՆԵՂՎՈՒՄ ԵՆ"},"group":null,"text":{"hy":"Ձեռքերս նեղվում են մթության մեջ,\nՈւ մթի քողից՝ ձյունի պես սառը,\nՊաղել են հողը ու Երևանը։\nԴեմքերի վրա խտացող մութը,\nՈր բարձր է կանգնած հսկա շենքերից\nԼուռ տրոփում են լույսի զանգերը։\nՄութը չի զգում\nԱշխարհի հոգսը,\nՈղբերգությունը,\nՄիայն քամում է իմ ձեռքերի մեջ\nՍև ադամանդներ։\nԲայց հոգիս տաք է։\nՀալոցք են դառնում իմ կոշտ ձեռքերս,\nՈտնաձայներս\nԶնգում են, թնդում,\nՈւ վառոդի պես վառվում է մութը։\nԵվ հսկա շենքերը քնաթաթախ,\nԼույսի ծանրությունից ճոճվում են ձիգ,\nԻսկ առավոտյան\nՄթի հոտ էր փչում իմ ձեռքերից։"}},{"title":{"hy":"ԱՐԵՎ ԻՄ"},"group":null,"text":{"hy":"Արև՛ իմ, մա՛յր իմ,\nԲնակվիր իմ մեջ,\nԿուց-կուց արյունդ\nՏուր ինձ, թող շիկնեմ,\nԴառնամ թրթիռդ,\nՊատվաստվեմ քո մեջ,\nՔո մեջ մոլորվեմ,\nՈրպես բոց հրայրք\nՃառագեմ ընդմիշտ..."}},{"title":{"hy":"ԻՄ ՇՆՉԱԾ ԿՅԱՆՔԸ"},"group":null,"text":{"hy":"Իմ շնչած կյանքը\nԵրակի պես տաք էր,\nԲայց չար էր բախտը իմ դեմ։\nԻմ խիտ օրերը\nԱպրելու կամք էր,\nԲայց ծանր էր հեգնանքն իմ դեմ։\nԻմ հուշերը գոլ ձայնասփյուռ էին,\nՍիրելը մեղք էր ու ցավ։\nԻմ պաշտած հողը արևագալ էր,\nԾաղիկը մերկ էր ու լավ։\n\nԹե մերկ ու ցավ էր,\nԵվ լավ էր կյանքը,\nՆշանակում էր՝\nԵվ տառապանքն էր երջանկությունը։"}},{"title":{"hy":"ԱՐԵՎԻ ՀԵՏ ՊՏՏՎՈՂ"},"group":null,"text":{"hy":"Արևի հետ պտտվող\nԱրևածաղիկը,\nՉեչոտ ժայռերի գորշ ողնաշարում\nԻնչպես է աճել՝ ոչ ոք չգիտի,\nՈւ կարմիր,\nԴեղին խունկեր է վառում\nՏամուկ դաշտերին,\nԵվ մի դառնությամբ ծծում է զորեղ\nՔարափում մեռնող վիշտը արծվի,\nՁորաբերանի խրճիթից ելնող\nՏառապած ճիչն է բոլոր գույներով\nԳալիս փխրանում ծաղկապնակում։\nՈւ տաք կեսօրին դեղին վարսերը\nԲոցավառվում են իմ կրծքի վրա։\nՔամին ելնում է զով իրիկնային,\nՈսկյա վարսերը լուռ կուլ են գնում,\nՕրվա սպրդած կերպարանքի մեջ\nՄեռնում է օրը..."}},{"title":{"hy":"ԲԱԼԻԿԻՍ՝ ՄԱՐԻՆԱՅԻՆ"},"group":null,"text":{"hy":"Հույսս մարել էր,\nԵվ չունեի հուշ...\nԲայց հիմա այսօր,\nԵրբ աշխարհ եկար,\nՀարություն առած իմ թուխ պատկերով,\nԻմ մեջ շառափեց\nԱրյունս ահեղ.\nԵվ ունեցա կյանք,\nԵվ ունեցա սեր՝\nԱրևայինը քո հավերժության։\nԵս խոսեցի քո աստվածային լեզվով,\nԵվ ունեցա երգ,\nՄի անմարելի ճոխ հպարտություն,\nՈր վաղուց արդեն մամռել էր իմ մեջ։\nԻսկ հիմա այսօր,\nՎառեցիր իմ մեջ կրակների շքերթ,\nԵվ դարձար հավատ..."}},{"title":{"hy":"ԻՄ ՀԱՎԱՏԻ ՊԵՍ ՄԱՔՈՒՐ"},"group":null,"text":{"hy":"Իմ հավատի պես մաքուր,\nԿգա շուտով ժամանակ,\nԱյս նույն ամպի լույսի տակ,\nՓողոցների ժխորում,\nԷլ զինվորներ չեն քայլի...\nԵվ տոնին վառ մայիսի,\nԶորահանդես չի լինի։\nԵվ դաշտերում ծաղկալույս\nՍահմանասյուն չի լինի.\nԿանցնեմ թեթև հովի պես՝\nԴարի շունչը շուրթերիս,\nԵվ ծաղիկներ ձեռքերիս...\nԿանցնեմ ազատ աշխարհով,\nԵս հիացած ու հարբած,\nԾաղիկները աշխարհի\nԵս կբերեմ Արարատ,\nՈւ Մասիսի գագաթին,\nՈրպես հավետ հիշատակ,\nՀրթիռների փոխարեն,\nԾաղիկները աշխարհի\nԿկանգնեցնեմ մոնումենտ..."}},{"title":{"hy":"ԳՅՈՒՂԻ ՃԱՄՓԻՆ"},"group":null,"text":{"hy":"Գյուղի ճամփին կա մի ծառ,\nԼալկան ուռի վարսաթափ,\nՄի ջրաղաց, մի կեռ քար,\nԿողքին՝ արտեր ոսկեծուփ։\nՄի արահետ, նեղ կածան,\nԲարակ առու սարն ի վար,\nՄի նեղ կամուրջ ծիածան\nՈւ մի ավեր սուրբ տաճար։\nՄի մով լճակ Փարվանա,\nԱմպերի տակ խշշացող,\nՄի ծով գարուն քաղցրահամ,\nԱնգամ քարին կյանք տվող։\nԹուխ արևի շող տանող,\nԴո՛ւ Գանձայի ցորեն հասկ,\nԴո՛ւ Տերյանի՝ բրոնզաքող\nԵրգի ակունք անուշակ։\nԴո՛ւ ծովացած ոսկե դաշտ,\nԵրգի սիրտը Վահանի,\nՇշուկ, շրշյուն համր ու հաշտ,\nՔնքուշ սերը Տերյանի։\nԴո՛ւ Ջավախքի շող հավատ,\nԵռուն արև անհատակ.\nԴո՛ւ Տերյանի շողարձակ\nՇռայլ աշխարհ, լո՛ւյս Ջավախք։"}},{"title":{"hy":"ԱՇԽԱՐՀՈՒՄ ՀԻՄԱ"},"group":null,"text":{"hy":"Ինչ-որ մի տեղ\nԿյանքը դատարկ է,\nԳորշ տակառների զնգոցի նման։\nԻնչ-որ մի տեղ\nԵղեգը սև է,\nԿայծակը մոտ է երկրին պայթում։\nԻնչ-որ մի տեղ ցավը կատակ է,\nԻնչ-որ մի տեղ\nԱրևը՝ սուրճ է\nՍև աչքերի պես խոնավով շաղված։\nԻնչ-որ մի տեղ կյանքը հավատք է,\nԱշխարհը մուրճ է ու մանգաղ։\nԵվ այդ բոլորը, դարձած առանցք,\nԽուլ պտտվում են երկրի շուրջը..."}},{"title":{"hy":"ՁՅՈՒՆԵՐԸ"},"group":null,"text":{"hy":"Ձյուները,\nՄենության հետ պառկած,\nՍարսուռներ են այրում,\nԹանձրացնում\nԻրենց սառցե ակվարիումի մեջ,\nՈրտեղ ես տեսա իմ պատկերը\nԹափառող...\nԵվ ձյուների հոգնած ցոլանքը\nԻմ պատկերի վրա,\nՆման էր հարբած մի ուխտավորի։\nԵվ մի բուռ արևի կրակից\nԼպրծուն են դառնում ձյուները,\nԵվ տանիքների բրոնզե շուրթերից\nՊոկվում են թրթռուն կաթիլներ,\nԸնկնում վայրկյանի պտույտներում,\nՔրքջում...\nՁյուները խշրտում են,\nԵվ սառած շուրթերով երգում են.\nԳարնանամո՜ւտ է... գարնանամո՜ւտ է։"}},{"title":{"hy":"ԻՄ ԼՈՒՍԱՄՈՒՏԻՆ"},"group":null,"text":{"hy":"Իմ լուսամուտիս նայող ամպերը,\nԱգռավաթուխ ելնում են վեր,\nԱրձագանքում սև բոցերով\nԵվ բոցերով հղիանում,\nՈւ բոցերից\nՊոկվում են թաց կաթիլները,\nԵվ փշրվում անմեղությամբ՝\nՀրից շիկնած մամուռներին,\nԼուսամուտիս աչքերի մեջ,\nԵվ ուշացած կռունկներիս\nԿեռ թևերին...\nԻսկ հրաթուխ ծաղիկները\nԿապույտ դաշտում\nՀևասպառ թոշնում էին։"}},{"title":{"hy":"ՋԱՎԱԽՔ"},"group":null,"text":{"hy":"Իմ Ջավախքի երկինքը լուրթ\nԱսես բյուրեղ լինի,\nՄարդիկ այնպես պարզ ու մաքուր,\nՄարդիկ այնպես խորհրդավոր,\nԻնչպես մեր մեծ սարը Աբուլ,\nԵվ լճերը կապույտ ու բիլ՝\nԽաղաղության թանգարաններ։\nԳետերն այնպես փրփրաբաշ,\nՁորերն այնպես խոր ու խնդուն,\nԻսկ Աբուլը եռակատար՝\nԽորհրդանիշ շնչառության։\nԵրբ հիշում եմ...վեր եմ կենում\nԳնում Ջավախք։"}},{"title":{"hy":"ԵՍ ՈՒԶՈՒՄ ԵՄ"},"group":null,"text":{"hy":"Ես ուզում եմ՝ լքված հույսերդ,\nՄի բուռ ցողի պես,\nՔրքրվի, մաշվի,\nԵվ քո աղմկոտ մարած գգվանքը,\nՀավատքիս պես հարսնանա,\nԲացվի։\nԱ՛ռ ինձ քո կրծքին,\nԵվ դու կլսես արձագանքները\nԱրցունք-անձրևիս,\nԵվ գուցե դողաս,\nԳուցե ծիծաղես,\nԱճող լույսի պես\nԵրբ ճառագայթեմ..."}},{"title":{"hy":"ԹԵ ԾԱՌԵՐԻ ՊԵՍ"},"group":null,"text":{"hy":"Թե ծառերի պես մի տեղում կանգնեմ,\nԿխելագարվեմ...\nՈւ կսևանա արյունս կարմիր,\nԹե երկար կանգնեմ։\nԲայց եթե մի օր, այս ծառի համար,\nԵս կանգնած մեռնեմ,\nԱրյունս նորից կջահելանա..."}},{"title":{"hy":"ՔԵՐՈԲ ՄԵԼԻՔՅԱՆԻՆ"},"group":null,"text":{"hy":"Կաթիլ-կաթիլ\nԿյանքս վառվեց.\nՓաթիլ-փաթիլ\nԵս հալվեցի,\nՈւլունք-ուլունք\nԵս գոյացա,\nՓայլփլեցի ու գետ դարձա՝\nՈրոտացի...\nԳալարվեցի,\nՍակայն ձայնս\nՉլսեցին\nՔարերն անգամ\nԲարձրունքների..."}},{"title":{"hy":"ԳԱՐՈՒՆ ԲԱՑՎԵՑ"},"group":null,"text":{"hy":"Գարունն այնքա՜ն լավ է բացվում...\nՇեկլիկ վարսերն արեգակի\nՓռվեց լեռան սառած մեջքին,\nՈւ թպրտաց ձոր ու քարափ։\nՁյունը հալվեց հեծկլտոցով,\nԳլուլ-գլուլ,\nՀետո քիչ-քիչ,\nԽենթ ու խելառ\nԻջավ քնած դաշտի վրա։\nԳարուն բացվեց:\nԵվ հոխորտաց չեչոտ ճամփան,\nԿարկատաններ  անթել կյանքով ինչպե՜ս եմ փլվում,\nՈւ պտղավորվում,\nՊաղ մոխիրների դեղնության վրա,\nԱյնժամ դու ինքդ\nԿհեկեկայիր,\nԹուխ թևերիս մեջ։"}},{"title":{"hy":"ԱՐԵՎԸ ՉԵԼԱՎ"},"group":{"hy":"351"},"text":{"hy":"Արևը չելավ,\nԳոնե չորանար այս չեչոտ ճամփան,\nԳոնե բարձրանար կանաչը խելառ,\nԱռաջվա նման դուրս գայիր գոնե\nԾիծեռնակաբերդ,\nՈւ ծիծաղեինք խոր գորովանքով։\nԻմ էությունը քո մեջ լինելու\nԴողն է անրջում,\nԵվ քանդակում եմ քո թուխ պատկերը\nԻմ մտքերի մեջ։\nԱրևը չելավ,\nԳոնե դուրս գայի՜ր այս անշուք ճամփան,\nԳուցե տեսնեյի՜նք իրարու նորից,\nԵվ մոռանայի՜նք մեղքերը մեր հին,\nԳուցե մեր սերը փոթորկվեր նորից։"}},{"title":{"hy":"ՄԱՅՐ ԻՄ"},"group":{"hy":"351"},"text":{"hy":"Տո՛ւր ինձ մատներդ, մաշված մատներդ,\nՍրտիս բաբախով նորից տաքացնեմ,\nՀոգնած մատներդ հալվել, թոշնել են,\nԹող ես համբուրեմ բարակ մատներդ։\nԱխր ուրիշ մոր մատներն այդպես չեն,\nԱյդքան կարծրացած, այդքան այրված,\nԱխր ուրիշ մոր, սուրբ մատների մեջ,\nԱյդքան ճառագայթ, այդքան հուր չկա,\nԱյդքան հոգսերի ծանրություն չկա,\nԱյդքան հեղեղված տառապանք չկա.\nՏո՛ւր ինձ մատներդ, ծխոտ մատներդ,\nԱնչար մատներդ ինձ օրորել են,\nԻնձ վեր են տարել՝\nԿարկատաններիս թելերն այրելով...\nՏո՛ւր ինձ մատներդ, անքուն մատներդ,\nԹող ես համբուրեմ, նշխար մատներդ։"}},{"title":{"hy":"ԹԱՓԱՐՎԱՆԻ ԽՈՐ ՁՈՐԵՐՈՎ"},"group":{"hy":"351"},"text":{"hy":"Թափարվանի խոր ձորերում\nՎանքն է խորհում,\nՎանքը մեր հին, վանքը տխուր,\nՈւ վանքի մեջ տատս ծնկում,\nՀամբուրում էր քարերը լուռ։\n\nՈւ ծորում էր վիշտը տատիս,\nՔար վանքի մեջ մութ ու ամա,\nԵվ ասում էր – կգա որդիս,\nՊատերազմն էլ կվերջանա։\n\nՉէր իմանում տատն իմ բարի,\nՈր չկա հայրս աշխարհում.\nԲայց հավատով իր անխորտակ,\nՈրդու ճամփան էր միշտ պահում։\n\nՀիմա տատս էլ հորս նման,\nՔնել է խոր, թաց հողի տակ.\nԲայց սրտիս մեջ տատիս անմար,\nՍուրբ հավատն է դեռ մնում տաք։\n\nԻսկ ես այնպես հավատում եմ,\nՍուրբ ու արդար այն հավատին,\nԻնչպես ծանր մութից հետո\nԲացվող ոսկե առավոտին։"}},{"title":{"hy":"ԾԱԾԿԵԼ ԷՐ ԱՄՊԸ"},"group":{"hy":"351"},"text":{"hy":"Ծածկել էր ամպը սպիտակ\nԿուրծքը Աբուլի.\nԾածկել էր ձոր ու քարափ\nՆման փրփուրի։\nԻսկ այդ պահին վիրավոր,\nՑավով ահագին,\nԸնկել, տանջվում էր մոլոր,\nՄի մայր արագիլ։\nՏխուր երգում էր այնպես,\nԱրագիլը խեղճ,\n-Ա՜խ, ո՞ւմ չար ձեռքն էր այդպես\nԾակել սիրտը մեծ։\nԱնձրևն իջնում էր ամպից,\nԵվ կուրծքը թրջում.\nՔեզ հանձնեցի ես հողին,\nԻմ տխուր թռչուն.\nՀիմա երբ լուռ եմ անցնում\nՔո թմբի մոտով,\nՔարերն իմ փեշն են բռնում\nՔարեղեն դողով։\n\n\n\n\n\nԱՆՁՐԵՎՈՂ ԿԱՐՈՏ"}}]},{"id":"book-2","cover":"img/book-2.jpg","year":"1974","title":{"hy":"ԱՆՁՐԵՎՈՂ ԿԱՐՈՏ"},"desc":{"hy":"Հեղինակի երկրորդ ժողովածուն, հրատարակված 1974 թվականին։"},"chapters":[{"title":{"hy":"ՄԵՆՔ ԵԿԱՆՔ"},"group":{"hy":"ԼՈՒՍԱՎՈՐ ԵՐԱԶ"},"text":{"hy":"                         ԼՈՒՍԱՎՈՐ ԵՐԱԶ\n\nՄԵՆՔ ԵԿԱՆՔ\nՄենք եկանք. սկսվեց առասպելը դարի,\nՄենք եկանք հասարակ, հավատքով պապերիս,\nԼեռները պահեցին սաստկությունն հողմերի,\nՁորերը բարձրացան՝ խմեցին արևներ։\n\nՄենք եկանք, որ երգի հողը մեր սրբազան,\nՉլինեն արցունքներ և աղետ, և սարսափ.\nՄենք եկանք զայրույթով, փողերով եղեգան,\nՎառեցինք գիշերներ ձեռքերով այրական։\n\nՄենք եկանք, ուսեցինք ծանր բեռն աշխարհի,\nԵվ տարանք տառապանք, հառաչանք\nու ցրտեր.\nՄենք եկանք. սկսվեց առասպելը դարի,\nՁորերը բարձրացան՝ խմեցին արևներ..."}},{"title":{"hy":"ՀԱՅԱՍՏԱՆ ԱՇԽԱՐՀ"},"group":{"hy":"ԼՈՒՍԱՎՈՐ ԵՐԱԶ"},"text":{"hy":"Աշխարհում եթե այսքան զորավոր\nՈւ զարմանալի դու չլինեիր,\nՈ՞ւմ հետ խոսեի ու բարբառեի,\nԱյսպես պարզ ու ճիշտ։\nԴեռ չտաքացած ես կմրսեի,\nԴեռ չզուլալված կպղտորվեի,\nԿփշրվեի անհույզ երգի պես...\nԹե չլինեիր ջերմ ու հմայուն,\nՄանուկ գարունը չէր սքանչանա...\nՔարանձավային լռության նման\nՀամրություն կիջներ իմ շրթունքներին,\nԹե չլինեի՜ր...թե չլինեի՜ր։"}},{"title":{"hy":"ՀԱՅԱՍՏԱՆ"},"group":{"hy":"ԼՈՒՍԱՎՈՐ ԵՐԱԶ"},"text":{"hy":"Ես քոնն եմ, ինչպես իմ խուփ աչքերը,\nԻմն են անկորուստ ու անդավաճան.\nԵս քոնն եմ, ինչպես հազար դաշտ ու լեռ,\nԻմն են արմատով ու ծիածանով։\n\nՔեզնից հեռանալ չեմ կարողանում,\nԻնչպես չեմ կարող ինձնից հեռանալ,\nԵթե հեռանամ, հույսն իմ կմարի,\nՈւ կխլանամ... ու կխլանամ։\n\nԵս քոնն եմ, քոնը, քո Սասնա Ծուռը,\nՔո ձայնը, քայլքը քո, վարքը ազնիվ,\nՔո չկողոպտված ծիծառի լացը,\nՔո Մուսա լեռը, Սարդարապատը...\n\nԴու նա ես, որից չմրոտվեցի,\nԴարձա բառ ու գույն ու շտկվեցի...\nԵվ Փարվանայի թիթեռների պես\nՔեզնից հեռանալ չկարողացա։"}},{"title":{"hy":"ՍՈՎՈՐԵՑՐՈՒ ԻՆՁ"},"group":{"hy":"ԼՈՒՍԱՎՈՐ ԵՐԱԶ"},"text":{"hy":"Ես սկիզբ առա քեզնից, Հայաստան,\nՍովորեցրո՛ւ ինձ\nԲարի լույս ասել կիսված գիշերին,\nԵվ հոգնած հույսին ասել՝ արթնացիր,\nԵվ քեզ պես մնալ պարզ՝ ինչպես աչքեր։\n\nՍովորեցրո՛ւ ինձ շանթերի լեզուն,\nՀոգիս կարոտ է կարմիր ձայներին։\nՍովորեցրո՛ւ ինձ\nԾեր գինեմոլին խաբել պաղ սուրճով,\nԵվ թաց աչքերը սրբել աղավնու\nճերմակ փետուրով,\nՈւ բառերի մեջ մնալ ձիգ՝ ինչպես\nսարը Արարատ,\nՈր ինձնից հետո որդիս չուշացած\nկարոտով ասի՝\nԵս սկիզբ առա քեզնից, Հայաստա՛ն։"}},{"title":{"hy":"ՀԵՌՈՒ ՄԻ ԱՇԽԱՐՀ"},"group":{"hy":"ԼՈՒՍԱՎՈՐ ԵՐԱԶ"},"text":{"hy":"Ունեմ մի աշխարհ, հեռու մի աշխարհ,\nՄխում է անմեղ.\nԻմ փոքրիկ հողում, կա փոքրիկ մի սեր,\nԱպրում է ցմահ, խղճիս մեջ պարապ...\n\nՓոքրիկ աշխարհում շոգն է մեծանում,\nԵվ շիկանում են դեղձերը շոգից։\n\nԴաշտերի սովոր ձայնը սաղարթի,\nՃոճում են աշնան խշշոցը գետի։\n\nԻմ փոքրիկ աշխարհ, արևի սովոր,\nԵս կամ, իմ մեջ է լիճը իմ Վանա,\nՔո Երևանը և իմ Սևանը։\n\nԵս կամ, Հայաստա՛ն,\nԵս քո Մեսրոպն եմ, սարը Սիփանա,\nՀավատի սյունը քո Հոկտեմբերի։\n\nԵս, Հայաստա՛ն իմ,\nԿրկնությունդ եմ արևամարմին..."}},{"title":{"hy":"ԻՄ ՀԱՅՐԵՆԻՔ"},"group":{"hy":"ԼՈՒՍԱՎՈՐ ԵՐԱԶ"},"text":{"hy":"Հանդգնությամբ ծանրանում են տարիներս,\nՏառապանքով երջանկացնում կյանքը\nիմ սուտ,\nՀասկանում եմ չհասկացածս,\nԵվ զզվում եմ ծույլ խրատից։\n\nՄորս աչքերով նայում լույսին,\nԵվ ճանաչում իմ աչքերին.\nԱղջիկներին էլ չեմ տանջում,\nԽաղաղվել եմ ջրերի պես։\n\nԿրակի պես ինձ այրել են,\nՉեմ իմացել ցավը սրտիս,\nՉեմ մտածել, որ ուտելիս մածունն անգամ\nՊետք է փչել,\nԵվ աղմուկը դրսի մարել՝ բարձրախոսով։\n\nՍակայն սիրով եմ երազել,\nՈւ կարեկցել մեծ տագնապով,\nԻնչպե՞ս պիտի, իմ Հայրենիք,\nՏվածիդ դեմ փոխհատուցեմ,\nՈր չժխտեմ ես ինքս ինձ,\nԼինեմ քոնը, շատրվանը քո ինքնության,\nԵվ պտտվող քո լուսացած առավոտը,\nՈւ դեռ կյանքում դաս չիմացող մանչուկի պես,\nԱստղաբաշխի նման անդուլ,\nՉկավճոտվեմ...\nԱնգիր անեմ ճամփաներդ,\nՈր հրաշքներն անգամ թվան սովորական..."}},{"title":{"hy":"ՍԻՐՈՒՄ ԵՄ"},"group":{"hy":"ԼՈՒՍԱՎՈՐ ԵՐԱԶ"},"text":{"hy":"Հո՛ղ իմ,\nԱռանց քեզ անգույն կլիներ\nԻմ չեկած վաղը,\nԵվ ինձ հետ ապրող ձայները բոլոր.\nԱռանց քեզ կյանքն իմ կդառնար կուզիկ,\nԿմթներ սուգով իմ Արագածը,\nԵվ սուտ կլիներ իմ կերած հացը։\n\nՀո՛ղ իմ,\nՍիրում եմ քո լեռնադաշտը,\nՈրպես Մաշտոցի շողարձակ ձեռքեր,\nՈրպես հավատը իմ ապուպապի...\n\nՀո՛ղ իմ,\nՍիրում եմ լիճդ Սևանա,\nՈրպես դարերի մրրիկներ սանձող\nԲարձրադիր արքա...\nՑողն ու սարսուռը սարալանջերիդ,\nԹուխ աղջիկների շուրթերի վառը,\nԵվ կաքավների առաջին խաղը...\n\nՀո՛ղ իմ, եզե՛րք իմ,\nԵս քեզ եմ տենչում,\nԵս քեզ եմ գալիս, քոնն եմ արյունով,\nՈրպես կարմիր ծիլ բորբ արշալույսի..."}},{"title":{"hy":"ԻՄ ՍՈՒՐԲ ՀԱՅՐԵՆԻՔ"},"group":{"hy":"ԼՈՒՍԱՎՈՐ ԵՐԱԶ"},"text":{"hy":"Իմ սո՛ւրբ հայրենիք,\nԿուզեմ շշուկով սիրտս քեզ բանալ,\nՔո կապույտի մեջ մի քիչ զորանալ,\nՔո անունի հետ մի քիչ բարձրանալ,\nՔո արևի մեջ մի քիչ տաքանալ,\nՔո հովերի հետ մի քիչ զովանալ։\n\nԻմ վե՛հ հայրենիք, կուզեմ շշուկով\nԱկանջներիս մեջ քո ձայնը կաթե,\nԼռությանս մեջ տագնապ շեփորես,\nԹմրությանս մեջ շարժում ներարկես,\nԴառնությանս մեջ արև ցնցուղես,\nԻմ մոր բախտի մեջ հավատ ամբարես։"}},{"title":{"hy":"ԻՄ ԴԱՇՏԵՐԻ ՄԵՋ"},"group":{"hy":"ԼՈՒՍԱՎՈՐ ԵՐԱԶ"},"text":{"hy":"Իմ դաշտերի մեջ կաթկթող կարոտ,\nՕգնի՛ր ինձ, սիրտ իմ, կարոտն իմ առնեմ\nՀայոց աշխարհիս բառ ու հնչյունից,\nԿարճացած օրվա խուլ ստվերներից\nԹռցրու սևը,\nԿարմիր դարձրու...\nՀեռացրու ցավը,\nՄթնշաղը ինձ շուշան դարձրու...\nՈր չպատռվեն դաշտերը պառավ,\nՈւ չծարավեն, ու...չծարավեն։\n\nԻմ լեռ ու բառի մեջ կաթկթող կարոտ,\nՎառի՛ր ինձ, սիրտ իմ, որ լույս ցնցուղեմ,\nՀաշտեցրու հոգիս՝ կապույտ ձայնիս հետ,\nԲարդու շոր հագած օրերի ճյուղին՝\nՀագցրու կարմիր ակը արևի...\nՈր ձյուն-ձմռան մեջ գարուններ կաթեն,\nՈր չծերանան թռչունները ծեր,\nԵվ չհամրանան, և...չհամրանան։"}},{"title":{"hy":"ԵՍ ՆԱ ԵՄ"},"group":{"hy":"ԼՈՒՍԱՎՈՐ ԵՐԱԶ"},"text":{"hy":"Ես նա եմ, նա եմ, ով աշխարհ եկավ,\nՈւ չտրտնջաց ցավի մեջ պարապ,\nԻր կորցրածը երբեք չգտավ,\nԵվ չմոլորվեց հողմերի բքում։\n\nԵս նա եմ, նա եմ, ով աշխարհ եկավ,\nԻր ծոցում պահած «Կռունկ» ու կարոտ.\nԿրակներ վառեց հանդերում մրսած,\nԵվ շուտ արթնացավ իր առավոտից։\n\nՎերջապես նա եմ, ով աշխարհ եկավ,\nԲաց արեց ճամփան Արփա-Սևանի,\nՃեղքելով մութը, ժառանգորդ եղավ\nԼույսի ծննդին..."}},{"title":{"hy":"ՓՈՇԵԹԱԹԱԽ"},"group":{"hy":"ԼՈՒՍԱՎՈՐ ԵՐԱԶ"},"text":{"hy":"Փոշեթաթախ ճամփով ես աշխարհներ անցա,\nՈտնամաններ տեսա կաղնեփայտից.\nԱփսեների փայլով սրսուռ սունկեր տեսա,\nԵվ առյուծներ քինոտ՝ անապատում ոսկե։\n\nՔթերը վեր ցցած ես հրթիռներ տեսա՝\nՄկանների նման պրկված ու լարված.\nԵս հիպպիներ տեսա շեկ ծամերով փնթի...\nԳեղջուկներին տեսա սիսեռների դաշտում՝\nՍիսեռների նման կորացած ու հոգնած։\n\nԿավե աշխարհ տեսա, կավե աչքեր տխուր,\nԵվ շների մեղմած տխրությունով լացող\nԵս ագռավներ տեսա...\n\nԻմ բախտավոր եզերք, քո ծննդից առաջ,\nԴուն էլ կրել էիր հոգնած ցավը այդպես...\nՀիմա լույս են խայտում աղբյուրներդ զանգակ,\nԳարուններդ հիմա տարածում են ամառ,\nԱշխարհների քնած աշունների վրա..."}},{"title":{"hy":"ԵՐԳ ԲԱՐԵԿԱՄԻՍ ՄԱՍԻՆ"},"group":{"hy":"ԼՈՒՍԱՎՈՐ ԵՐԱԶ"},"text":{"hy":"Մենք խոտերի վրա պառկում էինք հաճախ,\nՊառկում էինք փոքրիկ մեր խոհերի ծոցում,\nՄենք լեռների վրա վազում էինք ճիչով՝\nՄառախուղի փոշին մեր բիբերին առած,\nՏեսնում էինք վերից Թափարվանը գժված,\nՀարդի լույսը տանող ալեմորուս պապիս։\n\nՄենք, երազներ կապած հազար սարի գլխից,\nԿանչում էինք իրար...\nԲայց կռիվը պայթեց լուսաբացից առաջ։\nՈւ երազներ մամռեց, հազար սարից անդին,\nԴու գնացիր կռիվ՝\nԱրյունամած դաշտի կարեկցանքով լցված,\nԵվ կարոտիդ ճիչը՝ անլռելի զանգակ,\nՀողի փափուկ կրծքում թպրտում էր անզուսպ։\n\nԴու գնացիր կռիվ, որ չկիսվեր հողդ,\nՉխորթանար ձորդ ու ջաղացի քարը,\nՈր արտերում ծփար ցորենի շեկ բոցը։\nՈւ երբ արկը պայթեց...հողը ցավից ճչաց,\nՏառապանքից մաշված քարերը լաց եղան,\nՈւ արյունը հոսեց կակաչների փայլով՝\nԵրազներին գրկած...\n\nԲայց դու նորից ելար,\nԻնչպես կյանքն է ելնում լուսաբացից առաջ,\nԻնչպես կյանքն է նորից վերընձյուղվում\nԱրյան միջից ելնող լույսի նման..."}},{"title":{"hy":"ԱՅՍՏԵՂ ՍԱՐԵՐԸ ՍԱՊԱՏԱՎՈՐ ԵՆ"},"group":{"hy":"ԼՈՒՍԱՎՈՐ ԵՐԱԶ"},"text":{"hy":"Այստեղ սարերը սապատավոր են,\nՋրի կարոտ են, ոտքի կարոտ.\nԱյստեղ ժայռերը վանքի բեկոր են,\nԽոսքի կարոտ են, ձեռքի կարոտ։\n\nԱյստեղ ժայռերը անմահություն են,\nԹաց լռություն են և թաց սարսուռ,\nՍեփական ճիչ ու համբերություն է\nԺայռից կաթկթող ամեն մասուր...\n\nԱյս հին ժայռերը այստեղ լեգենդ են,\nՀորս լեգենդն են պատմում տխուր.\nԱյստեղ ժայռերը կարոտ են պեղում,\nԾաղկաթերթեր է ձորը շնչում։"}},{"title":{"hy":"ՆՍՏԵԼ ԵՄ ՔԱՐԻՆ"},"group":{"hy":"ԼՈՒՍԱՎՈՐ ԵՐԱԶ"},"text":{"hy":"Նստել եմ քարին, իմ մեծերի պես,\nՄրրիկներ մարած,\nԿարոտս առած մարդուց ու հողից,\nՓոխս ընկնողի պես, լուռ մտորում եմ,\nՔարի հետ քո սուտ...\nԻնչ լավ է, սիրտ իմ, որ ես չեմ եղել\nԽղճին՝ փոս փորող,\nԲարուն՝ քար քաշող,\nԵվ խեղկատակին չեմ եղել բուժակ...\n\nԿարոտս առած մխո՜ւմ եմ, մխո՜ւմ\nԻմ փոքրի՜կ, փոքրի՜կ, փոքրի՜կ աշխարհում,\nԿապույտ երկինքը խմում է գարուն,\nԵվ գինովանում ամառվա նման։\n\n\n\n\n\n                          ԱՐՑՈՒՆՔՈՏ ՍԵՐ\n\n***\nԵթե ձյունը իջներ վրաս ժամանակին,\nՉէր հանգուցվի ուսը լեռան.\nԿմնայի շուշանի պես գինովացած,\nԼուսե ժանյակ կթափեի\nԱղջիկներին չհամբուրված։\n\nԵթե լույսը իջներ վրաս ժամանակին,\nՉէր խաթարվի բախտս ճամփին։\nԿպաշտեի սուրբ կրակի լույսը մրսած,\nՍիրո խոսքեր ես կասեի\nԱղջիկներին չպսակված։\n\nԵթե գութը իջներ վրաս ժամանակին,\nՉէր ակոսվի լիճը հուշիկ,\nԿծլեի շուտ արթնացող արտի նման,\nՈւ կույրի պես կգրկեի\nԱղջիկներին չհարսնացած..."}},{"title":{"hy":"ԻՄ ՍԵՐ"},"group":{"hy":"ԱՐՑՈՒՆՔՈՏ ՍԵՐ"},"text":{"hy":"Աշունը եկավ խելոք հարսի պես,\nԻրա մեջ առավ տանջանք ու ծիծաղ,\nՄերթ ցուրտ վառելով ու մերթ շոգելով,\nՄետաքսի ուռած իլիկների պես\nԻր խաս թելերով կծկեց ու տարավ\nժամանակը խենթ,\nՀավատացնելով՝ ցրտեր չեն լինի,\nԵվ մենք չենք մնա խաբված կարոտով։\n\nԱշունը եկավ, հավատացնելով՝ ձյուներ չեն գալու,\nՍառցե լուլաներ չեն կախվի ժայռի լռության վրա,\nՀայսը շիվ կտա, արտացոլանքով խշշացող բարդու,\nԵվ խարույկները խորոված կտան մրսած ճամփորդին,\nԵվ ձկնորսները լակոտների պես չեն շշմի երբեք,\nՈր պաղ ջրերում ձկներ չեն լողում...\n\nԱշունը եկավ չբեր կնոջ պես,\nՍտվերներ իջան ծուռտիկ ու գունատ,\nՁայնդ փոքրացավ աղերսանքի պես –\nԿպավ իմ անձին խեժի պես ծառի...\nԹող փնտրեմ ես քեզ ականահատի աչքերով հոգնած,\nՓակեմ աչքերս՝ աստղերդ կարդամ,\nԳժուկի նման ինքս ինձ խաբեմ,\nՈր աշունները գարուն են բուրում,\nԵվ չեն զմռսվում ձյուն-սառույցի տակ շուշանները հեզ,\nԵվ հողագունդը տաք թոնրի նման շնչում է իրեն,\nԻնչպես որ անթև շորերի տակից մարմինը կանանց...\n\nԱշունը եկավ, մխիթարելով, որ լույս կվառես,\nԵվ մենք չենք մնա խաբված կարոտով,\nԵվ մենք չենք մնա տխուր աչքերով,\nԵվ կմոռանանք, որ ունեցել ենք երկյուղ ու ցավեր..."}},{"title":{"hy":"ԺԱՄԱՆԱԿ ՉԿԱ"},"group":{"hy":"ԱՐՑՈՒՆՔՈՏ ՍԵՐ"},"text":{"hy":"Կգա ժամանակ, ես ինձ կգտնեմ,\nԵվ չեմ դժգոհի ինքս ինձանից.\nԴեռ կա ժամանակ՝ քեզնով ինձ մաքրեմ,\nՉթողնեմ մթնի կարոտն իմ նորից։\n\nԴեռ կա ժամանակ՝ հոգսերն իմ ուսեմ,\nՊարտքերս մարեմ, կանչեմ ինքս ինձ.\nԿգա ժամանակ, կհասկանամ ես՝\nՉկա ծերություն առանց թախիծի։\n\nՀիմա անցնում եմ ճամփով քո դժվար,\nՀուշերս ծխում, հասկերս են թռչում.\nՍե՛ր, ծերանալու ժամանակ չկա,\nԱրթնացի՛ր, սե՛ր իմ, ծառերն են երգում..."}},{"title":{"hy":"ԵԹԵ ԽԱՌՆՈՒՄ ԵՆՔ"},"group":{"hy":"ԱՐՑՈՒՆՔՈՏ ՍԵՐ"},"text":{"hy":"Եթե խառնում ենք քո խռով հոգուն\nԿարոտի արյուն,\nԻմացի՛ր, իմ սեր,\nՔեզ հագցնում են մուշտակը լույսի.\nԻմացի՛ր, իմ սեր, աչքերն իմ հոգնած\nԱպրելու հույսով կխոսեն թաքուն,\nԵվ կմոռանան, որ տառապել են...\n\nԻմացի՛ր, իմ սեր,\nՈր մեկը անծուխ քո ստվերի հետ\nՔայլում է անուժ,\nՈր մեկը տխուր քարերին աճած\nՔարասունկի պես\nԾերանում է հեշտ։\n\nԼսո՞ւմ ես, սեր իմ, հիշատակի պես\nԻնձ ետ բեր նորից աշխարհն իմ թափուր,\nԱյդ ինձ ո՞վ տվեց այսքան տաք թախիծ,\nԻնձ ո՞վ հագցրեց տագնապի թիկնոց,\nԵվ ո՞վ արնոտեց արցունքիս լեզուն,\nԵվ տալուծեց հառաչանքի հետ...\n\nԼսո՞ւմ ես, երգ իմ, նահանջողի պես\nԵտ բեր վերստին՝ ինքս ինձ կարոտեմ,\nԿարկաչեմ, ծփամ, կանաչեմ, բուրեմ։"}},{"title":{"hy":"ՔԱՆԻ ՈՐ ԴՈՒ ԿԱՍ"},"group":{"hy":"ԱՐՑՈՒՆՔՈՏ ՍԵՐ"},"text":{"hy":"Քանի որ դու կաս, կապրեմ ես քեզնով,\nԿքշեմ ցավեր սև տրտմության պես.\nԿապրեմ անկորուստ, անմոլոր հույսով,\nՈւ թե չլինեմ,\nԱպրիր, սիրելիս, ինչպես որ կուզես։\n\nՔանի որ դու կաս, կլցվեմ քեզնով\nԵվ կգգվեմ քեզ՝ դու կդառնաս լույս,\nԿնայեմ աչքերիդ՝ մութը կվառես,\nԵթե բարկանաս, ես կկասկածեմ,\nԻսկ եթե ծաղրես, մարած եմ արդեն,\nՈւ թե չլինեմ,\nԱպրիր, սիրելիս, ինչպես որ կուզես։"}},{"title":{"hy":"ԵԹԵ ԵՍ ԿԱՄ"},"group":{"hy":"ԱՐՑՈՒՆՔՈՏ ՍԵՐ"},"text":{"hy":"Եթե ես կամ,\nԿքնեցնեմ ծաղկունքի մեջ ձանձրույթ ու սուգ,\nԿզուլալեմ չարը՝ կապույտ արցունքի պես,\nԵվ կխոսի կաթկթոցը քարանձավի,\nԿթպրտա արթնացումը խուլ անտառի,\nՆախանձվելուց\nԿուշաթափվեն կակաչները որբևայրի։\n\nԹե չլինեմ,\nԿհամրանա եռուզեռը ճամփաների,\nԿուտ գնացող հացի նման,\nԹախանձանքից դու քեզ կայրես...\nԴե, ծիծաղի՛ր՝ աչքերիդ մեջ մեծ խրախճանք,\nԴե, ծիծաղի՛ր՝ կարոտը լա կոպերիդ տակ,\nԴե, ծիծաղի՛ր, որ հասկանանք\nԹե աշխարհում ինչո՞ւ համար են խենթանում..."}},{"title":{"hy":"ԻՄ ԽՈՒԼ ՁԱՅՆԻ ՄԵՋ"},"group":{"hy":"ԱՐՑՈՒՆՔՈՏ ՍԵՐ"},"text":{"hy":"Իմ խուլ ձայնի մեջ ես մենակ էի,\nԻնչպես Ադամը.\nԵս մխում էի իմ կորուստի մեջ,\nԻնչպես հնաբույր մի կրակարան։\n\nԵս մենակ էի իմ լռության մեջ,\nԻնչպես քարեղեն այս ծաղիկները,\nՈր կուզեն թռչել՝ չեն կարողանում։\n\nՀիմա լալիս է աշնան անտառը,\nՈւ չեմ իմանում, թե ինչպես մխամ......\nԻմ արցունքներին ցավ չլինեմ ես։\n\nՀիմա կանգնել եմ իմ ու քո միջև՝\nՄարած երգ դարձած ու մարած քրքիջ.\nՀիմա առանց քեզ այս մեծ աշխարհը\nԻնձ համար փոքր է և քիչ, այնքա՜ն քիչ..."}},{"title":{"hy":"ՍԵՐ ԻՄ"},"group":{"hy":"ԱՐՑՈՒՆՔՈՏ ՍԵՐ"},"text":{"hy":"Սեր իմ,\nՄենք կարծես խուլ ենք ու մի քիչ կակազ,\nԵվ անկարեկից այրում ես երբ դու,\nԻնձ միշտ թվում է՝ մենք չունենք երազ,\nՀողին քոր բերող բոխի ենք անդուր։\n\nՍեր իմ,\nԵվ մենք մխում ենք, և ամենուր կանք,\nՈրպես տեսիլքներ առհավետ ծաղկող,\nԿանչում ենք իրար հառաչանքով տաք,\nՈւ չկանք, ինչպես լապտերներ հանգչող։\n\nՍեր իմ,\nՄեզ միշտ թվում է՝ չունենք տառապանք,\nԵվ էլ չենք մուրա կարոտանք ու սեր,\nՄեզ միշտ թվում է, կարծես չի թվում,\nՈր մենք իսկական որբեր ենք կյանքում։"}},{"title":{"hy":"ՄԻ ԱՆՄԵՂ ԵՐԵԿՈ"},"group":{"hy":"ԱՐՑՈՒՆՔՈՏ ՍԵՐ"},"text":{"hy":"Մի քնքուշ երեկո մենք գտանք իրարու,\nՊտտվում էր այգում կարուսելը հոգնած,\nՊտտվում էր քամին թևերով իր ճերմակ,\nԵվ տանում խշշալով երեկոն մեր հոգնած։\n\nՄի անմեղ երեկո, մի անցուրտ երեկո,\nԵվ սիրեց նա այնպես թախանձանքն իմ\nզսպած,\nՊատշգամբն իմ կանաչ, այն պատի ետևում\nԻմ կարոտն է պահում լաթի պես քրքրված...\n\nՄի աշնան երեկո, մի խելառ երեկո,\nՆա բաշխեց, բաժանեց չունեցածն իր ժլատ,\nՀնազանդ մատներով ինձ տարավ լույսի մեջ,\nԵվ հանեց իմ միջից պատառները մութի..."}},{"title":{"hy":"ԵՍ ԿՈՐՑՆՈՒՄ ԵՄ"},"group":{"hy":"ԱՐՑՈՒՆՔՈՏ ՍԵՐ"},"text":{"hy":"Պաղ երկնքի տակ ես տաքացնում եմ\nՏխուր մատներդ, մրսած մատներդ,\nՈր աչքերիդ մեջ ցուրտը պառավի,\nՈր գոլ կարոտներ կաթեն երկնքից...\n\nՈւռիների տակ ես տաքացնում եմ\nՋահել շուրթերդ, բարի շուրթերդ,\nՈր աչքերիդ մեջ ուռենին խոսի՝\nԳունավոր երգեր թափվեն երկնքից...\n\nՈւռիների տակ ես կորցնում եմ\nՄախմուր աչքերդ, թուխ-թուխ աչքերդ,\nԵվ աչքերիս մեջ սևն է շարժվում,\nԼուսնի մահիկն է պաղում երկնքում։"}},{"title":{"hy":"ՀԵՌԱՆՈՒՄ ԵՍ"},"group":{"hy":"ԱՐՑՈՒՆՔՈՏ ՍԵՐ"},"text":{"hy":"Դու անմեղ ես, հեռանում ես...\nՀեռանում ես երազի պես,\nՔո շուրթերը կնքված են արեգակի շեկ\nշարերով,\nՔեզ տեսնելուց իմ շուրթերը կհառաչեն,\nՎերապրելուց կխանձվեն իմ շուրթերը,\nԿռիվ կանեն ծարավելուց...\n\nԴու անմեղ ես, հեռանում ես,\nՀեռանում ես հուշերի պես,\nԵս ինչ անեմ,\nԵս էլ քեզ պես այրվելուց չեմ խենթանում,\nՉսիրվելուց եմ խորթանում,\nԵվ ծերանում՝ կորցնելուց։\nԵս լավ գիտեմ՝ ծերուկներին դու չես սիրում,\nԵվ չես սիրում հոգնածներին,\nԽաբվածներին դու չես սիրում\nՈւ չես խղճում ընկածներին...\nՄոռանալով, իմ սիրելի, որ բոլորս էլ քո դեմքն\nունենք\nՈւ քո քայլքը...\nԴու անմե՞ղ ես,\nՀեռանում ես, հեռանում ես կորուստի պես..."}},{"title":{"hy":"ԽՈՒԼ Է"},"group":{"hy":"ԱՐՑՈՒՆՔՈՏ ՍԵՐ"},"text":{"hy":"Խուլ է,\nԵրբ սերը մնում է ներսում...\nԻնչ լուռ է դրսում,\nՋահել զեփյուռը մեղվի ծաղկի հետ,\nՄեր քնքշանքը\nԵվ ամենատաք խոսքերը չասված,\nԱռել տանում է...\n\nԻնչ լա՜վ է դրսում,\nԵրբ որ ինձ հետ ես։\nԴեղին հանդերը դառնում են կանաչ,\nԱնխոր ձորափը դառնում է քարափ,\nՁայնն ամպերի դառնում ձայնասփյուռ,\nԳերող աչքերը դառնում են քրքիջ,\nԼուռ կաթկթում են ու...կաթկթում են\nԾեր սանդի վրա։\n\nԻնչ լավ է դրսում,\nՑավ է,\nԵրբ սերը մնում է ներսում..."}},{"title":{"hy":"ՄԻ ՀՈԳՆԱԾ"},"group":{"hy":"ԱՐՑՈՒՆՔՈՏ ՍԵՐ"},"text":{"hy":"Մի հոգնած առավոտ արեգակը ծաղկեց,\nՈւ ես քեզ չգտա մի հոգնած առավոտ.\nԻնչ-որ մեկը խոշոր շշուկով ինձ կանչեց,\nԴարձա ետ, չհասա իմ ձայնին ալարկոտ։\n\nԵրբ արևը քնեց, ձորերը թախծեցին՝\nՔո ձեռքերը տեսա ուրիշի ձեռքերում...\nԹրջվեց կեղևն իմ ամոթից համրացած։\nԵս ոչինչ , քեզ ոչինչ չասացի,\nՄիայն լուռ սուլեցի խանդոտ երգ,\nՈւ կրակս հանգավ կրակով..."}},{"title":{"hy":"ՉԿԱՆ ԱՉՔԵՐԴ"},"group":{"hy":"ԱՐՑՈՒՆՔՈՏ ՍԵՐ"},"text":{"hy":"Իմ ձեռքերի մեջ չկան ձեռքերդ,\nԳիշերների պես քայլում են մենակ՝\nՉոր խշշոցները քարերի վրա,\nԵս լռություն եմ սովորում քարից։\n\nԻմ աչքերի մեջ չկան աչքերդ,\nՁնաբուք տեսած անտառի նման,\nՍառցե լուլա է ծառերից կաթում,\nԵս սառնություն եմ ուսանում սառցից։\n\nԻմ վայրկյանի մեջ չկան շուրթերդ,\nՑավի տրտունջն է սառել իմ լեզվին,\nԵվ հողը դեղին ծաղիկ է կարում,\nՀամբերություն եմ գողանում ժայռից։\n\nԻմ կարոտն անշուրթ ձգվում է բարձր,\nՀին Եգիպտոսի բուրգերի նման...\nԻմ ձեռքերի մեջ չկան ձեռքերդ,\nԵվ աչքերիս մեջ աչքերդ չկան։"}},{"title":{"hy":"ԵՍ ՈՐ ԱՍՈՒՄ ԵՄ"},"group":{"hy":"ԱՐՑՈՒՆՔՈՏ ՍԵՐ"},"text":{"hy":"Ես որ ասում եմ,\nՈր մենք դեռ իրար լավ չենք ճանաչում,\nԵս միշտ կարող եմ կրկնել անսուտ,\nԹե՝\nՃանաչում ենք իրար շատ վաղուց։\nՀիմա իմաստուն, իմաստունի պես,\nԲացում եմ հոգիս,\nՈր գտնեմ մի դուռ ու մտնեմ ես ներս,\nԵվ ասեմ՝ տե՛րս, վերջապես եկա...\nՈւ գտնենք իրար,\nԻնչպես գետերը իրար են գտնում,\nԽառնվենք իրար,\nԻնչպես մրրիկը լեռնադաշտի մեջ,\nՈւ շարունակենք՝ մնալով նույնը,\nԻնչպես այն քնած ժայռերը մթին,\nՈր կայծակների թեժ զիգզագներից\nՉեն դողում, զարթնում։"}},{"title":{"hy":"ՀԻՇՈ՞ՒՄ ԵՍ, ՍԵՐ ԻՄ"},"group":{"hy":"352"},"text":{"hy":"Հիշո՞ւմ ես, սեր իմ,\nԱպրելու համար մեզ պետք էր միայն\nԱրևածագի պատրանքը կարմիր,\nՈր մեր սրտերում շիկներ խև բոցը,\nԱյնքան լուսավոր,\nՈրքան մարմարե\nՔո շրթունքներն ու քո պարանոցը։\n\n\nԱպրելու համար մեզ պետք էր միայն\nՄի բուռ տաք հավատ և մի կում պաղ ջուր,\nՈր ունենայինք մի հարուստ անցյալ\nԵվ աղքատ գիշեր թափուր հուշերով։\n\n\nԻնչո՞ւ չունեցանք ոչ կարգին մի քուն,\nՈչ էլ ճիշտ երազ.\nՈչ էլ քաղցրացանք այն բալենու պես,\nՈր չկարմրած կարկուտն է տանում։\n\n\nՄենք չհասկացանք և խելքի չեկանք,\nԹեև ջոկում էինք սոխը սխտորից,\nՔարափն՝ անդունդից...\nԵվ պահում էինք ցավը բերանում։\n\n\n\n\nԻսկ հիմա, սեր իմ, ապրում ենք դարձյալ\nԻրարից հեռու և իրար մոտիկ,\nԵվ մեր մազերում ճերմակած ցուրտն է\nԽաղում իր կյանքի երկրորդ ամառը...\nԵվ խլանում են մեր ականջներում\nՄեր ձայնը , շունչը, մեր անունները...\n\nԵվ հեռանում ենք, հեռանում ենք մենք\nԴատարկ փեշերով սերմնացանի պես...\nԽելագար ենք մենք, խելառ, խելամիտ..."}},{"title":{"hy":"ԱՌԱՆՑ ՔԵԶ"},"group":{"hy":"352"},"text":{"hy":"Դու մոռացար, որ ես քո հին գութն եմ եղել.\nՔո սարերը հացոտ։\nԴու չիմացար, որ քո ակունքներում ծարավ՝\nՈւժաթափ են լինում ջրվեժները ահեղ։\nԵվ ամպերը՝ կարմիր քո բալենու շուրթից\nԻմ կրակն են տանում...\nԿորցրածս են փնտրում գարունները կանաչ,\nԵվ քրտինքը նրանց, որ անձրևի լաց է,\nԿաթկթում է ճաքած չեչաքարի աչքին։\n\nԲայց թե ինչո՞ւ, ինչո՞ւ,\nՓակ այրերի նման մութ են մնում դարձյալ\nՔո աչքերում բուսած կապոցները լույսի.\nԷլ ես չունեմ դադար, ցավը ինձ շուռ տվեց\nԵղինջների վրա,\nՈւ ձմեռը եկավ ճերմակ թախիծ դրեց\nԻմ ակունքի վրա..."}},{"title":{"hy":"ՔՈ ԱՉՔԵՐԸ ՉԿԱՆ"},"group":{"hy":"352"},"text":{"hy":"Քո աչքերը չկան,\nԻմ շուրթերից էլի ցուրտ խշշոց է ելնում,\nԿարկուտներ են ընկնում կտուրներին ամեն,\nԿարկուտների սողք է և իմ խելառ ներսում։\n\nԻմ աչքերը կանաչ՝ ջուր խմելու ծարավ,\nԵվ շուրթերիս նորից՝ սոսիների սոսափ,\nՔո աչքերը չկան,\nԿասկածանքն ինձ այրող\nՄեծանում է թափուր անապատի նման...\nԵս դառնում եմ թլվատ ու մի քիչ էլ կուզիկ...\n\nՔո աչքերը չկան.\nԻրիկուն է, մշուշ,\nԼապտերներ են վառվում արեգակի հաշվին։"}},{"title":{"hy":"ՄԻ ՀԵՌԱՆԱ"},"group":{"hy":"352"},"text":{"hy":"Եթե չլինեմ,\nՆոր կհասկանաս,\nԹե որքան եմ քեզ\nՀարկավոր եղել։\n\nԵթե չլինեմ,\nԹավշե ծիծաղդ\nԿփախչի քեզնից,\nԽոսող բիբերդ\nԿարթնանան ցավով,\nԿարոտող աչքդ\nԿդառնա արցունք\nԵվ կկաթկթի, և...կկաթկթի։\n\nՄեղք են աչքերս, մոլոր աչքերս,\nԱյրված աչքերիդ զայրույթի առաջ։"}},{"title":{"hy":"ԵՐԲ ՈՐ ԴՈԻ ԵԿԱՐ"},"group":{"hy":"352"},"text":{"hy":"Երբ որ դու եկար,\nԻմ մոլոր աստված,\nԻմ աղետավոր մենակությունը\nԹաց արցունքի պես շարժվեց իմ մեջ,\nԵվ ես չիմացա՝ այդ ո՞ր աշխարհից\nՄի ցուրտ դող իջավ իմ խղճի վրա,\nՄի բուռ ցող ընկավ իմ սրտի վրա,\nԵվ ես կուշտ լացի իմ մեղքի վրա,\nԵվ ծիծաղեցի իմ խելքի վրա...\nՈր չեմ ուն ւմ\nՏառապանքը իմ։"}},{"title":{"hy":"ԹԵ ԻՆՁ ՉԽՂՃԱՍ"},"group":{"hy":"352"},"text":{"hy":"Թե ինձ չխղճաս ու... չգաս հանկարծ,\nԿապույտ երկինքը կլցվի սևով,\nՈւ մանրիկ-մանրիկ\nԻմ աչքերի մեջ կծնվի ցավը,\nՈւ կմեծանա հազարապատիկ։\n\nԹե ինձ մոռանաս, ես ինձ կդատեմ,\nԶգալով, որ ես ստով եմ ապրել,\nՈւ ծաղիկ-ծաղիկ\nԻմ արեգակը դանդաղ կխամրի,\nՈւ կփոքրանա հազարապատիկ։\n\nՈւ թե դու չգաս խաղով քո կանաչ,\nՍիրտս կմարի բոլորին ծանոթ,\nԵվ ալիք-ալիք\nԿապույտ երկինքը կլցվի սուգով\nՈւ կսևանա հազարապատիկ..."}},{"title":{"hy":"ԲԱԺԱՆՎԱԾԸ"},"group":{"hy":"352"},"text":{"hy":"Քամին անտառ է փախչում,\nԾառերը համր են.\nԹխպոտ մրուր է կաթում,\nՋրերը սառն են։\n\nԱնխոս մխում ես ձորում,\nՑավերդ ծանր են.\nՑուրտը մորմոքդ է զսպում,\nՇուրթերդ դառն են։\n\nՀողմը անտառ է վազում,\nՄողեսի լաց է.\nԲարակ խաշամն է մրսում,\nԱմեն ինչ թաց է։\n\nՇվար նստել ես քարին,\nԱպրելը կամք է.\nՊղտոր քրտինք է իջնում,\nՍիրելը կյանք է։"}},{"title":{"hy":"ԱՌԱՋԻՆ ԱՆԳԱՄ"},"group":{"hy":"352"},"text":{"hy":"Առաջին անգամ\nՁեր տունը բերին շաղոտ ոտքերս։\nԵս խոսելու մեջ այնքան անվարժ եմ,\nԱյնքան անզգույշ,\nՈր սայթաքում եմ ու վայր չեմ ընկնում։\nԵս ծաղրվում եմ ու ճար չեմ գտնում,\nԻնքս ինձ ուղղում ու չեմ շտկվում,\nԵվ շփոթվում եմ ինչպես դպրոցում։\nԴու ծիծաղում ես քրոջ պես մաքուր,\nԵս կարկամում եմ, վախենում եմ ես։\nԵս մտածում եմ՝ ուր որ է կասես.\n- Այս ինչ հիմարն է...\nԵս խաղաղվում եմ, երբ հեռանում ես,\nՁեր տան ճանապարհն արդեն լավ գիտեմ,\nԴեռ տաք են հնչում խոսքերդ զվարթ,\nԵվ օրը այնքան անուշ է մթնում։"}},{"title":{"hy":"ԱՅԴ Ո՞ՒՐ ԵՍ ԳՆՈՒՄ"},"group":{"hy":"352"},"text":{"hy":"Այդ ո՞ւր ես գնում...\nՄարող աստղերը իրիկվա բույրով\nՇուշաններ դարձան...\nԿարոտիս ճամփով ես քեզ եմ գալիս,\nԵվ ծանոթ են քեզ ճամփաները իմ։\n\nԱյդ ո՞ւր ես գնում,\nԻնչո՞ւ ես թողնում դաշտերս դատարկ.\nԴաշտերիս վրա մեղուները հեզ\nՄեղվական ձայնով, տես, ոնց են լալիս,\nՆրանցից այնպես քո բույրն է գալիս...\nԱյդ ո՞ւր ես գնում..."}},{"title":{"hy":"ՄՈՒԹՆ ԻՋՆՈՒՄ Է"},"group":{"hy":"352"},"text":{"hy":"Մութն իջնում է մեղվի վրա,\nՄեղուն մրսում է.\nՄութը կաթ-կաթ խտանում է,\nԾառը քնում է։\n\nԽուփ :{"hy":"ԵԹԵ ԿԱՅԾԱԿԸ"},"group":{"hy":"ԳՈՒՆԱՎՈՐ ԱՇԽԱՐՀ"},"text":{"hy":"Եթե կայծակը չկիսեր բոխուն,\nՕրը չէր լցվի դառնության ցանցով,\nՏեղ-տեղ չէր կցվի խավարը՝ լույսին,\nԵթե կայծակը չխփեր բոխուն։\n\nՈւ թե կարկուտը չծեծեր հասկին,\nԱկացու բույրը կվառեր հողին,\nՉէինք կորցնի մեր թուխ ձեռքերը,\nԾիծաղի խաղը ու բաց երկինքը։\n\nԵթե արևը չխարկեր հողը,\nԵվ չտաքացներ ճերմակ թփերը,\nՑուրտը կսողար իմ ոտքերի տակ,\nԻնձնից կտաներ իմ տաք ցերեկը։\n\nԵթե արևը չգրկեր դաշտը,\nՈւ, երբ հասկի պես ազնիվ ու մաքուր,\nԻմ արյան կանչին դու ցողուն ձգես,\nԻմ տխուր օրը սեփական ճիչով\nԽինդի կփոխեմ։\nԵս իմ թավ ձայնը դրոշների պես\nԿկախեմ մուտքից,\nԵվ դեմքս դեպի արևը արած լույսեր կխմեմ,\nԵվ կցնցուղեմ քո հոգնած լույսը..."}},{"title":{"hy":"ԼԻՆՈՒՄ ԵՆ ՊԱՀԵՐ"},"group":{"hy":"ԳՈՒՆԱՎՈՐ ԱՇԽԱՐՀ"},"text":{"hy":"Լինում են պահեր՝\nԾանոթ դաշտերի դեղնության միջով\nԵվ կարոտների մորմոքի միջով,\nՀևոցի նման անցնում ես մենակ՝\nԵտևում թողած հազար խրախճանք.\nԱնցնում ես մենակ,\nԵվ հողի լույսը, մշուշներ դարձած,\nՔո սիրտն է լցվում...\n\nԱշնան անտառի խաշամի միջով\nԽշշում ես մենակ,\nԵվ ցուրտն է չոքում բիբերիդ վրա,\nԵվ ծիծաղում է խելագարի պես\nՔամին ծերացած...\n\nԼինում են պահեր և գուցե դաժան,\nՑավերդ ես սանրում ցասումիդ սանրով,\nԿծու սոխի պես քեզ բացում շերտ-շերտ,\nԵվ սպառում ես տենդը կրակիդ...\nԼինում են պահեր,\nԵվ պահեր՝ որպես գողացած հուշեր..."}},{"title":{"hy":"ԳԻՏԵՄ"},"group":{"hy":"ԳՈՒՆԱՎՈՐ ԱՇԽԱՐՀ"},"text":{"hy":"Գիտեմ, որ ձմեռ է գալու,\nՁմռան հետ աղքատ մի արև,\nՍարերի ճիչն է քնելու\nՁյան սառցե բարակ վերմակում։\n\nԵվ մայրս ջահել ու բարի,\nԳալարուն կածանով սարի,\nՉի բերի էլ բույրը խոտի\nԵվ ծաղկանց գույները վայրի։\n\nՈւ հիմա տրտում ու թախծոտ,\nՆայում է... նայում փաթիլին,\nՁմռամ հետ այս խենթ ու բարի\nԻնքն էլ է, ինքն էլ է ծերանում։"}},{"title":{"hy":"ՔԱՆԻ ՈՐ ԿԱՆՔ"},"group":{"hy":"ԳՈՒՆԱՎՈՐ ԱՇԽԱՐՀ"},"text":{"hy":"Քանի որ կանք այս աշխարհում,\nԱյս աշխարհում նաև մեկ-մեկ\nԻրար այնպես ենք մենք հերքում,\nՈր կսկծից խելքն է մրսում։\nՄոլորվում ենք թեթև բանից,\nՈւ շտկվում ծանր բեռից,\nԵվ չենք տրտում լռությունից,\nԽարույկներից չենք տաքանում,\nԳոլանում ենք ձյուն-սառույցից։\n\nՔանի որ կանք այս աշխարհում,\nԵրակներում մեր արնաներկ\nՔո անունն է, աշխարհ իմ սուրբ,\nՄեզ վեր տանում, մեծ քաջության,\nՔո անունն է, աշխարհ իմ սուրբ,\nՈրդիս պարզում իր ձիգ բազկում..."}},{"title":{"hy":"ՀԻՇՈ՞ՒՄ ԵՍ"},"group":{"hy":"ԳՈՒՆԱՎՈՐ ԱՇԽԱՐՀ"},"text":{"hy":"Հիշո՞ւմ ես, սիրտ իմ, որ ստվերներից\nԿարոտի նման գալիս էր մի ձայն,\nԵվ մարում մեկեն լապտերների մեջ։\n\nՀիշո՞ւմ ես, սիրտ իմ, ձյուների միջից\nՇուշանի նման բացվում էր մի ձեռք\nԵվ գրկում հանդարտ ցավերն իմ հոգու...\n\nՀիշո՞ւմ ես, հիշում՝ հողմերի միջից,\nՈր թոքի նման ուռչում էր մի լույս\nԵվ դառնում մեկեն քնքշություն մի թանկ։\n\nԵվ դու հիշո՞ւմ ես, անտառի միջից\nԿարոտի նման պայթում էր մի լաց...\nԱյդ ես էի, ես, սուտ աստղերի պես,\nԼուռ հառաչելով, գոցում շուրթերդ,\nՈր դու չդառնաս թախիծի խարույկ..."}},{"title":{"hy":"ԱՍՏՂԵՐԻՑ ԹԱՓՎՈՂ"},"group":{"hy":"ԳՈՒՆԱՎՈՐ ԱՇԽԱՐՀ"},"text":{"hy":"Աստղերից թափվող ցուրտ օրերի մեջ,\nՀոտաղ զեփյուռը\nՀողոտ ոտքերիս տաք լույսն է տանում։\n\nՇարմաղ, ծաղկազարդ, մութ լեռների մեջ,\nՎայրի ջրվեժը\nՀողոտ երգերիս սուլոցն է տանում...\n\nՀեռավոր դաշտում,\nԼացող ջութակին կանչող արևը\nԿարոտ աչքերիս արցունքն է տանում..."}},{"title":{"hy":"ՑԱՎԻ ՏԵՐ ՄԱՐԴԸ"},"group":{"hy":"ԳՈՒՆԱՎՈՐ ԱՇԽԱՐՀ"},"text":{"hy":"Ցավի տեր մարդը տագնապի մեջ է,\nՑասումի մեջ է ու մղկտոցի.\nԻնքը և խեղճ է, ինքը և վեճ է,\nԻնքը նման է մեծ բանաստեղծի։\n\nՑավի տեր մարդը ինքը հոգոց է,\nԻնքը խշշոց է և ինքը գոց է.\nԻսկ դու, իմ նեցուկ, որ ցավ չես տեսել,\nԻնչպես հասկանաս ցավ տեսած մարդուն..."}},{"title":{"hy":"ԴՈՒ ՉԿԱՐԵՑԱՐ"},"group":{"hy":"ԳՈՒՆԱՎՈՐ ԱՇԽԱՐՀ"},"text":{"hy":"Դու չկարեցար, սիրտ իմ կարեկից,\nՕրերի բուքում աչքկապոց խաղալ,\nԵվ կրակ մարող աչքերին ժպտալ,\nՇառաչել վարար ջրերի նման,\nԵվ կաղնու նման բարձունքից նայել\nՉկարողացար...\n\nՉսովորեցիր\nԼույսին մութ խառնել,\nԱրցունքին՝ պղպեղ,\nԵվ հանդում ծաղկող վաղնջալույսի\nավիշը քամել,\nԴայլայլը հավքի\nՉսովորեցիր...\n\nԴու ինձ շուռ տվիր քո ափերի մեջ\nԵվ կեռ խուփ դրիր իմ ծաղկանց վրա,\nԵս լուռ մխացի և չխլեցի տվածդ, Աստված...\n\nԵս արև տեսա\nԲյուրեղապակե նկարների մեջ\nԻմ սուրբ պապերի,\nԵվ իմ մեջ խոսեց արյունը պապիս,\nՄիակ արյունը, որ կարմրում է զուլալությունից\nԵվ սևանում է, երբ մեծանում է չարը լույսի\nպես...\n\n\nԱհա թե ինչու\nՉսովորեցի\nՄեղրին աղ խառնել,\nՔրտինքին՝ դողոց,\nԵվ հանցագործին չեղա բարեկամ։"}},{"title":{"hy":"ՑՈՐԵՆԻ ՀԱՍԿԸ"},"group":{"hy":"ԳՈՒՆԱՎՈՐ ԱՇԽԱՐՀ"},"text":{"hy":"Ցորենի հասկը հողի շեփորն է,\nՆրա ծոցի մեջ դաշտն է տաքանում.\nՑորենի հասկը նոր բացված օր է,\nԲյուրեղապակյա շշունջ սրբազան։\n\nՑորենի հասկը առաջին շողն է,\nՄորս ձեռքերն է ցորենի հասկը.\nԲոլոր դաշտերի խտացված հովն է,\nԾով է փրփրած և համբերություն։\n\nՑորենի հասկը իմաստուն աստղ է,\nՆրա մեջ հողի մրմունջն է ծխում.\nՆա էլ ինձ նման՝ հողմերի դիմաց\nԱյնպես հանդարտ է ցավերը զսպում։"}},{"title":{"hy":"ԻՄ ՈՏՔԵՐԻ"},"group":{"hy":"353"},"text":{"hy":"Իմ ոտքերի հոգնությունից\nՉի ծանրանա հողը երգող,\nԵվ կարոտիս մայրամուտը չի ծերանա...\nՊերճանք տալով հույսի նման՝\nՁեր աչքերում լույս կգտնեմ,\nԵվ գունավոր արեգակներ,\nԵվ մենավոր բալենիներ\nԵս կվառեմ...\nԵվ կսրբեմ իմ մատներով,\nՈւմ ճակատին ցավ կա հոգնած,\nՈւմ այտերին ցող կա սառած...\nԻսկ թե հանկարծ,\nՍև տքնությամբ ցավը դողա իմ շուրթերին,\nԿաղնու նման ձեր գլուխը բարձր պահեք,\nԵս ձեր մեջ եմ մնում դարձյալ,\nՄնում եմ ես ձեր խոհերի, կյանքի, վարքի\nԿարմիր դեսպան..."}},{"title":{"hy":"ԼԵՌԱՆ ՇՈՒՐԹԻՆ"},"group":{"hy":"353"},"text":{"hy":"Լեռան շուրթին՝ զեփյուռի հոտ,\nԶեփյուռի դող,\nԶեփյուռի շող,\nԾունկը ծալած մասրենու բոց,\nԱրևի լաց լեռան շուրթին։\n\nԼեռան շուրթին՝ տոթ ու սարսուռ,\nԱհեղություն ծիածանի,\nԱնդունդների վրա քնող\nԿապը կտրած մի ցուլ քամի։\n\nԵվ հավքերի ձվադրում,\nԵվ հավքերի իրարանցում,\nԿակաչների խարույկ ու եռք,\nՄրջյունների խնջույք ու երթ,\nՈւ փակբերան ավեր մի վանք\nԼեռան շուրթին։\n\nԼեռան շուրթին՝ ամպերի պար,\nԵվ հեռացող հովիվների հետքերի ճաք,\nՋրվեժների անմեղություն,\nՁորից փախած մեղուների հեծելազոր,\nԵվ քրքրված քարե կածան,\nՔարե կղզի և քարե կուռք լեռան շուրթին։\n\nԼեռան շուրթին՝ զեփյուռի դող,\nՄոր ձեռքի շող,\nՄամուռի ցող,\nՈւ տաք անդորր լեռան շուրթին, լեռան շուրթին։"}},{"title":{"hy":"ՄԵՆԱԿՈՒԹՅՈՒՆՍ"},"group":{"hy":"353"},"text":{"hy":"Մենակությունս՝ համբերությունս է,\nՁմռան օրերի փխրության խորքում.\n\nՄենակությունս՝ համր արյունս է,\nԵվ ցուրտ աչքերիս սառը զնգոցը.\n\nՄենակությունս՝ երջանկություն է,\nԳժտվածների դառնության խորքում։\n\nԵթե կուռք եք դուք,\nԵվ ցավեր զսպող մատներ մոգական,\nՄանրեցե՛ք,\nԾախե՛ք մենակությունս..."}},{"title":{"hy":"ԻՆՉ ԱՆԵՄ"},"group":{"hy":"353"},"text":{"hy":"Ի՞նչ անեմ՝ մրսում եմ դանդաղ վառվելուց,\nԻնքս ինձ զսպելուց ծերանում եմ ես.\nԻ՞նչ անեմ՝ ծալվում եմ ես պղտորվելուց,\nԻնքս ինձ խաբելուց սարսափում եմ ես։\n\nԹռչում եմ, սուզվում ու տեղ չեմ հասնում,\nԵս քեզ փնտրում եմ, չեմ գտնում երբեք.\nԼցվում եմ աստղով, բայց թե չեմ ծաղկում,\nՈւ կորչում եմ ես՝ չհասած եզերք։\n\nԻմ նոր երգի մեջ միշտ փխրուն եմ ես,\nՈւ կույրի նման չեմ ջոկում գույներ.\nԱմեն մի գիշեր քնում եմ հարուստ,\nԲայց վեր եմ կենում միշտ սնանկացած..."}},{"title":{"hy":"ԳՐԻԳՈՐԻԿԻՍ"},"group":{"hy":"353"},"text":{"hy":"Երբ մութն իջնի սարին, սարի համար լացեմ,\nՄի խուրձ կրակ անեմ կրակներիս մրսած.\nԱմպը նստի ուսիդ, ուսն իմ հենակ անեմ,\nԲալենու ճյուղն հասնի, շարեմ շուրթիդ լռած։\n\nԵվ մասրենու բոցով դառնությունդ ներկեմ,\nՀոգնությունդ լծեմ քարափներիդ շիկնած.\nԽղճմտանքի կարոտ լռությունդ կիսեմ,\nԽռովքներդ կապեմ եղինջներին քնած։\n\nՀանդգնությամբ զարթնած տառապանքդ\nլացեմ,\nԹե չարն հողում ուռչի՝ առանց գութան վարեմ...\nՇեկ երկնքով տանեմ բույրը ցորեն հասկի,\nԹող լույսի տոն լինի՝ ճերմակ, ճերմակ հացի..."}},{"title":{"hy":"ԵՂԵՐԵՐԳ"},"group":{"hy":"353"},"text":{"hy":"Նրան են տանում լցված կապույտով,\nԵս հեկեկացի.\nԴեռ երեկ այստեղ նա տրտնջալով\nԿանչեց ինձ հացի։\n\nՆրան են տանում լցված նարինջով,\nԱնհույս ճչացի.\nԴեռ երեկ այստեղ կրակ էր անում\nՆոր խորովածի։\n\nՆրան են տանում լցված գիշերով,\nԵս նվաղեցի.\nՆա երեկ այստեղ բույրն էր բուրվառում\nԻր ծաղկանոցի..."}},{"title":{"hy":"ԻՄ ԱՆԴՆԴԱԽՈՐ"},"group":{"hy":"353"},"text":{"hy":"Իմ անդնդախոր լացող ժայռերին\nԱրևը բախտի զորությամբ զնգաց։\nԳոլորշին ելավ սուլոցով անհաշտ,\nՁուլվեց ամպերի սև փեշերի մեջ։\nՄթնեց ցերեկը։\nՀետո ամպրոպի կանչող բոցերը\nՊատռեցին ամպերի հնացած շապիկը,\nԵվ արյունն ամպի ցերեկ
